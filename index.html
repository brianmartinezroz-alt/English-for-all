}

function irALeccionDe(n){
  if(!MAT||!MAT.length){ avisito('No hay material cargado.'); return; }
  var idx=(contenidoDe(n)-1)%MAT.length;
  if(idx<0)idx=0;
  sIdx=idx; it=0; attempts=[]; vistos={}; t0=Date.now();
  try{ correr(); setTimeout(pintarBarraJefe,120); }
  catch(err){ avisito('Esa lección truena: '+String(err).slice(0,70)); }
}

// El alumno se ASOMA: ve el tema y una probadita de la gramática,
// pero el detalle completo solo aparece cuando de verdad llega ahí.
function asomarseALeccion(n,actual){
  if(!MAT||!MAT.length)return;
  var idx=(contenidoDe(n)-1)%MAT.length;
  var S=MAT[idx]; if(!S)return;
  var abierta=(n<=actual);

  var items=S.items||[];
  var regla=null, palabras=[];
  items.forEach(function(x){
    if(!regla&&x.k==='regla'&&x.titulo)regla=x.titulo;
    if(x.k==='phrasal'&&x.en)palabras.push(x.en);
    if(x.k==='idiom'&&x.en)palabras.push(x.en);
  });

  var h='<div class="asom-caja">'+
    '<div class="asom-tag">Parada '+n+(abierta?'':' · todavía cerrada')+'</div>'+
    '<div class="asom-t">'+esc(S.t||'')+'</div>'+
    (S.obj?'<div class="asom-o">'+esc(S.obj)+'</div>':'')+
    '<div class="asom-b"><div class="asom-h">De qué va</div>'+
      '<div class="asom-i">'+esc(S.hoy||'practicar')+'</div></div>'+
    (regla?'<div class="asom-b"><div class="asom-h">La gramática que toca</div>'+
      '<div class="asom-i">'+esc(regla)+'</div></div>':'')+
    (palabras.length?'<div class="asom-b"><div class="asom-h">Palabras nuevas</div>'+
      '<div class="asom-i">'+esc(palabras.slice(0,3).join(' · '))+'</div></div>':'')+
    '<div class="asom-vela">'+
      (abierta
        ? 'Lo demás lo vas viendo dentro, ejercicio por ejercicio.'
        : 'El resto se abre cuando llegues aquí. Primero lo de antes.')+
    '</div>'+
    '<button class="btn'+(abierta?'':' ghost')+'" id="asomir">'+
      (n===actual?'Empezar esta':(abierta?'Ya la pasaste':'Aún no llegas'))+'</button>'+
    '<button class="btn ghost" id="asomcerrar" style="margin-top:8px">Cerrar</button>'+
  '</div>';

  var v=document.createElement('div');
  v.className='asom-velo'; v.id='asomvelo'; v.innerHTML=h;
  document.body.appendChild(v);
  v.onclick=function(e){ if(e.target===v)v.remove(); };
  var cerrar=document.getElementById('asomcerrar');
  if(cerrar)cerrar.onclick=function(){v.remove();};
  var ir=document.getElementById('asomir');
  if(ir)ir.onclick=function(){
    v.remove();
    if(n===actual){ sIdx=idx; it=0; attempts=[]; t0=Date.now(); correr(); }
    else if(abierta)avisito('Ya la pasaste. Lo que se te atoró vuelve solo en una parada de repaso.');
    else avisito('Todavía no llegas aquí. Termina las de antes y se abre sola.');
  };
}

// El 3D tarda un momento en descomprimirse. Si la pantalla del mapa se pintó
// antes, se quedaba con el tablero viejo para siempre. Ahora, en cuanto el 3D
// está listo, se repinta solo.
window.EFA_alMontar=function(){
  try{
    if(MAPA3D_APAGADO)return;
    var enMapa = APP && (APP.querySelector('.mapcab') || APP.querySelector('#tablero') ||
                         APP.querySelector('.lienzo3d'));
    if(enMapa) mapa();
  }catch(e){}
};

function zonasDelNivel(){
  var n=(P&&P.nivel)||'Pre-A1';
  return ZONAS_NIVEL[n]||ZONAS_NIVEL['Pre-A1'];
}

function montarMapa3D(host,c){
  if(MAPA3D_APAGADO)return false;
  var M=window.EFA_MAPA3D;
  if(!M||!M.listo||!M.crear)return false;
  try{
    if(MAPA3D&&MAPA3D.dispose)MAPA3D.dispose();
    // El mapa fija su propio tamaño y maneja su propio scroll. Hay que
    // pasarle las medidas reales de la pantalla, no dejarlo en 390x844.
    var an=Math.max(280, host.clientWidth  || window.innerWidth  || 390);
    var al=Math.max(360, host.clientHeight || window.innerHeight || 844);
    MAPA3D=M.crear(host,{
      totalStops:PARADAS,
      currentStop:Math.max(0,(c.parada||1)-1),
      zones:zonasDelNivel(),
      width:Math.round(an),
      height:Math.round(al),
      reviewEvery:7,
      examEvery:14,
      background:getComputedStyle(document.body).getPropertyValue('--crema').trim()||'#F5F1E8',
      onSelect:function(i,info){
        var n=i+1;
        if(JEFE_LIBRE){ irALeccionDe(n); return; }
        asomarseALeccion(n,c.parada);
      }
    });
    if(!MAPA3D)return false;
    return true;
  }catch(e){
    console.warn('no pude montar el mapa 3D:',e);
    MAPA3D=null;
    return false;
  }
}

function mapa3DoViejo(){
  var c; try{ c=progreso(); }catch(e){ c={parada:1}; }
  var M=window.EFA_MAPA3D;
  if(MAPA3D_APAGADO)return false;
  if(!M){ EFA_MOTIVO='no se cargó el bloque del mapa'; return false; }
  if(M.error){ EFA_MOTIVO=M.error; return false; }
  if(!M.listo){ EFA_MOTIVO='todavía descomprimiendo'; return false; }

  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='';
  APP.innerHTML='<div id="lienzo3d" class="lienzo3d"></div>'+
    '<div class="cab3d">'+
      '<div class="cab3d-niv">'+esc((P&&P.nivel)||'Pre-A1')+'</div>'+
      '<div class="cab3d-par">Parada '+c.parada+' de '+PARADAS+'</div>'+
    '</div>'+
    '<button class="btn3d" id="ir3d">Empezar la parada '+c.parada+'</button>';

  var host=document.getElementById('lienzo3d');
  if(!host)return false;
  // se espera un cuadro para que el navegador ya le haya dado medidas
  requestAnimationFrame(function(){
    if(!montarMapa3D(host,c)){
      EFA_MOTIVO=EFA_MOTIVO||'createLevelMap falló';
      MAPA3D_APAGADO=true;
      mapaViejo();
    }
  });

  var b=document.getElementById('ir3d');
  if(b)b.onclick=function(){ try{correr();}catch(e){} };
  marcarTab('mapa');
  return true;
}

function mapaViejo(){
  var c=progreso();
  var tr=tramoDe(c.parada);
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='';

  var t=tableroSVG(c.parada,PARADAS);
  var h='<div class="mapcab">'+
    '<div class="maptramo" style="background:'+tr.color+'">'+esc(tr.nombre)+'</div>'+
    '<div class="mapsub">'+esc(tr.sub)+'</div>'+
    '<div class="mapfila">'+
      '<div class="mapdato"><b>'+c.parada+'</b><span>de '+PARADAS+'</span></div>'+
      '<div class="mapdato"><b>'+puntosLibres()+'</b><span>puntos</span></div>'+
      '<div class="mapdato"><b>'+diasSeguidos(c.dias)+'</b><span>días seguidos</span></div>'+
    '</div></div>';

  h+='<div class="tabwrap">'+t.svg+
     '<div class="aqui-pill">Aquí vas · '+c.parada+'</div></div>';

  h+='<div class="mapbotones">'+
     '<button class="btn" id="seguir">'+
       (!yaPersonalizo()?'Empezar: arma tu personaje'
         :(esRepaso(c.parada)?'Repasar lo que se te atora':'Practicar la parada '+c.parada))+'</button>'+
     (yaPersonalizo()
       ?'<button class="btn ghost" id="miperfil" style="margin-top:8px">Mi avance y mi avatar</button>'
       :'<p class="tiny" style="margin-top:10px">Son unos minutos. Con tus respuestas armo tus frases: '+
        'no son de un libro, salen de tu trabajo.</p>')+
     '</div>';

  APP.innerHTML=h;

  document.getElementById('seguir').onclick=function(){
    // sin sus respuestas, el material sería genérico: mejor mandarlo a armarlo
    if(!yaPersonalizo()){ personalizar(); return; }
    if(esRepaso(c.parada)){ arrancarRepaso(); return; }
    sIdx=(contenidoDe(c.parada)-1)%MAT.length;it=0;attempts=[];t0=Date.now();correr();
  };
  var mp=document.getElementById('miperfil');
  if(mp)mp.onclick=perfilAlumno;

  // No se regresa. Lo que se le atoró vuelve solo, en las casillas de repaso.
  APP.querySelectorAll('.lo').forEach(function(g){
    var n=+g.getAttribute('data-n');
    g.style.cursor='pointer';
    g.onclick=function(){
      if(JEFE_LIBRE){ irALeccionDe(n); return; }   // el jefe entra a donde sea
      asomarseALeccion(n,c.parada);
    };
  });

  // si acaba de avanzar, el muñeco brinca a su nueva loseta
  // la primera vez que ve el tablero, se le explica con el dedo encima
  if(!JEFE_LIBRE&&!D.tutorVisto&&!TUTOR_VIVO&&document.body&&document.body.appendChild){
    setTimeout(arrancarTutor,420);
  }else if(!yaPersonalizo()){
    say('Este es tu camino. Toca el botón para armar tu personaje y tus frases.','es-MX');
  }else if(SALTAR_DESDE&&SALTAR_DESDE<c.parada){
    var de=SALTAR_DESDE; SALTAR_DESDE=0;
    setTimeout(function(){
      saltarA(de,c.parada,t.base,t.alto,function(){
        if(idxTramo(de)!==idxTramo(c.parada)){
          say('Llegaste a un tramo nuevo: '+tr.nombre+'.','es-MX');
        }
      });
    },420);
  }else{
    say('Vas en la parada '+c.parada+'. '+tr.sub+'.','es-MX');
  }
}

function pantallaPersonaje(alTerminar){
  var c=progreso();

  if(!a.sexo)a.sexo='h';
  if(!a.corte)a.corte='corto';
  if(!a.pelo_color)a.pelo_color='#3B2A1C';

  function pinta(){
    APP.innerHTML='<div class="qcard">'+
      '<div class="qlbl">Tu personaje</div>'+
      '<div class="qtxt">Así te vas a ver en el camino.</div>'+
      '<div class="qsub">Empiezas con playera, mezclilla y botas. El casco, el chaleco y lo demás se ganan practicando.</div>'+
      '<div class="pers"><svg viewBox="0 0 100 100">'+munecoSVG(50,92,a,1.15)+'</svg></div>'+
      '<div class="qlbl">Quién eres</div>'+
      '<div class="opcs" id="sx">'+
        '<button data-v="h" class="'+(a.sexo==='h'?'sel':'')+'">Hombre</button>'+
        '<button data-v="m" class="'+(a.sexo==='m'?'sel':'')+'">Mujer</button>'+
      '</div>'+
      '<div class="qlbl">Tu cabello</div>'+
      '<div class="opcs" id="ct">'+
        '<button data-v="corto" class="'+(a.corte==='corto'?'sel':'')+'">Corto</button>'+
        '<button data-v="largo" class="'+(a.corte==='largo'?'sel':'')+'">Largo</button>'+
      '</div>'+
      '<div class="pelos" id="pl">'+
        PELOS.map(function(p){
          return '<button data-v="'+p[0]+'" title="'+p[1]+'" aria-label="Cabello '+p[1]+'" '+
            'style="background:'+p[0]+'" class="'+(a.pelo_color===p[0]?'sel':'')+'"></button>';
        }).join('')+
      '</div>'+
      '<button class="btn" id="listo">Este soy yo</button>'+
      '</div>';

    function grupo(id,campo){
      var o=document.getElementById(id); if(!o)return;
      o.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){ a[campo]=b.getAttribute('data-v'); pinta(); };
      });
    }
    grupo('sx','sexo'); grupo('ct','corte'); grupo('pl','pelo_color');
    document.getElementById('listo').onclick=function(){
      var cc=progreso();
      cc.avatar=cc.avatar||{};
      cc.avatar.sexo=a.sexo; cc.avatar.corte=a.corte; cc.avatar.pelo_color=a.pelo_color;
      guardarProgreso(cc);
      if(alTerminar)alTerminar(); else mapa();
    };
  }
  say('Arma tu personaje. Escoge quién eres y cómo traes el cabello.','es-MX');
  pinta();
}

// Enseña cómo se le vería ESA prenda a él, con su cara y su pelo.

function prendaEnMuneco(id,mios){

  return '<svg viewBox="18 18 64 76" class="pmun" aria-hidden="true">'+munecoSVG(50,90,base,1)+'</svg>';

function perfilAlumno(){
  // Se llega aquí desde el cajón, y el cajón está disponible desde el minuto
  // uno: puede no haber perfil todavía. Antes esto reventaba en silencio.
  if(!P){
    APP.innerHTML=atras()+'<div class="qcard"><div class="qlbl">Tu avance</div>'+
      '<div class="qtxt">Todavía no hay nada que mostrarte.</div>'+
      '<div class="qsub">En cuanto armes tu personaje y contestes unas preguntas, '+
      'aquí vas a ver tu curva, tus frases dominadas y tu muñeco.</div>'+
      '<button class="btn" id="vamos">Armar mi personaje</button></div>';
    ligarAtras(function(){mapa();});
    var v=document.getElementById('vamos');
    if(v)v.onclick=personalizar;
    return;
  }
  var c=progreso();
  var nv=(P&&P.nivel_n)||0;
  var mios=c.avatar||{};
  var h=atras()+'<div class="qcard"><div class="qlbl">Tu avance</div>'+
    '<div class="miMuneco">'+
      '<svg viewBox="0 0 100 100" class="munecoGde" aria-label="Tu muñeco">'+
        munecoSVG(50,90,mios,1.05)+'</svg>'+
    '</div>'+
    '<div class="qtxt">'+esc(P.nombre)+'</div>'+
    '<div class="qsub">Nivel '+esc((P&&P.nivel)||'Pre-A1')+' · parada '+c.parada+' de '+PARADAS+'</div>'+
    '<div class="mapfila" style="margin-bottom:16px">'+
      '<div class="mapdato"><b>'+(load().sesiones||[]).length+'</b><span>sesiones</span></div>'+
      '<div class="mapdato"><b>'+cuantasDominadas().dominadas+'</b><span>frases dominadas</span></div>'+
      '<div class="mapdato"><b>'+c.puntos+'</b><span>puntos ganados</span></div>'+
    '</div>'+
    curvaDeAvance()+
    '<div class="qlbl" style="margin-top:18px">Tu avatar · te quedan '+puntosLibres()+' puntos</div>'+
    '<div class="prendas">'+
      PRENDAS.map(function(p){
        var bloq=nv<p.nivel;
        var tengo=!!mios[p.id];
        return '<button class="prenda'+(tengo?' mia':'')+(bloq?' bloq':'')+'" data-id="'+p.id+'">'+
          '<span class="pico">'+prendaEnMuneco(p.id,mios)+'</span>'+
          '<span class="pnom">'+esc(p.nombre)+'</span>'+
          '<span class="ppre">'+(bloq?'Se abre en '+['Pre-A1','A1','A2','B1'][p.nivel]
            :(tengo?'ya es tuya':(p.precio===0?'gratis':p.precio+' pts')))+'</span></button>';
      }).join('')+
    '</div></div>';
  APP.innerHTML=h;
  ligarAtras(function(){mapa();});
  APP.querySelectorAll('.prenda').forEach(function(b){
    b.onclick=function(){
      var p=PRENDAS.filter(function(x){return x.id===b.dataset.id;})[0];
      if(!p||nv<p.nivel)return;
      var cc=progreso();
      cc.avatar=cc.avatar||{};
      if(cc.avatar[p.id])return;
      if(puntosLibres()<p.precio)return;
      cc.avatar[p.id]=1;cc.gastados=(cc.gastados||0)+p.precio;
      guardarProgreso(cc);perfilAlumno();
    };
  });
}

// la curva: cuántas frases produjo en cada sesión
function curvaDeAvance(){
  var ses=(load().sesiones||[]).slice(-8);
  if(ses.length<2)return '<p class="tiny" style="text-align:left">Con dos sesiones ya puedes ver tu curva.</p>';
  var vals=ses.map(function(r){
    return (r.intentos||[]).filter(function(a){return a.oido&&a.tipo!=='pista';}).length;
  });
  var max=Math.max.apply(null,vals)||1;
  return '<div class="curva"><span class="hl">Frases que dijiste en cada sesión</span>'+
    '<div class="cbarras">'+vals.map(function(v,i){
      return '<div class="cb"><i style="height:'+Math.round(v/max*100)+'%"></i><span>'+v+'</span></div>';
    }).join('')+'</div>'+
    '<p class="tiny" style="text-align:left;margin:8px 0 0">De '+vals[0]+' a '+vals[vals.length-1]+' frases.</p></div>';
}

/* ═══════════ lo que Brian corrigió ═══════════ */
// El bucle: Brian firma en la hoja y escribe la corrección; la app la recoge
// y esa frase entra en la práctica siguiente, marcada como suya. Sin esto,
// la firma se queda en la hoja y el alumno nunca la ve.
var DE_BRIAN=[];
function pedirCorrecciones(cb){
  // sin conexión o sin endpoint: se usa lo último que se guardó, no se vacía.
  // Así el alumno sigue viendo sus tareas aunque abra la app sin internet.
  if(!DATOS_ENDPOINT||!P||!P.nombre){
    try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
    cb&&cb(DE_BRIAN);return;
  }
  fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'correcciones',nombre:P.nombre})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var c=(d&&d.ok&&d.correcciones)||[];
      DE_BRIAN=c;
      try{var g=load();g.deBrian=c;save(g);D=g;}catch(e){}
      cb&&cb(c);
    })
    .catch(function(){
      try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
      cb&&cb(DE_BRIAN);
    });
}
function frasesDeBrian(){
  return DE_BRIAN.filter(function(x){return x.frase;}).slice(0,3).map(function(x){
    return {k:'model',en:x.frase,es:'Esta te la corrigió Brian. Vamos con la forma buena.',deBrian:true};
  });
}
function mensajeDeBrian(){
  var m=DE_BRIAN.filter(function(x){return x.mensaje;})[0];
  return m?m.mensaje:'';
}
// Las tareas que Brian le dejó (texto, su audio, videos, links, ejercicios).
// Cada una trae: titulo, nota, audio (base64 o url), videos[], links[], hecha.
function tareasDeBrian(){
  return DE_BRIAN.filter(function(x){return x.tipo==='tarea';});
}
// El material bonus: aparece en el mapa, da tokens fijos por HACERLO (no por nota).
function bonusDeBrian(){
  return DE_BRIAN.filter(function(x){return x.tipo==='bonus';});
}
// se recuerda localmente qué tareas/bonus ya cerró, para no repagar tokens
function hechosDeBrian(){var d=load();return d.hechosBrian||{};}
function marcarHecho(id,tokens){
  var d=load();d.hechosBrian=d.hechosBrian||{};
  if(d.hechosBrian[id])return false;   // ya estaba, no se vuelve a pagar
  d.hechosBrian[id]=hoyISO();
  if(tokens){d.camino=d.camino||{};d.camino.puntos=(d.camino.puntos||0)+tokens;}
  save(d);D=d;
  // se le avisa al servidor que ya la hizo, para que Brian lo vea en su panel
  if(DATOS_ENDPOINT&&P&&P.nombre){
    try{fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({accion:'tarea_hecha',nombre:P.nombre,id:id})});}catch(e){}
  }
  return true;
}
function tareasPendientes(){
  var h=hechosDeBrian();
  return tareasDeBrian().filter(function(t){return !h[t.id];}).length;
}

/* ═══════════ repetición espaciada ═══════════ */
// No basta repasar lo de ayer. Cada frase lleva su historial y su próxima
// fecha: si sale bien, el intervalo crece (1, 3, 7, 16 días); si sale mal,
// vuelve a empezar. Es el sistema Leitner, adaptado a frases habladas.
var DIAS=[1,3,7,16,35];
function hoyISO(){return new Date().toISOString().slice(0,10);}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function memoria(){var d=load();return d.memoria||{};}
function guardarMemoria(mem){var d=load();d.memoria=mem;save(d);D=d;}

function registrarEnMemoria(frase,pct){
  if(!frase)return;
  var mem=memoria(),k=clave(frase);
  var m=mem[k]||{frase:frase,paso:0,vistas:0,fallos:0};
  m.vistas++;
  if(pct!==null&&pct!==undefined&&pct>=80){
    m.paso=Math.min(m.paso+1,DIAS.length-1);
  }else{
    m.paso=0;m.fallos++;
  }
  m.ultima=hoyISO();
  m.proxima=enDias(DIAS[m.paso]);
  m.dominada=(m.paso>=3&&m.fallos===0)||m.paso>=4;
  // si venía fallando y ahora salió, entra a vigilancia: vuelve una vez más
  if(pct>=80&&m.fallos>0&&m.paso>=2)retirarError(m.frase);
  mem[k]=m;guardarMemoria(mem);
}
// lo que toca repasar hoy: vencido y no dominado, lo más atrasado primero
function tocaHoy(max){
  var mem=memoria(),hoy=hoyISO(),out=[];
  Object.keys(mem).forEach(function(k){
    var m=mem[k];
    if(m.dominada)return;
    if(!m.proxima||m.proxima<=hoy)out.push(m);
  });
  out.sort(function(a,b){return (a.proxima||'').localeCompare(b.proxima||'')||b.fallos-a.fallos;});
  return out.slice(0,max||3).map(function(m){
    return {k:'model',en:m.frase,es:'Esta ya la practicaste. A ver si te sale sola.',repaso:true};
  });
}
function cuantasDominadas(){
  var mem=memoria(),n=0,t=0;
  Object.keys(mem).forEach(function(k){t++;if(mem[k].dominada)n++;});
  return {dominadas:n,total:t};
}

// Pre-A1: todo en español. A1: inglés con el español debajo, más chico.
// A2: inglés, y el español solo si lo pide. B1: inglés solo.
function modoIdioma(){
  var n=(P&&P.nivel_n);
  if(n===undefined||n===null)n=0;
  if(n<=0)return 'es';      // todo español
  if(n===1)return 'both';   // inglés arriba, español abajo
  if(n===2)return 'en-es';  // inglés, español a un toque
  return 'en';              // solo inglés
}

function bilingue(en,es,clase){

                       '<span class="ins-es">'+esc(es)+'</span></div>';

                       '<button class="ins-b" data-es="'+esc(es)+'">¿qué dice?</button></div>';
  return '<div class="'+clase+'"><span class="ins-en">'+esc(en)+'</span></div>';
}

// La gente no contesta con el dato pelón: dice "me llamo Brian" o "soy chef".
// Aquí se quitan esos arranques para quedarnos con lo que importa.
function limpiarNombre(v){
  var t=String(v||'').replace(/[.,;:!¡?¿]/g,' ').trim();
  // se van los arranques y las muletillas, estén donde estén
  var basura=/^(hola|buenos|buenas|d[ií]as|tardes|noches|me|mi|yo|nombre|es|llamo|soy|este|pues|bueno|eh|mmm|ah|my|name|is|i|am|im|a|el|la|se[ñn]or|se[ñn]ora)$/i;
  var p=t.split(/\s+/).filter(Boolean).filter(function(w){
    return !basura.test(w.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,''));
  })[0]||'';
  p=p.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,'');
  if(!p)return '';
  return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase();
}
function limpiarOficio(v){
  return String(v||'').trim()
    .replace(/^(pues[,\s]*|este[,\s]*|bueno[,\s]*)/i,'')
    .replace(/^(yo\s+)?(soy|trabajo\s+de|trabajo\s+como|me\s+dedico\s+a|mi\s+trabajo\s+es)\s+/i,'')
    .replace(/^(un|una|el|la)\s+/i,'')
    .replace(/[.;]+$/,'')
    .trim();
}
function limpiarAccion(v){
  return String(v||'').trim()
    .replace(/^(pues[,\s]*|este[,\s]*|bueno[,\s]*)/i,'')
    .replace(/^(yo\s+)?(hago|me\s+dedico\s+a)\s+/i,'')
    .replace(/[.;]+$/,'')
    .trim();
}

function interpretar(p){
  var t=(p.trabajo_es||'').toLowerCase();
  var oficio=null;
  for(var i=0;i<OFICIOS.length;i++){if(OFICIOS[i][0].test(t)){oficio=OFICIOS[i];break;}}
  if(oficio){
    p.trabajo_en='I am '+oficio[1];
    p.trabajo_et=oficio[1];
    p.lugar_es=p.lugar_es||oficio[2];
    p.lugar_en=p.lugar_en||('I work '+oficio[3]);
    p.reconocido=true;
  }else{
    // no lo reconocí: no invento inglés, lo dejo marcado para que Brian lo corrija
    p.trabajo_en='I have a job.';
    p.trabajo_et=p.trabajo_es;
    p.lugar_es=p.lugar_es||'donde trabajo';
    p.lugar_en=p.lugar_en||'I work every day.';
    p.reconocido=false;
  }
  var a=(p.accion_es||'').toLowerCase(),acc=[];
  ACCIONES_MAP.forEach(function(m){if(m[0].test(a)&&acc.indexOf(m[1])<0)acc.push(m[1]);});
  p.accion_en=acc.length?acc[0]:'I work every day';
  p.accion_en2=acc.length>1?acc[1]:null;
  return p;
}

function nivelDe(pts){

      this.outerHTML='<div class="heard" style="margin-bottom:10px"><div class="hl">quiere decir</div>'+

    };

      var v=document.getElementById('tb').value.trim();

    };

    document.getElementById('nose').onclick=function(){resp.push({q:x.q,r:'',ok:false});i++;paso1();};
    ligarAtras(function(){
      if(i>0){var u=resp.pop();if(u&&u.ok)pts-=NIVEL_Q[i-1].vale;i--;paso1();}
      else{epaso=PASOS.length-1;entrevista();}

    say(nv.txt,'es-MX');

}

function hayIA(){return !!IA_ENDPOINT;}
function pedirIA(accion,datos,ok,falla){
  if(!hayIA()){falla&&falla();return;}
  fetch(IA_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:accion,datos:datos})
  })
  .then(function(r){return r.ok?r.json():null;})
  .then(function(d){ if(d&&d.ok)ok&&ok(d.resultado); else falla&&falla(); })
  .catch(function(){falla&&falla();});
}
function evaluarConIA(rec,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('evaluar',{
    nombre:rec.nombre, nivel:(rec.perfil&&rec.perfil.nivel)||'',
    trabajo:(rec.perfil&&rec.perfil.trabajo_es)||'',
    sesion:rec.titulo,
    intentos:(rec.intentos||[]).map(function(a){
      return {tipo:a.tipo, meta:a.meta, dijo:a.oido, pct:a.pct};
    })
  },function(res){cb&&cb(res);},function(){cb&&cb(null);});
}
function repreguntarConIA(perfil,dicho,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('repreguntar',{nivel:perfil.nivel||'',trabajo:perfil.trabajo_es||'',dijo:dicho},
    function(res){cb&&cb(res);},function(){cb&&cb(null);});
}

var RP_TURNOS=[];
function roleplayConIA(x,dicho,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('roleplay',{
    quien:x.quien||'', ctx:x.ctx||'', nivel:(P&&P.nivel)||'A1',
    trabajo:(P&&P.trabajo_es)||'', dijo:dicho, turnos:RP_TURNOS.slice(-6)
  }, function(res){cb&&cb(res);}, function(){cb&&cb(null);});
}
function seguirRoleplay(x,dicho){
  var caja=document.getElementById('res');
  if(!caja)return;
  RP_TURNOS.push({de:'alumno',txt:dicho});
  caja.insertAdjacentHTML('afterbegin',
    '<div class="bubble-ia pensando" id="rp-esp"><div class="ht">'+esc(x.quien||'')+' está pensando…</div></div>');
  roleplayConIA(x,dicho,function(res){
    var esp=document.getElementById('rp-esp');
    if(esp)esp.remove();
    if(!res||!res.dice){
      var c2=document.getElementById('res');
      if(c2)c2.insertAdjacentHTML('afterbegin',
        '<div class="fb no">No pude traer su respuesta. Toca Siguiente y seguimos.</div>');
      return;
    }
    RP_TURNOS.push({de:'personaje',txt:res.dice});
    var c=document.getElementById('res');
    if(c)c.insertAdjacentHTML('afterbegin',
      '<div class="bubble-ia"><div class="hl">'+esc(x.quien||'te dice')+'</div>'+
      '<div class="ht">'+esc(res.dice)+'</div>'+
      (res.es?'<div class="pes">'+esc(res.es)+'</div>':'')+'</div>');
    say(res.dice,'en-US');
    attempts.push({tipo:'roleplay-ia',meta:res.dice,oido:'',pct:null});
    if(res.fin){
      var b=document.getElementById('mic');
      if(b){b.disabled=true;b.innerHTML='Conversación terminada';}
      var c3=document.getElementById('res');
      if(c3)c3.insertAdjacentHTML('afterbegin',
        '<div class="fb ok">Se acabó la conversación. Lo hiciste bien.</div>');
    }
  });
}
function pedirSeguimiento(dicho){
  if(!hayIA()||!P)return;
  repreguntarConIA(P,dicho,function(res){
    if(!res||!res.pregunta)return;
    var caja=document.getElementById('res')||document.getElementById('body');
    if(!caja)return;
    var d=document.createElement('div');
    d.className='bubble-ia';
    d.innerHTML='<div class="hl">Y dime…</div><div class="ht">'+esc(res.pregunta)+'</div>'+
      (res.es?'<div class="pes">'+esc(res.es)+'</div>':'');
    caja.insertBefore(d,caja.firstChild);
    say(res.pregunta,'en-US');
  });

/* ═══════════ 0 · portada ═══════════ */
function portada(){
  var vuelve=!!P;
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='none';
  var g=saludoDelDia(vuelve);

  var historial=[];
  function pinta(s){
    if(!s||!s.en)s=SALUDOS[0];          // nunca pintar undefined
    if(s.reg==null)s.reg=0;
    var vistos=(D.saludosVistos||[]).length;
    APP.innerHTML='<div class="splash" id="sp">'+
      '<div class="sp-mark">'+
        '<svg viewBox="0 0 96 96" aria-hidden="true">'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="rgba(4,52,44,.13)" stroke-width="5"/>'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="#1D9E75" stroke-width="5" '+
            'stroke-linecap="round" stroke-dasharray="66 185" transform="rotate(-90 48 48)"/>'+
          '<circle cx="48" cy="48" r="9" fill="#1D9E75"/>'+
        '</svg>'+
      '</div>'+
      '<div class="sp-greet" id="gr">'+esc(s.en)+(vuelve?'<span class="sp-nm">'+esc(P.nombre)+'.</span>':'')+'</div>'+
      '<div class="sp-es">'+esc(s.es)+'</div>'+
      '<div class="sp-reg">'+REGISTRO[s.reg]+'</div>'+
      '<div class="sp-nav">'+
        (historial.length?'<button class="sp-b" id="ant">← Anterior</button>':'')+
        '<button class="sp-b" id="otro">Otro saludo ↻</button>'+
      '</div>'+
      '<button class="btn sp-go" id="cta">Continuar</button>'+
      '<div class="sp-name">English For All</div>'+
      '<div class="sp-cuenta">'+vistos+' de '+SALUDOS.length+' saludos vistos</div>'+
      '</div>';
    ligar(s);
  }

  var hablado=false,avanzado=false;
  var intentos=0;
  function saludar(s){
    hablado=true;
    soloTuVoz(s.en,function(sono){
      if(sono||intentos>=6)return;
      // ese saludo no está grabado: se cambia por otro que sí lo esté,
      // para que nunca se oiga la voz sintética en esta pantalla
      intentos++;
      var otro=saludoDelDia(vuelve);
      if(otro.en===s.en)return;
      g=otro;pinta(g);saludar(g);
    });
  }
  function avanzar(){
    if(avanzado)return;
    avanzado=true;
    if(!hablado)saludar(g);
    vioSaludo=true;D.vista=1;save(D);
    var sp=document.getElementById('sp');
    if(sp)sp.classList.add('out');
    setTimeout(router,340);
  }
  function ligar(s){
    var gr=document.getElementById('gr');
    if(gr)gr.onclick=function(e){e.stopPropagation();saludar(s);};
    var ot=document.getElementById('otro');
    if(ot)ot.onclick=function(e){
      e.stopPropagation();
      historial.push(g);
      g=saludoDelDia(vuelve);
      pinta(g);
      saludar(g);
    };
    var an=document.getElementById('ant');
    if(an)an.onclick=function(e){
      e.stopPropagation();
      if(!historial.length)return;
      g=historial.pop();
      pinta(g);
      saludar(g);
    };
    var cta=document.getElementById('cta');
    if(cta)cta.onclick=function(e){e.stopPropagation();avanzar();};
  }

  pinta(g);

  cargarVoces(function(){
    aplicarPreferencias();
    // se intenta de entrada; casi todos los navegadores lo bloquean hasta
    // que hay un toque, y para eso está el listener de abajo
    saludar(g);
  });

  // el primer toque libera el audio en los navegadores que lo bloquean
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev,function(){if(!hablado)saludar(g);},{once:true});
  });
}

    h+='<textarea class="typebox" id="tx" placeholder="'+s.ph+'">'+
       esc(s.id==='nombre'?(edatos.nombre||''):'')+'</textarea>'+
       (HAY_MIC?'<button class="btn ghost" id="dic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
       '<button class="btn" id="ok" style="margin-top:8px">Continuar</button>';
  }else{
    h+='<div class="pick" id="pk">'+s.ops.map(function(o,i){
      return '<button data-i="'+i+'">'+esc(o[0])+'<i>'+esc(o[1])+'</i></button>';}).join('')+
      (s.otra?'<button data-otra="1" class="otra">'+esc(s.otra)+'</button>':'')+'</div>'+
      (s.otra?'<textarea class="typebox" id="txotra" placeholder="'+esc(s.otraPh||'')+'" style="display:none;min-height:56px"></textarea>':'')+

    if(d)d.onclick=function(){
      var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
      listen('es-MX',function(t){
          document.getElementById('tx').value=t;

          document.getElementById('tx').parentNode.insertBefore(av,document.getElementById('tx').nextSibling);

        return;
      }
      if(s.id==='nombre'){
        var n=limpiarNombre(v);
        if(!n){
          var av2=document.getElementById('avisovacio');
          if(!av2){
            av2=document.createElement('div');
            av2.id='avisovacio';av2.className='tst-r';
            av2.innerHTML='<span class="no2">No entendí tu nombre. Escríbelo solo, sin nada más.</span>';
            document.getElementById('tx').parentNode.insertBefore(av2,document.getElementById('tx').nextSibling);
          }
          return;
        }
        edatos.nombre=n;
      }else{
        edatos[s.id+'_es']=(s.id==='trabajo')?limpiarOficio(v):(s.id==='accion'?limpiarAccion(v):v);
        edatos[s.id+'_en']=null;   // lo traduce el analizador
      }
      avanzar();
    };
  }else{
    var sel=[],otraOn=false;
    var caja=document.getElementById('txotra');
    function revisa(){
      var hay=sel.length>0||(otraOn&&caja&&caja.value.trim());
      document.getElementById('ok').disabled=!hay;
    }
    APP.querySelectorAll('#pk button').forEach(function(b){
      b.onclick=function(){
        if(b.dataset.otra){
          otraOn=!otraOn;
          b.classList.toggle('sel',otraOn);
          if(caja){caja.style.display=otraOn?'block':'none';if(otraOn)caja.focus();}
          revisa();return;
        }
        var i=+b.dataset.i;
        if(s.multi){
          var k=sel.indexOf(i);
          if(k>=0){sel.splice(k,1);b.classList.remove('sel');}
          else{sel.push(i);b.classList.add('sel');say(s.ops[i][1],'en-US');}
        }else{
          APP.querySelectorAll('#pk button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');sel=[i];say(s.ops[i][1],'en-US');
        }
        revisa();
      };
    });
    if(caja)caja.oninput=revisa;
    document.getElementById('ok').onclick=function(){
      var es=sel.map(function(i){return s.ops[i][0];});
      var en=sel.map(function(i){return s.ops[i][1];});
      if(otraOn&&caja&&caja.value.trim()){
        es.push(caja.value.trim());
        edatos[s.id+'_otra']=caja.value.trim();
      }
      if(!es.length)return;
      edatos[s.id+'_es']=es.join(' y ');
      edatos[s.id+'_en']=en.length?en.join(' and '):null;
      avanzar();
    };
  }
}

  if(!reconoce(edatos.trabajo_es)){familiaPregunta(pruebaNivel);return;}
  pruebaNivel();
}

function ultimoDato(){
  // qué rescatar de la vez pasada, para que la sesión no arranque en frío
  if(!D.sesiones.length)return null;
  var r=D.sesiones[D.sesiones.length-1];
  var reps=(r.intentos||[]).filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  if(reps.length){
    var peor=reps.reduce(function(a,b){return b.pct<a.pct?b:a;});
    if(peor.pct<80)return {tipo:'repetir',meta:peor.meta,pct:peor.pct,ses:r.s};
  }
  var libre=(r.intentos||[]).filter(function(a){return a.tipo==='free'&&a.oido;});
  if(libre.length)return {tipo:'dijo',texto:libre[libre.length-1].oido,ses:r.s};
  if((r.intentos||[]).some(function(a){return a.tipo==='pista';}))return {tipo:'pista',ses:r.s};
  return {tipo:'ok',ses:r.s};
}

// Lee la lección y explica QUÉ va a ver el alumno: la regla de gramática,
// las palabras nuevas, qué va a oír y qué va a decir. Antes solo decía el tema.
function loQueViene(S){
  var it=(S&&S.items)||[];
  var gram=[], voc=[], oir=[], hab=[];

  var NOMBRA={
    idea:'entender de qué se trata sin traducir cada palabra',
    detalle:'cazar un dato exacto: una hora, un número, un lugar',
    dosc:'distinguir dos frases que suenan casi igual',
    segm:'separar palabras en habla rápida',
    dicto:'escribir lo que oigas',
    acento:'la misma frase en cuatro países distintos',
    recuento:'oír una historia y contarla con tus palabras'
  };

  it.forEach(function(x){
    if(x.k==='regla'&&x.titulo)      gram.push(x.titulo);
    else if(x.k==='cazar'&&x.buena)  gram.push('corregir "'+x.mala+'" → "'+x.buena+'"');
    else if(x.k==='transf'&&x.pide)  gram.push(String(x.pide).replace(/\.$/,''));
    else if(x.k==='hueco'&&x.bien)   gram.push('escoger la forma correcta del verbo');
    else if(x.k==='ordenar')         gram.push('el orden de las palabras');
    else if(x.k==='phrasal'&&x.en)   voc.push(x.en+' — '+(x.es||''));
    else if(x.k==='idiom'&&x.en)     voc.push(x.en+' (expresión)');
    else if(x.k==='palabra'&&x.en)   voc.push(x.en+' — '+(x.es||''));
    else if(x.k==='pares')           voc.push('dos sonidos parecidos: '+(x.a||'')+' / '+(x.b||''));
    else if(x.k==='deletreo'&&x.bien)voc.push('deletrear "'+x.bien+'"');
    else if(NOMBRA[x.k])             oir.push(NOMBRA[x.k]);
    else if(x.k==='roleplay')        hab.push('contestarle a '+(x.quien||'alguien')+', hablando');
    else if(x.k==='model'&&x.en)     hab.push(x.en);
  });

  function unico(a){var v={},o=[];a.forEach(function(z){if(!v[z]){v[z]=1;o.push(z);}});return o;}
  gram=unico(gram); voc=unico(voc); oir=unico(oir); hab=unico(hab);

  if(!gram.length&&!voc.length&&!oir.length&&!hab.length)return '';

  function bloque(tit,arr,corte){
    if(!arr.length)return '';
    return '<div class="lqv-b"><div class="lqv-t">'+tit+'</div>'+
      arr.slice(0,corte).map(function(z){return '<div class="lqv-i">'+esc(z)+'</div>';}).join('')+
      '</div>';
  }
  return '<div class="lqv"><div class="lqv-h">Lo que vas a ver hoy</div>'+
    bloque('Gramática',gram,3)+
    bloque('Palabras nuevas',voc,4)+
    bloque('Vas a oír',oir,3)+
    bloque('Vas a decir',hab,3)+
    '<button class="lqv-oir" id="lqvoir">'+ico('bocina',15)+' Que me lo digan</button>'+
  '</div>';
}

// lo mismo pero para decirlo en voz alta
function loQueVieneHablado(S){
  var it=(S&&S.items)||[];
  var g=[],v=[];
  it.forEach(function(x){
    if(x.k==='regla'&&x.titulo)g.push(x.titulo);
    if(x.k==='phrasal'&&x.en)v.push(x.en);
    if(x.k==='idiom'&&x.en)v.push(x.en);
  });
  var t='';
  if(g.length)t+='La regla de hoy es: '+g[0]+'. ';
  if(v.length)t+='Vas a aprender '+v.slice(0,2).join(' y ')+'. ';
  return t;
}

  callarTodo();   // que no se grabe la propia app

  var meta=(x.k==='model'||x.k==='drill')?x.en:'';
  if(!HAY_GRAB){escribir(x);return;}
  var r=document.getElementById('res');
  if(b.dataset.grabando==='1'){
    b.dataset.grabando='';
    b.classList.remove('rec');b.innerHTML='<span class="ring2"></span> Grabar otra vez';
    grabarFin();
    return;
  }
  r.innerHTML='<div class="heard"><div class="hl">modo grabación</div>'+
    '<div style="font-size:13px;color:var(--tinta-2);line-height:1.5">Tu teléfono no reconoce voz, '+
    'pero sí puede grabarte. Di la frase en voz alta y toca otra vez para parar. Brian la escucha después.</div></div>';
  grabarInicio(function(blob){
    var url=URL.createObjectURL(blob);
    blobABase64(blob,function(b64){
      attempts.push({tipo:x.k+'-audio',meta:x.k==='model'?x.en:x.q,oido:'[audio grabado]',pct:null,
                     audio:b64,audiotipo:blob.type,seg:Math.round(blob.size/2000)});
      r.innerHTML='<div class="heard"><div class="hl">tu grabación</div>'+
        '<audio controls src="'+url+'" style="width:100%;margin-top:4px"></audio>'+
        '<div class="tst-r"><span class="ok2">Guardada. Brian la escucha después.</span></div></div>'+
        // Sin reconocimiento de voz, el alumno se quedaba sin saber si le salió.
        // Ahora escribe lo que dijo y recibe la MISMA revisión que los demás.
        (meta?'<div class="qcard" style="margin-top:10px"><div class="qlbl">Ahora escribe lo que dijiste</div>'+
          '<div class="qsub">Tal como te salió, aunque creas que estuvo mal. Así te digo en qué falló.</div>'+
          '<input class="tx" id="dicho" placeholder="What I said…" autocomplete="off">'+
          '<button class="btn" id="revisa" style="margin-top:10px">Revisar lo que dije</button></div>'
        :'<button class="btn" id="sig">Siguiente</button>');
      var sg=document.getElementById('sig');
      if(sg)sg.onclick=function(){it++;paso();};
      var rv=document.getElementById('revisa');
      if(rv)rv.onclick=function(){
        var tx=document.getElementById('dicho');
        var dicho=((tx&&tx.value)||'').trim();
        if(!dicho){avisito('Escribe lo que dijiste, aunque sea a medias.');return;}
        registrar(x,dicho);
      };
    });
  },function(err){
    var m=err==='NotAllowedError'?'No diste permiso al micrófono. Revisa el candado de la barra de direcciones.'
         :'Tu navegador no deja grabar. Puedes escribir lo que dijiste.';
    r.innerHTML='<div class="heard"><span class="no2">'+m+'</span></div>';
    HAY_GRAB=false;escribir(x);
  });
  b.dataset.grabando='1';
  b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Grabando… toca para parar';
}


// Tras la segunda escucha: una comprobación corta. No es examen — sirve para
// escuchar con un objetivo, que es lo que separa oír de entender.
function chequeoDe(x){
  var caja=document.getElementById('chequeo');
  if(!caja||caja.getAttribute('data-puesto'))return;
  caja.setAttribute('data-puesto','1');
  var q=String(x.q||'').toLowerCase(),op=null;
  if(/your name/.test(q))                      op=['Te pregunta tu nombre','Te pregunta la hora','Te pide una herramienta'];
  else if(/what do you do/.test(q))            op=['Te pregunta a qué te dedicas','Te pregunta dónde vives','Te da los buenos días'];
  else if(/where do you work/.test(q))         op=['Te pregunta dónde trabajas','Te pregunta qué hora es','Te pregunta tu nombre'];
  else if(/what time/.test(q))                 op=['Te pregunta a qué hora entras','Te pregunta tu nombre','Te pregunta si te gusta'];
  else if(/how are you/.test(q))               op=['Te pregunta cómo estás','Te pregunta dónde trabajas','Te pide ayuda'];
  else if(/do you work every day/.test(q))     op=['Te pregunta si trabajas diario','Te pregunta a qué hora sales','Te pregunta tu nombre'];
  else if(/what do you like/.test(q))          op=['Te pregunta qué te gusta','Te pregunta qué haces','Te pregunta la hora'];
  else if(/why are you learning/.test(q))      op=['Te pregunta para qué estudias inglés','Te pregunta dónde estudias','Te pregunta tu edad'];
  else if(/tell me about yourself/.test(q))    op=['Te pide que hables de ti','Te pide una herramienta','Te pregunta la hora'];
  else if(/what did you do yesterday/.test(q)) op=['Te pregunta qué hiciste ayer','Te pregunta qué harás mañana','Te pregunta dónde trabajas'];
  else if(/and what do you do/.test(q))        op=['Te pregunta qué haces cada día','Te pregunta dónde vives','Te pregunta la hora'];
  if(!op)return;
  var lista=op.map(function(t,i){return {t:t,ok:i===0};});
  for(var i=lista.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=lista[i];lista[i]=lista[j];lista[j]=tmp;}
  caja.innerHTML='<div class="chq"><div class="hl" id="chqhl">Antes de ver el texto · ¿qué te dijo?</div>'+
    lista.map(function(o){return '<button class="chqb" data-ok="'+(o.ok?1:0)+'">'+esc(o.t)+'</button>';}).join('')+'</div>';
  caja.querySelectorAll('.chqb').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var bien=b.getAttribute('data-ok')==='1';
      b.className='chqb '+(bien?'ok':'no');
      var hl=document.getElementById('chqhl');
      if(hl)hl.innerHTML=bien
        ? '<span class="ok2">Eso es. Ya entendiste de qué se trata.</span>'
        : '<span class="no2">No era esa. Escúchalo una vez más.</span>';
      attempts.push({tipo:'listening',meta:x.q,oido:bien?'entendió a la segunda':'no entendió',pct:bien?100:0});
    };
  });
}

function escribir(x){
  var r=document.getElementById('res');
  if(document.getElementById('esc'))return;
  r.innerHTML='<div class="heard"><div class="hl">el micrófono no está disponible</div>'+
    '<div style="font-size:13px;color:rgba(245,242,236,.75);margin-bottom:9px">Dilo en voz alta de todos modos, y luego escríbelo aquí.</div>'+
    '<textarea class="typebox" id="esc" placeholder="Lo que dijiste…"></textarea>'+
    '<button class="btn" id="okesc">Registrar</button></div>';
  document.getElementById('okesc').onclick=function(){
    var v=document.getElementById('esc').value.trim();
    if(!v)return;registrar(x,v);
  };
}

function registrar(x,t){
  var meta=(x.k==='model'||x.k==='drill')?x.en:'';
  var cmp=meta?comparar(meta,t):null;
  attempts.push({tipo:x.k,meta:meta||x.q,oido:t,pct:cmp?cmp.pct:null});
  if(meta)registrarEnMemoria(meta,cmp?cmp.pct:null);
  if(x.k==='model'){var kk=clave(x.en);intentosDe[kk]=(intentosDe[kk]||0)+1;}
  // en la producción libre el tutor repregunta sobre lo que acaba de decir
  if(x.k==='free')pedirSeguimiento(t);
  if(x.k==='roleplay'&&hayIA())seguirRoleplay(x,t);
  var r=document.getElementById('res');
  var h='<div class="heard"><div class="hl">te entendí</div><div class="ht">'+esc(t)+'</div>';
  if(cmp){
    h+='<div class="hl" style="margin-top:11px">contra la frase meta</div><div class="ht">'+pintar(meta,cmp)+'</div>'+
       '<div class="score"><div class="sbar"><i style="width:'+cmp.pct+'%"></i></div><span class="snum">'+cmp.pct+'%</span></div>';
  }
  h+='</div>';
  if(meta)h+=bloqueComparar(meta);
  if(cmp&&cmp.pct>=80){
    h+='<div id="correccion"></div>'+bloqueShadow(meta)+'<button class="btn" id="sig">Bien · siguiente</button>';
    if(cmp.pct<97&&hayIA())pedirCorreccion(x,meta,t,cmp.pct,true);
    else say(['Muy bien.','Eso es.','Así se dice.'][Math.floor(Math.random()*3)],'es-MX');
  }
  else if(cmp){
    h+='<div id="correccion"></div>'+
       '<button class="btn ghost" id="otra" style="margin-bottom:8px">Intentar otra vez</button><button class="btn" id="sig">Seguir de todos modos</button>';
    if(hayIA())pedirCorreccion(x,meta,t,cmp.pct,false);
    else say('Casi. Escúchala otra vez y repítela sin prisa.','es-MX');
  }
  else h+='<button class="btn" id="sig">Siguiente</button>';
  r.innerHTML=h;
  if(meta)setTimeout(function(){ligarComparar(meta);ligarShadow(meta);},60);
  var o=document.getElementById('otra');
  if(o)o.onclick=function(){say(meta,'en-US');r.innerHTML='';};
  document.getElementById('sig').onclick=function(){it++;paso();};
}

// Explica en corto QUE se aprendio en la sesion, por area.
function resumenAprendido(S,ats){
  var items=(S&&S.items)||[];
  var GRAM={regla:1,cazar:1,hueco:1,ordenar:1,transf:1};
  var OIR ={idea:1,detalle:1,dosc:1,segm:1,dicto:1};
  var nOir=0,nGram=0,nHab=0, reglas=[], frases=[];
  items.forEach(function(x){
    if(OIR[x.k])nOir++;
    else if(GRAM[x.k]){nGram++; if(x.k==='regla'&&x.titulo)reglas.push(x.titulo);
                       if(x.k==='cazar'&&x.buena)reglas.push(x.mala+' → '+x.buena);}
    else {nHab++; if(x.en)frases.push(x.en);}
  });
  var bien=(ats||[]).filter(function(a){return a.pct>=80;}).length;
  var conP=(ats||[]).filter(function(a){return a.pct!==null&&a.pct!==undefined;}).length;
  var h='<div class="sumcard aprendi"><h3>Qué aprendiste hoy</h3>'+
    '<p class="sub">'+esc(S.obj||S.hoy||'')+'</p>'+
    '<div class="apfila">'+
      '<div class="apbox"><b>'+nOir+'</b><span>de oído</span></div>'+
      '<div class="apbox"><b>'+nGram+'</b><span>de gramática</span></div>'+
      '<div class="apbox"><b>'+nHab+'</b><span>de hablar</span></div>'+
    '</div>';
  if(reglas.length)h+='<div class="aplista"><div class="hl">Las reglas de hoy</div>'+
    reglas.slice(0,3).map(function(r){return '<div class="apr">'+esc(r)+'</div>';}).join('')+'</div>';
  if(frases.length)h+='<div class="aplista"><div class="hl">Tus frases nuevas</div>'+
    frases.slice(0,4).map(function(f){return '<div class="apr">'+esc(f)+'</div>';}).join('')+'</div>';
  if(conP)h+='<p class="sub" style="margin-top:10px">Te salieron bien '+bien+' de '+conP+' ejercicios calificados.</p>';
  return h+'</div>';
}

function cierre(){
  pararReloj();
  var S=MAT[sIdx];
  var dichas=attempts.filter(function(a){return a.oido&&a.tipo!=='pista';});
  var libres=attempts.filter(function(a){return (a.tipo==='free'||a.tipo==='sit')&&a.oido;});
  var conPct=attempts.filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  var prom=conPct.length?Math.round(conPct.reduce(function(s,a){return s+a.pct;},0)/conPct.length):null;
  var pistas=attempts.filter(function(a){return a.tipo==='pista';}).length;
  var pal=dichas.map(function(a){return a.oido;}).join(' ').trim().split(/\s+/).filter(Boolean).length;

  var rec={
    alumna:(P.nombre||'alumno').toLowerCase().replace(/[^a-z0-9]/g,'')||'alumno',
    nombre:P.nombre,nivel:'speaking',s:sIdx,titulo:S.t,
    fecha:new Date().toISOString().slice(0,10),hora:new Date().toTimeString().slice(0,5),
    frases:dichas.map(function(a){return a.oido;}),
    palabras:pal,pista:pistas>0,cierre:'participante',
    dur:Math.round((Date.now()-t0)/1000),
    perfil:P,intentos:attempts.slice(),promedio_repeticion:prom,
    dudas:DUDAS.slice(),observacion:''
  };
  D.sesiones.push(rec);save(D);

  // la IA propone los tres errores; Brian los valida. Sin IA, no pasa nada.
  if(hayIA()){
    evaluarConIA(rec,function(res){
      if(!res||!res.errores||!res.errores.length)return;
      rec.errores_ia=res.errores;rec.nota_ia=res.nota||'';
      var d=load();
      if(d.sesiones&&d.sesiones.length){d.sesiones[d.sesiones.length-1]=rec;save(d);}
      var caja=document.getElementById('extra');
      if(!caja)return;
      var h='<div class="card"><h3>Tres cosas para la próxima</h3>'+
        '<p class="sub">Propuestas por el tutor. Brian las revisa antes de que cuenten.</p>';
      res.errores.slice(0,3).forEach(function(e){
        h+='<div class="att"><div class="tg">'+esc(e.correccion||'')+'</div>'+
           '<div class="hd">'+esc(e.codigo||'')+' · dijiste: '+esc(e.dijo||'')+'</div></div>';
      });
      caja.insertAdjacentHTML('afterbegin',h+'</div>');
    });
  }

  var msg=libres.length?'Hablaste '+dichas.length+' veces y produjiste '+pal+' palabras.'
        :'Practicaste '+dichas.length+' frases. La próxima intentamos una tuya.';
  // lo hablado va sin números, para que sea una frase fija con audio propio
  var msgVoz=libres.length
    ? 'Buen trabajo. Hablaste con tus propias palabras. Nos vemos en la siguiente.'
    : 'Buen trabajo. Practicaste las frases de hoy. La próxima intentamos una tuya.';

  var h='<div class="qcard"><div class="qlbl">Cierre</div><div class="qtxt">Buen trabajo, '+esc(P.nombre)+'.</div>'+
    '<div class="qsub">'+msg+(prom!==null?' Tus repeticiones salieron al '+prom+'% de parecido con el modelo.':'')+'</div>'+
    '<button class="btn" id="menu">Volver al camino</button></div>'+
    resumenAprendido(S,attempts)+
    '<div class="sumcard"><h3>Lo que se le manda a tu maestro</h3><p class="sub">Cada intento, tal como salió. Brian lo revisa y te devuelve máximo tres correcciones.</p>'+
    attempts.map(function(a){
      if(a.tipo==='pista')return '<div class="att"><span class="hd">pidió pista · '+esc(a.meta)+'</span></div>';
      return '<div class="att"><div class="tg">'+esc(a.oido||'—')+'</div>'+
        '<div class="hd">'+(a.tipo==='model'?'repetición · meta: '+esc(a.meta):(a.tipo==='ask'?'respuesta a: '+esc(a.meta):'producción libre'))+
        (a.pct!==null&&a.pct!==undefined?' · '+a.pct+'%':'')+'</div></div>';
    }).join('')+
    '<div class="obsbox"><div class="hl">¿Algo que quieras decirle a Brian?</div>'+
    '<textarea class="typebox" id="obs" placeholder="Lo que se te hizo difícil, lo que no entendiste, lo que le cambiarías…"></textarea>'+
    (HAY_MIC?'<button class="btn ghost" id="obsmic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
    '<p class="tiny" style="text-align:left;margin:6px 0 0">Es opcional, pero es lo que más le sirve a Brian.</p></div>'+
    '<p class="why" id="stat"></p><div class="actrow" id="manual"'+((ONLINE||DATOS_ENDPOINT)?' hidden':'')+'>'+
    '<button id="cop">Copiar código</button></div>'+
    '<textarea class="code" id="cd" readonly'+((ONLINE||DATOS_ENDPOINT)?' hidden':'')+'></textarea></div>';
  APP.innerHTML=h;
  say(msgVoz,'es-MX');

  // la observación se recoge al enviar, no antes
  function conObs(){
    var o=document.getElementById('obs');
    rec.observacion=o?o.value.trim():'';
    return pack(rec);
  }
  var om=document.getElementById('obsmic');
  if(om)om.onclick=function(){
    var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
    listen('es-MX',function(t){
      document.getElementById('obs').value=t;
      b.classList.remove('rec');b.innerHTML='<span class="pulse"></span> Decirlo otra vez';
    },function(){b.classList.remove('rec');b.disabled=true;b.textContent='El micrófono no abrió · escríbelo';});
  };
  // la observación y las dudas se recogen al momento de enviar
  function recogido(){
    var o=document.getElementById('obs');
    rec.observacion=o?o.value.trim():'';
    rec.dudas=DUDAS.slice();
    return pack(rec);
  }
  // los puntos se dan al cerrar
  var gan=sumarPuntos(rec);
  var cab=APP.querySelector('.qcard');
  if(cab)cab.insertAdjacentHTML('beforeend',
    '<div class="ganados"><span>+'+gan.ganados+' puntos</span>'+
    gan.producidas+' frases tuyas · '+gan.escuchas+' escuchas · '+gan.sombra+' veces al mismo tiempo</div>');
  var codigo=pack(rec);
  document.getElementById('cd').value=codigo;
  document.getElementById('menu').onclick=function(){sIdx=null;router();};

  // se manda sola al servidor de datos
  if(DATOS_ENDPOINT){
    document.getElementById('stat').textContent='Enviando a Brian…';
    var enviar=function(){
      var o=document.getElementById('obs');
      rec.observacion=o?o.value.trim():'';
      rec.dudas=DUDAS.slice();
      fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(rec)})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){
          document.getElementById('stat').textContent=(d&&d.ok)
            ? '✓ Enviada. Brian ya la tiene.'
            : 'No se pudo enviar. Usa el botón de correo.';
          if(!d||!d.ok){
            document.getElementById('manual').hidden=false;
            document.getElementById('cd').hidden=false;
          }
        })
        .catch(function(){
          document.getElementById('stat').textContent='Sin conexión. Usa el botón de correo.';
          document.getElementById('manual').hidden=false;
          document.getElementById('cd').hidden=false;
        });
    };
    // se espera un poco por si escribe una observación
    setTimeout(enviar,1200);
    var ob=document.getElementById('obs');
    if(ob)ob.onblur=enviar;
  }
  if(ONLINE&&!DATOS_ENDPOINT){
    document.getElementById('stat').textContent='Enviando…';
    google.script.run
      .withSuccessHandler(function(r){document.getElementById('stat').textContent=(r&&r.ok)?'✓ Enviada. Brian ya la tiene.':'No la aceptó el servidor.';})
      .withFailureHandler(function(){
        document.getElementById('stat').textContent='No se pudo conectar. Mándala por correo.';
        document.getElementById('manual').hidden=false;document.getElementById('cd').hidden=false;
      })
      .guardarSesion(rec);
    var envio=document.getElementById('obs');
    if(envio)envio.onblur=function(){
      rec.observacion=envio.value.trim();
      try{google.script.run.guardarSesion(rec);}catch(e){}
    };
  }
  var m=document.getElementById('mail');
  if(m)m.onclick=function(){
    rec.observacion=(document.getElementById('obs')||{}).value||'';
    var codigo2=conObs();
    var codigo2=recogido();
    var cuerpo='Sesión '+(sIdx+1)+' — '+S.t+'\n'+P.nombre+' · '+rec.fecha+'\n\n'+
      (rec.observacion?'LO QUE ESCRIBIÓ EL ALUMNO:\n'+rec.observacion+'\n\n':'')+
      (DUDAS.length?'DUDAS QUE PREGUNTÓ:\n'+DUDAS.map(function(d){return '· '+d;}).join('\n')+'\n\n':'')+
      (rec.observacion?'LO QUE ESCRIBIÓ:\n'+rec.observacion+'\n\n':'')+
      (DUDAS.length?'DUDAS QUE PREGUNTÓ:\n'+DUDAS.map(function(d){return '· '+d;}).join('\n')+'\n\n':'')+
      'Perfil: '+P.trabajo_es+', '+P.lugar_es+', '+P.accion_es+'\n'+
      'Intentos:\n'+attempts.map(function(a){
        return '· '+(a.tipo==='pista'?'[pista] '+a.meta:(a.oido+(a.pct!=null?' ('+a.pct+'%)':'')+' ← '+a.meta));
      }).join('\n')+'\n\n--- código para el panel ---\n'+codigo2;
    window.location.href='mailto:'+DESTINO+'?subject='+encodeURIComponent('Speaking '+(sIdx+1)+' · '+P.nombre)+'&body='+encodeURIComponent(cuerpo);
  };
  var c=document.getElementById('cop');
  if(c)c.onclick=function(){
    var t=document.getElementById('cd');
    t.value=recogido();
    t.select();
    try{document.execCommand('copy');document.getElementById('stat').textContent='Código copiado.';}catch(x){}
  };
}

/* arranque */
if(P){sIdx=null;}
router();
})();
</script>

<script>
window.EFA_MAPA3D = { listo:false, api:null, error:null };
(function(){
  function desempacar(id){
    var b64=document.getElementById(id).textContent.trim();
    var bin=atob(b64), arr=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Response(new Blob([arr]).stream().pipeThrough(
      new DecompressionStream('gzip'))).text();
  }
  if(typeof DecompressionStream==='undefined'){
    window.EFA_MAPA3D.error='navegador viejo'; return;
  }
  Promise.all([desempacar('efa-three'), desempacar('efa-levelmap')])
    .then(function(txt){
      var uThree=URL.createObjectURL(new Blob([txt[0]],{type:'text/javascript'}));
      // el mapa pide 'three' por su nombre: se le apunta a la URL temporal
      var lm=txt[1].replace(/from ['"]three['"]/g, "from '"+uThree+"'");
      var uMapa=URL.createObjectURL(new Blob([lm],{type:'text/javascript'}));
      return import(uMapa);
    })
    .then(function(mod){
      window.EFA_MAPA3D.crear=mod.createLevelMap;
      window.EFA_MAPA3D.listo=true;
      if(window.EFA_alMontar)window.EFA_alMontar();
    })
    .catch(function(e){
      window.EFA_MAPA3D.error=String(e);
      console.warn('mapa 3D no disponible:',e);
    });
})();
</script>
