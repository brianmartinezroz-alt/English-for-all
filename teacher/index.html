    <p>Aquí están los datos de tus alumnas. Escribe tu clave para entrar.</p>
    <input type="password" id="clave" placeholder="Tu clave" autocomplete="current-password">
    <button id="entrar">Entrar</button>

<script>
/* ═══ la puerta ═══
   La clave YA NO VIVE AQUI. Antes estaba escrita en este archivo, asi que
   cualquiera que abriera "ver codigo fuente" la leia. Y peor: no protegia
   nada, porque el servidor le contestaba a quien fuera que le preguntara.

   Ahora la clave vive en el servidor. El panel la manda una sola vez, el
   servidor la revisa y devuelve un pase firmado que dura 12 horas. De ahi
   en adelante el panel manda el pase. Sin pase, el servidor no suelta ni
   un nombre, se entre por donde se entre. */

(function(){
  var LLAVE='efa_panel_pase';
  window.pasePanel  = function(){ try{ return localStorage.getItem(LLAVE)||''; }catch(e){ return ''; } };
  window.borrarPase = function(){ try{ localStorage.removeItem(LLAVE); }catch(e){} };

  window.abrirPanel = function(){
    var c=document.getElementById('cerrojo');
    if(c)c.style.display='none';
    document.body.classList.remove('trabado');
  };
  window.pedirClave = function(msg){
    var c=document.getElementById('cerrojo');
    if(c)c.style.display='';
    document.body.classList.add('trabado');
    var m=document.getElementById('malmsg');
    if(m&&msg)m.textContent=msg;
    var i=document.getElementById('clave');
    if(i){ i.value=''; try{i.focus();}catch(e){} }
  };

  function entrar(){
    var i=document.getElementById('clave');
    var v=(i&&i.value)||'';
    var b=document.getElementById('entrar');
    var m=document.getElementById('malmsg');
    if(!v){ if(m)m.textContent='Escribe tu clave.'; return; }
    if(b){ b.disabled=true; b.textContent='Revisando…'; }
    if(m)m.textContent='';
    fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({accion:'entrar',clave:v})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(b){ b.disabled=false; b.textContent='Entrar'; }
        if(d&&d.ok&&d.pase){
          try{ localStorage.setItem(LLAVE,d.pase); }catch(e){}
          window.abrirPanel();
          if(typeof cargar==='function')cargar();
          return;
        }
        if(m)m.textContent=(d&&d.mensaje)||'Esa no es. Inténtalo otra vez.';
        if(i){ i.value=''; i.focus(); }
      })
      .catch(function(){
        if(b){ b.disabled=false; b.textContent='Entrar'; }
        if(m)m.textContent='No me pude conectar al servidor.';
      });
  }

  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('entrar');
    if(b)b.onclick=entrar;
    var i=document.getElementById('clave');
    if(i){
      try{i.focus();}catch(e){}
      i.addEventListener('keydown',function(e){ if(e.key==='Enter')entrar(); });
    }
    // con pase guardado se entra directo; si el servidor lo rechaza,
    // cargar() vuelve a pedir la clave sola
    if(window.pasePanel()) window.abrirPanel();
    var pr=document.getElementById('progs');
    if(pr) pr.querySelectorAll('button').forEach(function(b){
      b.onclick=function(){ cambiarPrograma(b.getAttribute('data-p')); };
    });
  });
})();
</script>

<script>
// El Colegio tiene su propio servidor y su propia hoja, a proposito: son datos
// de una institucion, no de la escuela particular. Nunca se mezclan.
var HCM_ENDPOINT='https://script.google.com/macros/s/AKfycbypVtZ3xzUURmChQzMsYM3rE-kiRt5e9NXLJ3QfBg8R7VpJx_0vtitQM1eb7i-wzTr1xA/exec';
var LLAVE_HCM='efa_panel_pase_hcm';
var PROGRAMA='efa';
/* ── MUESTRA SIEMPRE VISIBLE ──
   En los dos paneles queda un registro de muestra, marcado como tal. Sirve
   para dos cosas: que el panel nunca se vea vacio, y que puedas revisar cada
   cambio de diseno sin esperar a que alguien practique. No cuenta en los
   totales y no se le puede mandar material: no existe. */
var MUESTRA_EFA = EJEMPLO[0];
MUESTRA_EFA.muestra = true;

var MUESTRA_HCM = {
  nombre:'Cadete de muestra', num:'MUESTRA', grupo:'301', carril:'medio',
  leccion:7, sesiones:9, minutos:126, particip:82, extraclase:61,
  ultima:new Date().toISOString().slice(0,10), muestra:true
};

var CADETES=[], GRUPOS_HCM=[];
var ALUMNOS=[];

function iniciales(n){return n.split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}

function cargar(){
  if(!DATOS_ENDPOINT){
    ALUMNOS=EJEMPLO;
    $('#sync').innerHTML='● modo demostración (5 alumnos de ejemplo)';
    $('#sync').style.color='var(--miel)';
    pintarLista();return;
  }
  $('#sync').textContent='cargando…';
  fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'panel', pase:(window.pasePanel?window.pasePanel():'')})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      // El servidor puede contestar perfectamente y aun asi venir con error
      // adentro: si la hoja no existe, por ejemplo. Antes se decia "conectado"
      // de todos modos y la lista salia vacia, asi que un servidor roto se
      // veia igual que un grupo sin alumnos. Estuvo roto una semana sin que
      // nadie lo notara. Ahora lo dice.
      if(!d){
        $('#sync').textContent='el servidor no contestó';
        $('#sync').style.color='var(--coral)';
        ALUMNOS=[]; pintarLista(); return;
      }
      if(!d.ok && (d.error==='sin_permiso' || d.error==='sin_configurar')){
        if(window.borrarPase)window.borrarPase();
        $('#sync').textContent='';
        ALUMNOS=[];
        window.pedirClave(d.error==='sin_configurar'
          ? 'Falta configurar el acceso en el servidor.'
          : 'Tu pase venció. Escribe la clave otra vez.');
        return;
      }
      if(!d.ok){
        $('#sync').textContent='el servidor contestó con error';
        $('#sync').style.color='var(--coral)';
        $('#sync').title=String(d.error||'sin detalle');
        ALUMNOS=[]; pintarLista();
        mostrarFalla(d.error||'El servidor de datos contestó con un error.');
        return;
      }
      ALUMNOS=d.alumnos||[];
      $('#sync').textContent='conectado · '+ALUMNOS.length+
        (ALUMNOS.length===1?' alumno':' alumnos');
      $('#sync').style.color='var(--verde)';
      pintarLista();
    })
    .catch(function(){
      $('#sync').textContent='sin conexión';$('#sync').style.color='var(--coral)';
      ALUMNOS=EJEMPLO;pintarLista();
    });
}

// Cuando el servidor falla, el panel lo dice con todas sus letras y con el
// error tal cual, que es lo que hace falta para arreglarlo.
function mostrarFalla(msg){
  var c=document.querySelector('.wrap'); if(!c)return;
  var d=document.getElementById('fallabox');
  if(!d){ d=document.createElement('div'); d.id='fallabox'; c.insertBefore(d,c.firstChild); }
  d.style.cssText='background:#FBEEE7;border:1px solid var(--coral);border-radius:14px;'+
    'padding:14px 16px;margin-bottom:16px;font-size:13.5px;line-height:1.55;color:var(--tinta)';
  d.innerHTML='<b style="display:block;margin-bottom:5px">El servidor de datos falló</b>'+
    'No es que no haya alumnos: el servidor contestó con un error, así que no se pudo leer nada.'+
    '<div style="font-family:monospace;font-size:11.5px;color:var(--tenue);margin-top:8px;'+
    'word-break:break-word">'+String(msg).replace(/[&<>]/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[x];})+'</div>';
}


/* ═══════════ el Colegio Militar ═══════════ */
// Los cadetes no tienen nivel CEFR: van por semanas, todos con el mismo
// temario, y lo que cambia es el CARRIL, que es su nivel de ingles dentro
// del mismo programa. Por eso esta vista no se parece a la de los alumnos
// particulares y son dos tablas distintas, no una lista revuelta.

function pasHCM(){ try{ return localStorage.getItem(LLAVE_HCM)||''; }catch(e){ return ''; } }
function guardaPasHCM(p){ try{ localStorage.setItem(LLAVE_HCM,p); }catch(e){} }
function borraPasHCM(){ try{ localStorage.removeItem(LLAVE_HCM); }catch(e){} }

function cambiarPrograma(cual){
  PROGRAMA=cual;
  $('#progs').querySelectorAll('button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-p')===cual);
  });
  $('#subtitulo').textContent = cual==='hcm'
    ? 'Heroico Colegio Militar · Idioma Extranjero'
    : 'English For All · Brian Martínez';
  var esHCM = cual==='hcm';
  $('#lista').style.display = esHCM?'none':'';
  $('#ficha').style.display = esHCM?'none':'';
  $('#hcm').style.display   = esHCM?'':'none';
  if(esHCM) cargarHCM(); else { $('#sync').textContent='cargando…'; cargar(); }
}

function pedirClaveHCM(msg){
  $('#sync').textContent='';
  $('#hcm').innerHTML=
    '<div class="hcm-cerrojo">'+
      '<h3>Colegio Militar</h3>'+
      '<p>Los datos de los cadetes van aparte, con su propia clave. '+
      'No es la misma que la de tus alumnos.</p>'+
      '<input type="password" id="clavehcm" placeholder="Clave del Colegio" autocomplete="off">'+
      '<button id="entrahcm">Entrar</button>'+
      '<div class="hcm-mal" id="malhcm">'+(msg?esc(msg):'')+'</div>'+
    '</div>';
  var i=$('#clavehcm'), b=$('#entrahcm');
  function va(){
    var v=(i&&i.value)||'';
    if(!v){ $('#malhcm').textContent='Escribe la clave.'; return; }
    b.disabled=true; b.textContent='Revisando…';
    fetch(HCM_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({accion:'entrar',clave:v})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.pase){ guardaPasHCM(d.pase); cargarHCM(); return; }
        b.disabled=false; b.textContent='Entrar';
        $('#malhcm').textContent=(d&&d.mensaje)||'Esa no es la clave.';
        i.value=''; i.focus();
      })
      .catch(function(){
        b.disabled=false; b.textContent='Entrar';
        $('#malhcm').textContent='No me pude conectar al servidor del Colegio.';
      });
  }
  if(b)b.onclick=va;
  if(i){ try{i.focus();}catch(e){} i.addEventListener('keydown',function(e){ if(e.key==='Enter')va(); }); }
}

function cargarHCM(){
  if(!pasHCM()){ pedirClaveHCM(''); return; }
  $('#sync').textContent='cargando…';
  $('#hcm').innerHTML='<div class="vacio">Trayendo a los cadetes…</div>';
  fetch(HCM_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'panel_maestro', pase:pasHCM()})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d){ $('#sync').textContent='el servidor del Colegio no contestó';
              $('#sync').style.color='var(--coral)'; $('#hcm').innerHTML=''; return; }
      if(!d.ok && (d.error==='sin_permiso'||d.error==='sin_configurar')){
        borraPasHCM();
        pedirClaveHCM(d.error==='sin_configurar'
          ? 'Falta configurar el acceso en el servidor del Colegio.'
          : 'Tu pase venció. Escribe la clave otra vez.');
        return;
      }
      if(!d.ok){ $('#sync').textContent='el servidor del Colegio contestó con error';
                 $('#sync').style.color='var(--coral)';
                 $('#hcm').innerHTML='<div class="vacio"><h2>No se pudo leer</h2><p>'+
                   esc(String(d.error||'sin detalle'))+'</p></div>'; return; }
      CADETES=d.cadetes||[];
      GRUPOS_HCM=d.grupos||[];
      $('#sync').style.color='var(--verde)';
      $('#sync').textContent='conectado · '+CADETES.length+
        (CADETES.length===1?' cadete':' cadetes');
      pintarCadetes();
    })
    .catch(function(){
      $('#sync').textContent='sin conexión con el Colegio';
      $('#sync').style.color='var(--coral)'; $('#hcm').innerHTML='';
    });
}

function claseCarril(c){
  // Ojo con los acentos: "basico" no aparece dentro de "básico". Sin quitarle
  // el acento primero, el carril bajo se pintaba del color del de en medio.
  var t=String(c||'').toLowerCase()
    .replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i')
    .replace(/[óòö]/g,'o').replace(/[úùü]/g,'u');
  if(t.indexOf('bas')>=0 || t.indexOf('baj')>=0) return 'basico';
  if(t.indexOf('alt')>=0 || t.indexOf('avanz')>=0) return 'alto';
  return 'medio';
}
// Ultima sesion viene como texto largo del servidor. Aqui solo se acorta.
function diaCorto(t){
  var s=String(t||'').trim();
  if(!s) return '—';
  var m=s.match(/^(\d{1,2})\/(\d{1,2})/);
  return m ? (m[1]+'/'+m[2]) : s.slice(0,10);
}

function filaCadete(c){
  var part=Number(c.particip||0), extra=Number(c.extraclase||0);
  return '<div class="cad'+(c.muestra?' esmuestra':'')+'">'+
    '<div class="av">'+iniciales(c.nombre)+'</div>'+
    '<div class="cad-n"><b>'+esc(c.nombre||'—')+'</b>'+
      '<small>'+esc(c.num||'sin número')+' · '+(c.sesiones||0)+' sesiones · '+
      Math.round((c.minutos||0)/6)/10+' h</small></div>'+
    '<span class="carril '+claseCarril(c.carril)+'">'+esc(c.carril||'—')+'</span>'+
    '<div class="cad-num"><b>'+(c.leccion||0)+'</b><span>lección</span></div>'+
    '<div class="cad-num'+(part<70?' cad-baja':'')+'"><b>'+part+'%</b><span>partic.</span></div>'+
    '<div class="cad-num'+(extra<50?' cad-baja':'')+'"><b>'+extra+'%</b><span>extra</span></div>'+
    '<div class="cad-num"><b>'+esc(diaCorto(c.ultima))+'</b><span>última</span></div>'+
  '</div>';
}

// El bloque de muestra va aparte, nunca dentro de un grupo real, para que no
// ensucie las cuentas de "X cadetes".
function bloqueMuestraHCM(){
  return '<div class="gpo gpo-muestra"><div class="gpo-h"><b>Muestra</b>'+
    '<span>no es un cadete real</span></div>'+filaCadete(MUESTRA_HCM)+'</div>';
}

function pintarCadetes(){
  var html='';
  if(!CADETES.length){
    html+='<div class="vacio"><h2>Todavía no hay cadetes</h2>'+
      '<p>Cuando empiecen a practicar, aparecen aquí por grupo. '+
      'Abajo queda un cadete de muestra para que veas cómo se ve.</p></div>';
  } else {
    // los grupos que el servidor conoce, mas cualquiera que aparezca en los datos
    var orden = (GRUPOS_HCM && GRUPOS_HCM.length) ? GRUPOS_HCM.slice() : [];
    CADETES.forEach(function(c){
      var g=String(c.grupo||'sin grupo');
      if(orden.indexOf(g)<0) orden.push(g);
    });
    orden.forEach(function(g){
      var delGrupo=CADETES.filter(function(c){ return String(c.grupo||'sin grupo')===String(g); });
      if(!delGrupo.length) return;   // grupo sin cadetes: no se enseña vacio
      delGrupo.sort(function(a,b){ return String(a.nombre||'') < String(b.nombre||'') ? -1 : 1; });
      html+='<div class="gpo"><div class="gpo-h"><b>Grupo '+esc(g)+'</b>'+
            '<span>'+delGrupo.length+(delGrupo.length===1?' cadete':' cadetes')+'</span></div>'+
        delGrupo.map(filaCadete).join('')+'</div>';
    });
  }
  html += bloqueMuestraHCM();
  $('#hcm').innerHTML=html;
}

// VISTA es lo que de verdad esta pintado: los alumnos reales mas la muestra.
// La ficha tiene que leer de aqui, no de ALUMNOS, o el indice se corre.
var VISTA=[];

function pintarLista(){
  $('#ficha').classList.remove('on');
  $('#lista').classList.remove('off');
  VISTA = ALUMNOS.concat([MUESTRA_EFA]);
  $('#vacio').style.display='none';
  $('#grid').innerHTML=
    (ALUMNOS.length?'':'<div class="avisomuestra">Todav\u00eda no hay alumnos reales. '+
      'Abajo queda el alumno de muestra, para que veas c\u00f3mo se ve el panel.</div>')+
    VISTA.map(function(a,i){
    var pct=Math.round(a.parada/72*100);
    return '<button class="card'+(a.muestra?' esmuestra':'')+'" data-i="'+i+'">'+
      '<div class="fila1"><div class="av">'+iniciales(a.nombre)+'</div>'+
      '<div><div class="nom">'+esc(a.nombre)+'</div>'+
      '<div class="cod">'+esc(a.codigo)+' · '+esc(a.nivel)+'</div></div></div>'+
      '<div class="barra"><i style="width:'+pct+'%"></i></div>'+
      '<div class="mini"><span>parada <b>'+a.parada+'</b>/72</span>'+
        '<span><b>'+a.sesiones+'</b> sesiones</span>'+
        '<span><b>'+Math.round(a.minutos/60*10)/10+'</b> h</span></div>'+
      '<div class="mini" style="margin-top:5px"><span>últ.: '+esc(a.ultima)+'</span>'+
        '<span><b>'+a.dias+'</b> días seguidos</span></div>'+
      (a.porRevisar?'<div class="alerta">● '+a.porRevisar+' grabación'+(a.porRevisar>1?'es':'')+' por revisar</div>':'')+
      (a.muestra?'<div class="sello">muestra</div>':'')+
    '</button>';
  }).join('');
  $('#grid').querySelectorAll('.card').forEach(function(b){
    b.onclick=function(){verFicha(+b.getAttribute('data-i'));};
  });
}
</script>

<script>
var ENVIAR=null;   // función que arma y manda el paquete del alumno actual

function verFicha(i){
  var a=VISTA[i];
  if(!a) return;
  $('#lista').classList.add('off');
  var f=$('#ficha');f.classList.add('on');
  var pct=Math.round(a.parada/72*100);
  f.innerHTML=
    '<button class="volver" id="volver">‹ Todos mis alumnos</button>'+
    '<div class="fh"><div class="av">'+iniciales(a.nombre)+'</div>'+
      '<div><h2>'+esc(a.nombre)+'</h2><div class="cod">'+esc(a.codigo)+' · nivel '+esc(a.nivel)+' · '+esc(a.ultima)+'</div></div></div>'+
    // KPIs
    '<div class="secc"><div class="kpis">'+
      '<div class="kpi"><div class="n">'+a.parada+'</div><div class="l">parada de 72</div></div>'+
      '<div class="kpi"><div class="n">'+a.sesiones+'</div><div class="l">sesiones</div></div>'+
      '<div class="kpi"><div class="n">'+(Math.round(a.minutos/60*10)/10)+'h</div><div class="l">practicadas</div></div>'+
      '<div class="kpi"><div class="n">'+a.dias+'</div><div class="l">días seguidos</div></div>'+
    '</div></div>'+
    // errores comunes
    '<div class="secc"><h3>Errores más comunes</h3>'+
      (a.errores.length?a.errores.map(function(e,ei){
        // acepta las dos formas: la vieja ['error',5] y la nueva con casos
        var q=e.q||e[0], casos=e.casos||[], n=casos.length||e[1]||0;
        return '<div class="errbloque">'+
          '<button class="err" data-e="'+ei+'"><span class="flecha">›</span>'+
            '<span>'+esc(q)+'</span><span class="cuenta">'+n+' veces</span></button>'+
          '<div class="casos" data-c="'+ei+'">'+
            (casos.length?casos.map(function(c){
              var ref=ei+'-'+(casos.indexOf(c));
              return '<div class="caso">'+
                '<div class="caso-f">'+esc(c.fecha||'')+
                  (c.pct!=null?' · <b>'+c.pct+'%</b>':'')+'</div>'+
                '<div class="caso-l">'+
                  '<button class="oir" data-oir="alumno" data-ref="'+ref+'" '+
                    'data-url="'+esc(c.audio||'')+'" title="Oír al alumno">▶</button>'+
                  '<span class="et mal">dijo</span>'+esc(c.dijo||'')+'</div>'+
                '<div class="caso-l">'+
                  '<button class="oir bien" data-oir="modelo" data-ref="'+ref+'" '+
                    'data-txt="'+esc(c.frase||'')+'" title="Oír cómo debe sonar">▶</button>'+
                  '<span class="et bien">era</span>'+esc(c.frase||'')+'</div>'+
              '</div>';
            }).join(''):'<div class="caso" style="color:var(--tenue)">Sin detalle guardado de estas veces.</div>')+
          '</div></div>';
      }).join(''):'<div style="color:var(--tenue);font-size:14px">Sin errores repetidos. Va muy bien.</div>')+
    '</div>'+
    // grabaciones
    '<div class="secc"><h3>Sus grabaciones</h3>'+
      a.grabaciones.map(function(g){
        var cl=g.pct>=80?'bien':'mal';
        return '<div class="grab"><span class="fr">'+esc(g.frase)+'<br><span style="font-size:11px;color:var(--tenue)">'+esc(g.fecha)+'</span></span>'+
          '<span class="pct '+cl+'">'+g.pct+'%</span>'+
          '<audio controls preload="none"><source src=""></audio></div>';
      }).join('')+
      '<div style="font-size:11px;color:var(--tenue);margin-top:8px">En modo demostración el audio no suena; con tu servidor conectado, aquí se oye cada grabación real.</div>'+
    '</div>'+
    // ── ARMADOR DEL PAQUETE ──
    armador(a);
  $('#volver').onclick=pintarLista;
  // oír la grabación del alumno, y oír cómo debía sonar
  f.querySelectorAll('.oir').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      if(b.getAttribute('data-oir')==='alumno')oirAlumno(b);
      else oirModelo(b);
    };
  });
  // abrir y cerrar cada error para ver las veces exactas
  f.querySelectorAll('.err').forEach(function(b){
    b.onclick=function(){
      var i=b.getAttribute('data-e');
      var caja=f.querySelector('.casos[data-c="'+i+'"]');
      var abierto=b.classList.toggle('abierto');
      if(caja)caja.style.display=abierto?'block':'none';
    };
  });
  if(!a.muestra) ligarArmador(a);
}
</script>

<script>
var GRABADO=null;   // audio del maestro en base64

function filaLink(cont,ph){
  var d=document.createElement('div');d.className='linkfila';
  d.innerHTML='<input placeholder="'+ph+' (título)"><input placeholder="https://…"><button type="button">×</button>';
  d.querySelector('button').onclick=function(){d.remove();};
  cont.appendChild(d);
}
function leerLinks(cont){
  return [].slice.call(cont.querySelectorAll('.linkfila')).map(function(d){
    var ins=d.querySelectorAll('input');
    return {titulo:ins[0].value.trim(),url:ins[1].value.trim()};
  }).filter(function(l){return l.url;});
}

function ligarArmador(a){
  // tabs
  $('#ficha').querySelectorAll('.tab').forEach(function(tb){
    tb.onclick=function(){
      $('#ficha').querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
      tb.classList.add('on');
      var t=tb.getAttribute('data-t');
      $('#ficha').querySelectorAll('.panel-tab').forEach(function(p){
        p.style.display=(p.getAttribute('data-p')===t)?'block':'none';
      });
    };
  });
  // +video / +link
  $('#t-masv').onclick=function(){filaLink($('#t-vids'),'Video');};
  $('#t-masl').onclick=function(){filaLink($('#t-links'),'Material');};
  $('#b-masl').onclick=function(){filaLink($('#b-links'),'Link');};

  // grabar la voz del maestro
  var mr=null,trozos=[];
  $('#t-rec').onclick=function(){
    var b=$('#t-rec');
    if(b.classList.contains('grabando')){
      b.classList.remove('grabando');b.textContent='● Grabar';
      if(mr)mr.stop();return;
    }
    if(!navigator.mediaDevices||!window.MediaRecorder){aviso('Tu navegador no graba audio.');return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
      trozos=[];mr=new MediaRecorder(st);
      mr.ondataavailable=function(e){trozos.push(e.data);};
      mr.onstop=function(){
        st.getTracks().forEach(function(t){t.stop();});
        var blob=new Blob(trozos,{type:mr.mimeType});
        var fr=new FileReader();
        fr.onload=function(){GRABADO=fr.result.split(',')[1];$('#t-recst').textContent='audio listo ('+Math.round(blob.size/1024)+' KB)';};
        fr.readAsDataURL(blob);
      };
      mr.start();b.classList.add('grabando');b.textContent='■ Parar';
    }).catch(function(){aviso('No diste permiso al micrófono.');});
  };

  // enviar tarea
  $('#t-enviar').onclick=function(){
    var titulo=$('#t-titulo').value.trim();
    if(!titulo){aviso('Ponle un título a la tarea.');return;}
    enviar({tipo:'tarea',titulo:titulo,nota:$('#t-nota').value.trim(),
      audio:GRABADO,videos:leerLinks($('#t-vids')),links:leerLinks($('#t-links')),
      tokens:+$('#t-tok').value||0},a);
  };
  $('#b-enviar').onclick=function(){
    var titulo=$('#b-titulo').value.trim();
    if(!titulo){aviso('Ponle un título al bonus.');return;}
    enviar({tipo:'bonus',titulo:titulo,nota:$('#b-nota').value.trim(),
      links:leerLinks($('#b-links')),tokens:+$('#b-tok').value||0},a);
  };
  $('#f-enviar').onclick=function(){
    var fr=$('#f-frase').value.trim();
    if(!fr){aviso('Escribe la frase.');return;}
    enviar({tipo:'correccion',frase:fr},a);
  };
}

/* ═══ oír ═══
   Un solo audio a la vez: si tocas otro, el anterior se calla. */
var SONANDO=null, BOTON_SONANDO=null;
function callar(){
  if(SONANDO){try{SONANDO.pause();SONANDO.currentTime=0;}catch(x){}SONANDO=null;}
  if(BOTON_SONANDO){BOTON_SONANDO.textContent='▶';BOTON_SONANDO.classList.remove('sonando');BOTON_SONANDO=null;}
}
function tocar(url,b){
  callar();
  var a=new Audio(url);
  SONANDO=a;BOTON_SONANDO=b;
  b.textContent='■';b.classList.add('sonando');
  a.onended=callar;
  a.onerror=function(){callar();aviso('No pude abrir ese audio.');};
  var p=a.play();
  if(p&&p.catch)p.catch(function(){callar();aviso('El navegador bloqueó el audio.');});
}
function oirAlumno(b){
  var url=b.getAttribute('data-url');
  if(!url){aviso('En demostración no hay grabación. Conectado, aquí suena su voz.');return;}
  tocar(url,b);
}
// la forma correcta, con el servidor de voz que ya tienes
var VOZ_ENDPOINT='';   // ← pega aquí la MISMA dirección del servidor de voz de la app
var VOZ_CACHE={};
function oirModelo(b){
  var t=b.getAttribute('data-txt');
  if(!t)return;
  if(VOZ_CACHE[t]){tocar(VOZ_CACHE[t],b);return;}
  if(!VOZ_ENDPOINT){aviso('Falta pegar la dirección del servidor de voz en este panel.');return;}
  callar();b.textContent='…';
  fetch(VOZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({texto:t,idioma:'en',paquete:'audio-us',sexo:'m'})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      b.textContent='▶';
      if(d&&d.ok&&d.audio){VOZ_CACHE[t]='data:audio/mpeg;base64,'+d.audio;tocar(VOZ_CACHE[t],b);}
      else aviso('El servidor de voz no respondió.');
    })
    .catch(function(){b.textContent='▶';aviso('Sin conexión con el servidor de voz.');});
}

function enviar(paquete,a){
  paquete.id=paquete.tipo+'-'+Date.now();
  if(!DATOS_ENDPOINT){
    aviso('Demo: en real, esto le llega a '+a.nombre.split(' ')[0]+' en su próxima sesión.');
    return;
  }
  fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'dejar',codigo:a.codigo,nombre:a.nombre,paquete:paquete})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){aviso(d&&d.ok?'Enviado a '+a.nombre.split(' ')[0]:'No se pudo enviar');})
    .catch(function(){aviso('Sin conexión: no se envió');});
}

cargar();

<script>
/* ═══ avisos al celular ═══
   Igual que en la app del alumno: el aviso lo manda el servidor de datos,
   aquí solo se pide permiso y se dice que este aparato es el del maestro.
   En iPhone solo llega si el panel está instalado en la pantalla de inicio. */
var AVISOS_APP_ID='5083353d-3760-4530-adc5-92c22d5deaf9';   // App ID de OneSignal (es publico)

function panelEsIPhone(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
}
function panelInstalado(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone===true;
}
function panelAvisosPrendidos(){
  try{ return window.OneSignal && OneSignal.Notifications &&
              OneSignal.Notifications.permission===true; }catch(e){ return false; }
}
function panelArrancarAvisos(){
  if(!AVISOS_APP_ID || !('serviceWorker' in navigator)) return;
  window.OneSignalDeferred=window.OneSignalDeferred||[];
  window.OneSignalDeferred.push(async function(OneSignal){
    try{
      await OneSignal.init({
        appId: AVISOS_APP_ID,
        serviceWorkerPath:'English-for-all/push/onesignal/OneSignalSDKWorker.js',
        serviceWorkerParam:{scope:'/English-for-all/push/onesignal/'},
        autoResubscribe:true
      });
      // 'maestro' es el mismo nombre que usa Avisos.gs en la constante YO.
      await OneSignal.login('maestro');
      await OneSignal.User.addTags({rol:'maestro'});
      panelPintarBoton();
    }catch(e){}
  });
}
function panelPintarBoton(){
  var caja=document.querySelector('.top'); if(!caja)return;
  var b=document.getElementById('avbtn');
  if(!AVISOS_APP_ID){ if(b)b.remove(); return; }
  if(panelAvisosPrendidos()){ if(b)b.remove(); return; }
  if(!b){
    b=document.createElement('button');
    b.id='avbtn'; b.className='avbtn';
    caja.appendChild(b);
    b.onclick=function(){
      b.disabled=true; b.textContent='…';
      window.OneSignalDeferred=window.OneSignalDeferred||[];
      window.OneSignalDeferred.push(async function(OneSignal){
        try{
          await OneSignal.Notifications.requestPermission();
          await OneSignal.login('maestro');
          await OneSignal.User.addTags({rol:'maestro'});
        }catch(e){}
        setTimeout(panelPintarBoton,600);
      });
    };
  }
  b.disabled=false;
  if(panelEsIPhone() && !panelInstalado()){
    b.textContent='Instálalo para recibir avisos';
    b.onclick=function(){
      alert('En iPhone los avisos solo llegan si el panel está en tu pantalla de inicio.\n\n'+
            '1. Toca el cuadrito con la flecha, abajo en Safari.\n'+
            '2. Agregar a inicio.\n'+
            '3. Abre el panel desde el ícono nuevo y vuelve a tocar este botón.');
    };
  }else{
    b.textContent='Prender avisos';
  }
}
window.addEventListener('load',function(){ panelArrancarAvisos(); setTimeout(panelPintarBoton,1200); });
</script>

  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(){});
  });
}
