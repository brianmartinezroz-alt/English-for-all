<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cómo te fue? · English For All</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--crema:#F5F1E8;--papel:#FDFBF6;--tinta:#2A2724;--tinta-2:#57534E;--tenue:#8A837A;
    --linea:#E2DACA;--verde:#1D9E75;--verde-hondo:#137A59;--verde-suave:#E6F3EC;
    --display:'Fraunces',Georgia,serif;--body:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:var(--body);line-height:1.55}
  .shell{max-width:520px;margin:0 auto;padding:26px 18px 60px}
  .kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tenue);margin-bottom:5px}
  h1{font-family:var(--display);font-size:29px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
  .intro{font-size:14px;color:var(--tinta-2);margin-bottom:6px}
  .intro b{color:var(--tinta)}
  .prog{display:flex;gap:4px;margin:18px 0 20px}
  .prog i{flex:1;height:3px;border-radius:2px;background:var(--linea)}
  .prog i.on{background:var(--verde)}
  .card{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:24px 20px;
    box-shadow:0 8px 24px rgba(42,39,36,.05);animation:sube .3s ease both}
  @keyframes sube{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .num{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin-bottom:9px}
  .q{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.3;margin-bottom:18px}
  .op{width:100%;text-align:left;background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:12px;padding:15px 16px;margin-bottom:9px;font-family:var(--body);font-size:15px;cursor:pointer}
  .op:hover{border-color:var(--verde);background:var(--verde-suave)}
  .op.sel{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}
  .nav{display:flex;gap:8px;margin-top:16px}
  .bt{flex:1;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:13px;
    font-family:var(--body);font-size:14px;font-weight:700;cursor:pointer}
  .bt:hover{background:var(--verde-hondo)}
  .bt[disabled]{opacity:.4;cursor:default}
  .bt.g{flex:0 0 auto;background:none;border:1px solid var(--linea);color:var(--tinta-2);font-weight:500;padding:13px 18px}
  .fin{text-align:center;padding:10px 0}
  .fin h2{font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:10px}
  .fin p{font-size:14px;color:var(--tinta-2);margin-bottom:18px}
  .res{background:var(--crema);border:1px solid var(--linea);border-radius:12px;padding:14px;
    font-family:var(--mono);font-size:11.5px;line-height:1.7;text-align:left;white-space:pre-wrap;
    word-break:break-word;margin-bottom:14px;color:var(--tinta-2)}
  .aviso{font-size:12px;color:var(--tenue);margin-top:12px}
</style>
</head>
<body>
<div class="shell">
  <div class="kick">English For All</div>
  <h1>¿Cómo te fue?</h1>
  <p class="intro">Nueve preguntas, puros botones. <b>Contesta lo que de verdad pasó</b>, no lo que crees que quiero oír — si me dices que todo estuvo bien no puedo arreglar nada.</p>
  <div class="prog" id="pg"></div>
  <div id="app"></div>
</div>

<script>
var DESTINO='brianmartinezroz@gmail.com';

var Q=[
 {q:'¿Pudiste entrar y llegar hasta el final?',
  o:['Sí, completa','Sí, pero me costó','Me atoré a la mitad','No pude ni empezar']},

 {q:'El micrófono, ¿te oyó?',
  o:['Sí, sin problema','A veces sí, a veces no','Nunca me oyó','Escribí en vez de hablar']},

 {q:'Cuando te hablaba en español, ¿le entendías?',
  o:['Perfecto','Casi todo','A medias','No se oía bien']},

 {q:'Y cuando te hablaba en inglés, ¿qué tan rápido iba?',
  o:['Bien así','Muy rápido','Muy lento','No lo entendí']},

 {q:'Las preguntas del principio, ¿se te hicieron muchas?',
  o:['Estuvieron bien','Un poco largas','Demasiadas','Se me hicieron pocas']},

 {q:'¿Te dio pena hablar en voz alta?',
  o:['Nada de pena','Tantito al principio','Sí, bastante','Preferí escribir']},

 {q:'¿Hubo algún momento en que quisiste cerrarlo?',
  o:['No, en ningún momento','Sí, tantito','Sí, casi lo cierro','Sí lo cerré y volví a entrar']},

 {q:'¿Sentiste que las frases eran sobre ti y tu trabajo?',
  o:['Sí, totalmente','Más o menos','No, muy generales','No me fijé']},

 {q:'Si te lo mando otra vez el jueves, ¿lo abrirías?',
  o:['Sí, con ganas','Sí, si me acuerdo','Lo dudo','No']}
];

var i=0,r=[],APP=document.getElementById('app');

function pinta(){
  document.getElementById('pg').innerHTML=Q.map(function(_,k){
    return '<i class="'+(k<=i?'on':'')+'"></i>';}).join('');
  if(i>=Q.length){fin();return;}
  var x=Q[i];
  APP.innerHTML='<div class="card"><div class="num">Pregunta '+(i+1)+' de '+Q.length+'</div>'+
    '<div class="q">'+x.q+'</div>'+
    x.o.map(function(o,k){return '<button class="op'+(r[i]===k?' sel':'')+'" data-k="'+k+'">'+o+'</button>';}).join('')+
    '<div class="nav">'+
      (i>0?'<button class="bt g" id="ant">← Atrás</button>':'')+
      '<button class="bt" id="sig"'+(r[i]===undefined?' disabled':'')+'>'+(i===Q.length-1?'Terminar':'Siguiente')+'</button>'+
    '</div></div>';
  APP.querySelectorAll('.op').forEach(function(b){
    b.onclick=function(){r[i]=+b.dataset.k;pinta();};
  });
  var a=document.getElementById('ant');
  if(a)a.onclick=function(){i--;pinta();};
  document.getElementById('sig').onclick=function(){i++;pinta();};
}

function fin(){
  var txt=Q.map(function(x,k){
    return (k+1)+'. '+x.q+'\n   → '+(r[k]!==undefined?x.o[r[k]]:'sin contestar');
  }).join('\n');
  APP.innerHTML='<div class="card fin"><h2>Gracias.</h2>'+
    '<p>Esto es lo que voy a mandarle a Brian. Toca el botón y se abre tu correo con todo listo.</p>'+
    '<div class="res" id="res"></div>'+
    '<button class="bt" id="env">Enviar a Brian</button>'+
    '<button class="bt g" id="cop" style="width:100%;margin-top:8px">Copiar para WhatsApp</button>'+
    '<p class="aviso" id="av"></p></div>';
  document.getElementById('res').textContent=txt;
  document.getElementById('env').onclick=function(){
    location.href='mailto:'+DESTINO+'?subject='+encodeURIComponent('Cómo me fue en la práctica')+
      '&body='+encodeURIComponent(txt);
  };
  document.getElementById('cop').onclick=function(){
    var t=document.createElement('textarea');
    t.value=txt;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');document.getElementById('av').textContent='Copiado. Pégalo en el chat con Brian.';}
    catch(e){document.getElementById('av').textContent='Selecciona el texto de arriba y cópialo.';}
    t.remove();
  };
}

pinta();
</script>
</body>
</html>
