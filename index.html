<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de inglés hablado · English For All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#F5F1E8;      /* fondo general */
    --crema-2:#EFEADD;    /* bloques secundarios */
    --papel:#FDFBF6;      /* tarjetas */
    --tinta:#2A2724;      /* texto principal */
    --tinta-2:#57534E;    /* texto secundario */
    --tenue:#8A837A;      /* texto terciario */
    --linea:#E2DACA;
    --verde:#1D9E75;      /* acento */
    
    --verde-hondo:#137A59;
    --verde-suave:#E6F3EC;
    --coral:#D85A30;
    --ambar:#C08A22;
    --display:'Fraunces',Georgia,serif;
    --body:'DM Sans',system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:var(--body);line-height:1.55;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .shell{max-width:1140px;margin:0 auto;padding:22px 16px 80px}

  /* ── En celular la pantalla NO se mueve. El encabezado se queda arriba
        y solo el contenido de en medio se desliza por dentro.
        Así el alumno nunca tiene que subir o bajar la página entera. ── */
  @media (max-width:760px){
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    .shell{
      height:100dvh;              /* dvh: cuenta la barra del navegador del celular */
      max-height:100dvh;
      display:flex;flex-direction:column;
      padding:12px 14px 0;
      overflow:hidden;
    }
    .topbar{flex:none;padding-bottom:10px;margin-bottom:12px}
    .brand{font-size:19px}
    #app{
      flex:1 1 auto;
      min-height:0;               /* sin esto flex no deja encoger y se desborda */
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:18px;
      scrollbar-width:none;
    }
    #app::-webkit-scrollbar{display:none}
    .card{margin-bottom:0}
  }
  @supports not (height:100dvh){
    @media (max-width:760px){ .shell{height:100vh;max-height:100vh} }
  }
  .wrapc{max-width:540px;margin:0 auto}

  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
          border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:20px}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--tenue);margin-bottom:4px}
  .brand{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--tinta)}
  .brand em{font-style:normal;color:var(--verde)}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

  /* ── tarjeta principal ── */
  .qcard{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:26px 22px;
         box-shadow:0 1px 2px rgba(42,39,36,.04),0 8px 24px rgba(42,39,36,.05)}
  .qlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--tenue);margin-bottom:9px}
  .qtxt{font-family:var(--display);font-size:23px;line-height:1.3;font-weight:600;
        letter-spacing:-.015em;margin-bottom:8px;color:var(--tinta)}
  .qsub{font-size:13.5px;color:var(--tinta-2);margin-bottom:20px;line-height:1.55}

  /* ── botones ── */
  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--verde);
       color:#fff;border:0;border-radius:10px;padding:14px;font-size:14.5px;font-weight:700;
       cursor:pointer;font-family:var(--body);transition:background .15s}
  .btn:hover{background:var(--verde-hondo)}
  .btn.ghost{background:none;border:1px solid var(--linea);color:var(--tinta-2);font-weight:500;font-size:13.5px;padding:12px}
  .btn.ghost:hover{background:var(--crema-2);color:var(--tinta)}
  .btn.rec{background:var(--coral)}
  .btn+.btn{margin-top:8px}
  .btn[disabled]{opacity:.5;cursor:default}
  .pulse{width:9px;height:9px;border-radius:50%;background:currentColor}
  .btn.rec .pulse{animation:beat 1s infinite}
  @keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  .mic-big{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:var(--verde);
    color:#fff;border:0;border-radius:40px;padding:19px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--body)}
  .mic-big:hover{background:var(--verde-hondo)}
  .mic-big.rec{background:var(--coral)}
  .mic-big[disabled]{opacity:.5}
  .ring2{width:11px;height:11px;border-radius:50%;background:currentColor}
  .mic-big.rec .ring2{animation:beat 1s infinite}
  @media(prefers-reduced-motion:reduce){.btn .pulse,.mic-big .ring2{animation:none}}

  /* ── opciones ── */
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pick button{background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:22px;padding:10px 15px;font-family:var(--body);font-size:14px;cursor:pointer;text-align:left}
  .pick button:hover{border-color:var(--verde);background:var(--verde-suave)}
  .pick button.sel{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
  .pick button i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.65;display:block;margin-top:2px}
  .pick button.sel i{opacity:.9}

  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  /* ---- tipos nuevos: gramatica y listening ---- */
  .reglabox{background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--verde);
    border-radius:10px;padding:12px 14px;margin:10px 0}
  .regla-t{font-family:var(--display);font-size:16px;margin-bottom:4px}
  .regla-d{font-size:13.5px;line-height:1.5;opacity:.85}
  .parfila{display:flex;gap:8px;margin:10px 0}
  .par{flex:1;border-radius:9px;padding:10px 12px;font-size:14px;border:1px solid var(--linea)}
  .par-et{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
    text-transform:uppercase;opacity:.6;margin-bottom:3px}
  .par.bien{background:rgba(29,158,117,.09);border-color:rgba(29,158,117,.35)}
  .par.mal{background:rgba(216,90,48,.08);border-color:rgba(216,90,48,.3);text-decoration:line-through;opacity:.75}
  .cazafila,.piezasfila{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
  .palb{background:var(--papel);border:1px solid var(--linea);color:var(--tinta);
    border-radius:8px;padding:9px 13px;font-size:15px;font-family:inherit;cursor:pointer;transition:.15s}
  .palb:active{transform:scale(.96)}
  .palb.usada{opacity:.25;pointer-events:none}
  .palb.ok{background:rgba(29,158,117,.2);border-color:var(--verde)}
  .palb.no{background:rgba(216,90,48,.18);border-color:var(--coral)}
  .hueco{display:inline-block;min-width:64px;border-bottom:2px dashed var(--verde);
    margin:0 4px;color:transparent}
  .opsfila{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .opsfila.col{flex-direction:column}
  .armado{min-height:46px;background:var(--papel);border:1px dashed var(--linea);
    border-radius:9px;padding:10px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .armado-vacio{font-size:12.5px;opacity:.45}
  .armw{background:rgba(29,158,117,.13);border:1px solid rgba(29,158,117,.3);
    border-radius:6px;padding:5px 10px;font-size:14.5px}
  .pidebox{background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.25);
    border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13.5px}
  .dictoin{width:100%;background:var(--papel);border:1px solid var(--linea);border-radius:9px;
    padding:11px 12px;font-family:inherit;font-size:15px;color:var(--tinta);margin:10px 0;resize:vertical}
  .dictoin:focus{outline:none;border-color:var(--verde)}
  .fb{border-radius:9px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.45}
  .fb.ok{background:rgba(29,158,117,.12);border:1px solid rgba(29,158,117,.35)}
  .grabando{display:flex;align-items:center;gap:9px;background:rgba(216,90,48,.1);
    border:1px solid rgba(216,90,48,.35);border-radius:9px;padding:11px 13px;margin:10px 0;
    font-size:14px;font-weight:500}
  .grabando .punto{width:11px;height:11px;border-radius:50%;background:var(--coral);
    animation:latir 1s infinite;flex:none}
  @keyframes latir{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .aprendi .apfila{display:flex;gap:8px;margin:12px 0}
  .aprendi .apbox{flex:1;background:var(--papel);border:1px solid var(--linea);border-radius:9px;
    padding:10px 6px;text-align:center}
  .aprendi .apbox b{display:block;font-family:var(--display);font-size:22px;color:var(--verde)}
  .aprendi .apbox span{font-size:10.5px;opacity:.7}
  .aprendi .aplista{margin-top:12px}
  .aprendi .aplista .hl{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.6;margin-bottom:5px}
  /* ---- acentos, roleplay, recuento, pares, palabra, deletreo ---- */
  .acefila{display:flex;gap:8px;margin:12px 0}
  .aceb{flex:1;background:var(--papel);border:1px solid var(--linea);border-radius:10px;
    padding:11px 4px;font-size:24px;line-height:1;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;color:var(--tinta)}
  .aceb span{font-size:9.5px;opacity:.7;letter-spacing:.02em}
  .aceb.on{border-color:var(--verde);background:rgba(29,158,117,.1)}
  .aceb:active{transform:scale(.95)}
  .quien{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.6;margin:10px 0 5px}
  .opt.gr{flex:1;text-align:center;font-size:19px;padding:15px 10px;font-family:var(--display)}
  .palgrande{font-family:var(--display);font-size:30px;text-align:center;margin:14px 0 4px;
    color:var(--verde)}
  .apoyofila{display:flex;flex-wrap:wrap;gap:6px}
  .bubble-ia.pensando .ht{opacity:.55;font-style:italic}
  /* ---- asomarse a una lección desde el mapa ---- */
  .asom-velo{position:fixed;inset:0;z-index:950;background:rgba(42,39,36,.55);
    backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
  .asom-caja{background:var(--papel);border:1px solid var(--linea);border-radius:17px;
    padding:20px 19px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;
    box-shadow:0 16px 44px rgba(0,0,0,.25)}
  .asom-tag{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:6px}
  .asom-t{font-family:var(--display);font-size:23px;font-weight:600;line-height:1.15}
  .asom-o{font-size:13.5px;color:var(--tenue);margin-top:5px;line-height:1.5}
  .asom-b{margin-top:13px}
  .asom-h{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--verde);margin-bottom:3px}
  .asom-i{font-size:14.5px;line-height:1.5;padding-left:10px;border-left:2px solid var(--linea)}
  .asom-vela{margin-top:14px;padding:10px 12px;background:var(--crema);border-radius:9px;
    font-size:12.5px;color:var(--tenue);line-height:1.5}

  /* ---- el método ---- */
  .met-t{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 6px}
  .met-s{font-size:14.5px;color:var(--tenue);line-height:1.55;margin-bottom:20px}
  .met-b{display:flex;gap:13px;padding:15px 0;border-top:1px solid var(--linea)}
  .met-n{flex:none;width:25px;height:25px;border-radius:50%;background:rgba(29,158,117,.12);
    color:var(--verde);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11.5px;margin-top:2px}
  .met-c{flex:1;min-width:0}
  .met-h{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:4px;line-height:1.25}
  .met-p{font-size:14.5px;line-height:1.6;color:var(--tinta)}
  .met-f{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--tenue)}
  .met-pie{margin-top:18px;padding-top:14px;border-top:1px solid var(--linea);
    font-size:12.5px;color:var(--tenue);line-height:1.55}

  .lqv{background:var(--papel);border:1px solid var(--linea);border-radius:13px;
    padding:15px 16px;margin:12px 0}
  .lqv-h{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:11px}
  .lqv-b{margin-bottom:11px}
  .lqv-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--verde);margin-bottom:4px}
  .lqv-i{font-size:14px;line-height:1.5;padding:3px 0 3px 11px;border-left:2px solid var(--linea)}
  .lqv-oir{width:100%;background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:9px;padding:9px;font-family:inherit;font-size:13.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px}

  .hilox{background:rgba(29,158,117,.07);border-left:3px solid var(--verde);
    border-radius:0 10px 10px 0;padding:11px 14px;margin:11px 0;font-size:14px;line-height:1.5}
  .hilox span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.6;margin-bottom:3px}

  /* ---- hojas de hola y adiós ---- */
  .hoja-velo{position:fixed;inset:0;z-index:880;background:rgba(42,39,36,0);
    display:flex;align-items:flex-end;justify-content:center;
    transition:background .3s ease;pointer-events:auto}
  .hoja-velo.abierta{background:rgba(42,39,36,.42)}
  .hoja{width:100%;max-width:470px;background:var(--papel);
    border-radius:22px 22px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.28);
    transform:translateY(102%);transition:transform .34s cubic-bezier(.22,.9,.3,1);
    max-height:66vh;overflow-y:auto}
  .hoja-velo.abierta .hoja{transform:translateY(0)}
  .hoja-asa{width:38px;height:4px;border-radius:3px;background:var(--linea);
    margin:0 auto 16px}
  .hoja-cab{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .hoja-foto{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--verde)}
  .hoja-foto.vacia{background:var(--crema);border-color:var(--linea);
    display:flex;align-items:center;justify-content:center;font-size:24px}
  .hoja-hola{font-size:13px;color:var(--tenue)}
  .hoja-nom{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.15}
  .hoja-racha{background:rgba(216,90,48,.09);border:1px solid rgba(216,90,48,.26);
    border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:13px}
  .hoja-racha b{color:var(--coral);font-size:16px}
  .hoja-hoy{background:var(--crema);border-radius:13px;padding:14px 16px;margin-bottom:15px}
  .hoja-et{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--verde);margin-bottom:4px}
  .hoja-lec{font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:3px}
  .hoja-sub{font-size:13.5px;color:var(--tenue);line-height:1.5}
  .hoja-btn{width:100%}
  .hoja-mas{width:100%;margin-top:9px;background:none;border:0;font-family:inherit;
    font-size:13.5px;color:var(--tenue);cursor:pointer;padding:9px}
  @media (prefers-reduced-motion:reduce){
    .hoja{transition:none} .hoja-velo{transition:none}
  }

  /* ---- barra de abajo ---- */
  .barrabaja{position:fixed;left:0;right:0;bottom:0;z-index:800;
    display:flex;align-items:flex-end;justify-content:space-around;
    background:rgba(253,251,246,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--linea);
    padding:8px 6px calc(12px + env(safe-area-inset-bottom))}
  .tabb{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;
    font-size:10.5px;color:var(--tenue);line-height:1.3;padding:2px 0}
  .tabb .ic{display:block;font-size:20px;margin-bottom:2px;opacity:.5}
  .tabb.on{color:var(--verde);font-weight:600}
  .tabb.on .ic{opacity:1}
  .tabb:active{transform:scale(.94)}
  .tabb.maestro{color:var(--tinta);font-weight:600}
  .fotomaestro{display:flex;width:44px;height:44px;border-radius:50%;margin:0 auto 2px;
    align-items:center;justify-content:center;font-size:20px;overflow:hidden;
    background:linear-gradient(160deg,#93A7B8,#3E5468);
    border:2.5px solid var(--verde);box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .fotomaestro img{width:100%;height:100%;object-fit:cover}
  .tabb .ic img{width:26px;height:26px;border-radius:50%;object-fit:cover;
    display:block;margin:0 auto}
  body{padding-bottom:78px}
  .menub{display:none}          /* fuera las tres líneas */
  @media (min-width:900px){ .barrabaja{max-width:520px;margin:0 auto;border-radius:18px 18px 0 0} }

  /* ---- foto de perfil ---- */
  .fotoperfil{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;
    background:var(--crema);border:2px solid var(--linea);overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:38px;
    position:relative;cursor:pointer}
  .fotoperfil img{width:100%;height:100%;object-fit:cover}
  .fotoperfil .cambiar{position:absolute;left:0;right:0;bottom:0;
    background:rgba(42,39,36,.72);color:#fff;font-size:9.5px;padding:4px 0;
    text-align:center;letter-spacing:.04em}

  /* ---- corrección al momento ---- */
  .corr{background:rgba(216,90,48,.07);border:1px solid rgba(216,90,48,.28);
    border-radius:11px;padding:13px 15px;margin:11px 0}
  .corr.ok{background:rgba(29,158,117,.08);border-color:rgba(29,158,117,.3)}
  .corr.pensando{opacity:.6;font-style:italic;font-size:13.5px;
    background:var(--papel);border-color:var(--linea)}
  .corr-h{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.65;margin-bottom:3px}
  .corr-q{font-size:15px;line-height:1.5}
  .corr-c{font-size:15px;line-height:1.5}
  .corr-k{margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07);font-size:13.5px}

  /* ---- phrasal verbs y expresiones ---- */
  .phrgrande{font-family:var(--display);font-size:29px;text-align:center;margin:14px 0 3px;
    color:var(--verde);line-height:1.15}
  .phrsig{text-align:center;font-size:14.5px;color:var(--tenue);margin-bottom:6px}

  /* ---- preguntame lo que sea ---- */
  .pgchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .pgchip{background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .pgchip.on{background:rgba(29,158,117,.14);border-color:var(--verde);color:var(--verde)}
  .pgchip:active{transform:scale(.96)}
  .pgidioma{display:flex;gap:5px;margin-bottom:9px}
  .pgi{flex:1;background:var(--crema);border:1px solid var(--linea);color:var(--tenue);
    border-radius:8px;padding:7px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .pgi.on{background:var(--papel);border-color:var(--verde);color:var(--verde);font-weight:500}
  .pgfila{display:flex;gap:6px;align-items:stretch}
  .pgfila .tx{flex:1;margin:0}
  .pgmic{flex:none;width:46px;background:var(--crema);border:1px solid var(--linea);
    border-radius:9px;color:var(--tinta);cursor:pointer;display:flex;align-items:center;
    justify-content:center;position:relative}

<script>
(function(){

function cargarVoces(cb){
  if(!('speechSynthesis' in window)){cb([]);return;}

    t++;setTimeout(intenta,150);

function calidadVoz(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');
  var p=0;
  if(/natural|neural|premium|enhanced|wavenet|studio/i.test(n))p+=5;
  if(/google/i.test(n))p+=3;
  if(/siri|samantha|karen|daniel|moira|aaron|nicky/i.test(n))p+=2;
  if(v.localService===false)p+=2;              // las de servidor suelen sonar mejor
  if(/david|zira|mark|hazel|espeak|compact|pico/i.test(n))p-=4;
  return p;
}
function idVoz(v){return (v.name||'')+'|'+(v.lang||'');}
function vocesIngles(){
  var en=VOCES.filter(function(v){return /^en(-|_)/i.test(v.lang);});
  en.sort(function(a,b){return calidadVoz(b)-calidadVoz(a);});
  // fuera duplicados exactos
  var vistos={},unicas=[];
  en.forEach(function(v){
    var k=idVoz(v).toLowerCase();
    if(!vistos[k]){vistos[k]=1;unicas.push(v);}
  });
  // variedad real: máximo dos por país, sin repetir el nombre completo.
  // Antes se comparaba solo la primera palabra y eso tiraba voces distintas
  // ("English Australia" y "English India" quedaban como si fueran la misma).
  var porPais={},nombres={},out=[];
  unicas.forEach(function(v){
    var p=(v.lang||'').toLowerCase();
    var n=(v.name||'').replace(/^(Microsoft|Google|Apple)\s+/i,'')
          .replace(/\s*-\s*English.*$/i,'').replace(/\s*\(.*\)$/,'')
          .replace(/[^a-z]/gi,'').toLowerCase();
    if(nombres[n])return;
    if((porPais[p]||0)>=2)return;
    porPais[p]=(porPais[p]||0)+1;nombres[n]=1;out.push(v);
  });
  // si aún caben, se agregan las que sobraron de países ya representados
  unicas.forEach(function(v){if(out.length<6&&out.indexOf(v)<0)out.push(v);});
  return out.slice(0,6);
}
function etiquetaVoz(v){
  var pais={'en-us':'Estados Unidos','en-gb':'Inglaterra','en-au':'Australia','en-ca':'Canadá',
            'en-in':'India','en-ie':'Irlanda','en-za':'Sudáfrica','en-nz':'Nueva Zelanda'}[(v.lang||'').toLowerCase()]||v.lang;
  var n=(v.name||'Voz').replace(/^(Microsoft|Google|Apple)\s+/i,'')
        .replace(/\s*-\s*English.*$/i,'').replace(/\s*\(.*\)$/,'').trim();
  return {nombre:n||v.name,pais:pais};
}
function elegirVozES(){
  VOZ_ES=VOCES.filter(function(v){return /^es(-|_)/i.test(v.lang);})
              .sort(function(a,b){return (/mx|us/i.test(b.lang)?1:0)-(/mx|us/i.test(a.lang)?1:0);})[0]||null;
}
function aplicarVoz(id){
  if(!id)return;
  VOZ_EN=VOCES.filter(function(v){return idVoz(v)===id;})[0]

}

function sayLento(t,lang,cb){ return say(t,lang,cb,0.7); }
function say(t,lang,cb,vel){
  callarTodo();          // ← al primer clic se hace silencio, sin esperar la descarga
  marcarCargando(true);  // ← el botón avisa que viene en camino
  VEL_PEDIDA=vel||null;
  var k=clave(t);
  var archivo=(typeof GRABABLES!=='undefined'&&GRABABLES[k])?GRABABLES[k]:k;
  // se intenta SIEMPRE el audio: si el archivo existe, suena la voz buena;
  // si no, se apunta como faltante y de ahí en adelante va la del navegador
  if(!AUDIO_FALLA[archivo]){
    try{speechSynthesis.cancel();}catch(e){}
    decirConTuVoz(t,lang,cb,archivo);

  }

}

  var u=new SpeechSynthesisUtterance(t);

  // es británica o australiana, varios navegadores la ignoran y usan la de fábrica
  if(v){u.voice=v;u.lang=v.lang;}

  say(lista[0][0],lista[0][1]);

/* ═══════════ tu voz grabada ═══════════ */
// Busca el audio en audio/nombre.webm y, si no está, en nombre.webm (la raíz).
// Así funciona aunque los archivos se hayan subido sueltos.

function armarRutas(){
  var r=[];

var EXT=['.webm','.mp3'];   // sirve cualquiera de los dos formatos
var AUDIO_FALLA={};     // los que ya se sabe que no existen
var AUDIO_RUTA=null;    // la ruta que sí sirvió, para no volver a probar
var AUDIO_HAY=0;        // cuántas grabaciones se han encontrado
var BANDERA={us:'🇺🇸',uk:'🇬🇧',au:'🇦🇺',in:'🇮🇳'};
var NOMACE ={us:'Estados Unidos',uk:'Inglaterra',au:'Australia',in:'India'};

}
function mezclar(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}

}
function normal(t){

function clave(t){

var AUDIO_ACTUAL=null;
var TURNO=0;   // cada vez que se calla todo, cambia el turno.

function callarTodo(){

    try{

// Antes se confundían y un bloqueo momentáneo dejaba la frase en voz genérica
// para el resto de la sesión.
function reproducir(url,onOk,onNoExiste,onBloqueado){
  callarTodo();
  var miTurno=TURNO;
  var a=new Audio();
  a.preload='auto';
  // la velocidad se ajusta aquí: un solo archivo sirve para todas.
  // preservesPitch evita que suene a caricatura al bajarle.
  try{

    if('mozPreservesPitch' in a)a.mozPreservesPitch=true;
    if('webkitPreservesPitch' in a)a.webkitPreservesPitch=true;
  }catch(e){}
  var resuelto=false;
  a.oncanplaythrough=function(){
    if(resuelto)return;resuelto=true;
    if(miTurno!==TURNO)return;   // llegó tarde

    a.onended=function(){onOk&&onOk();};

    if(p&&p.catch)p.catch(function(){
      // existe, pero no se pudo reproducir: no se marca como faltante
      onBloqueado&&onBloqueado();
    });
  };
  a.onerror=function(){
    if(resuelto)return;resuelto=true;
    onNoExiste&&onNoExiste();
  };

  try{a.load();}catch(e){if(!resuelto){resuelto=true;onNoExiste&&onNoExiste();}}

}

function nombresPosibles(texto,archivo){

function sexoDeLaFrase(t){
  var x=' '+String(t).toLowerCase().replace(/[^a-záéíóúñ ]/g,' ')+' ';
  // pronombres y tratamientos: mandan sobre todo lo demás
  if(/ (she|her|hers|ms|mrs|miss|ella|señora|señorita|sra) /.test(x))return 'f';
  if(/ (he|him|his|mr|sir|el señor|señor|sr) /.test(x))return 'm';
  // un nombre reconocido
  for(var i=0;i<NOM_F.length;i++)if(x.indexOf(' '+NOM_F[i]+' ')>=0)return 'f';
  for(var j=0;j<NOM_M.length;j++)if(x.indexOf(' '+NOM_M[j]+' ')>=0)return 'm';
  // si la frase es del propio alumno, su voz es la que él escogió
  if(/ (my name is|i am|i'm|soy|me llamo) /.test(x)){
    var a=(progreso().avatar)||{};
    if(a.sexo)return a.sexo==='m'?'f':'m';
  }
  var n=0;
  for(var k=0;k<x.length;k++)n+=x.charCodeAt(k);
  return (n%2===0)?'f':'m';
}
function vozDelServidor(texto,lang,cb,onFalla){
  if(!VOZ_ENDPOINT){onFalla&&onFalla();return;}
  var miTurno=TURNO;
  var vel=VEL_PEDIDA;   // se toma ya, porque la respuesta llega despues
  var k=clave(texto)+'|'+(PAQUETE_ACTIVO||'audio-us')+'|'+sexoDeLaFrase(texto)+(vel?'|v'+vel:'');

  if(VOZ_CACHE[k]){
    if(miTurno!==TURNO)return;
    reproducir(VOZ_CACHE[k],function(){cb&&cb();},function(){onFalla&&onFalla();},function(){cb&&cb();});
    return;
  }
  fetch(VOZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({texto:texto,idioma:(lang==='es-MX'?'es':'en'),
      paquete:PAQUETE_ACTIVO||'audio-us',sexo:sexoDeLaFrase(texto),vel:vel||undefined})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!d.ok||!d.audio){delete VOZ_CACHE[k];onFalla&&onFalla();return;}
      var url='data:audio/mpeg;base64,'+d.audio;
      VOZ_CACHE[k]=url;
      if(miTurno!==TURNO)return;   // ya cambió de pantalla: no suena
      reproducir(url,function(){cb&&cb();},function(){onFalla&&onFalla();},function(){cb&&cb();});
    })
    .catch(function(){delete VOZ_CACHE[k];onFalla&&onFalla();});   // reintentable
}

/* ═══ precarga ═══
   La causa real de que el audio llegara tarde: cada frase se pedía al servidor
   apenas se tocaba el botón, y Apps Script tarda 1-3 segundos en responder.
   Ahora las frases de la pantalla se piden desde que la pantalla se dibuja,
   una por una y sin sonar. Cuando el alumno toca, ya están en memoria. */
var VEL_PEDIDA=null;
var PRECARGANDO=false;
function precargarVoz(texto,lang,listo){
  if(!VOZ_ENDPOINT||!texto){listo&&listo();return;}
  var k=clave(texto)+'|'+(PAQUETE_ACTIVO||'audio-us')+'|'+sexoDeLaFrase(texto);
  if(VOZ_CACHE[k]){listo&&listo();return;}   // ya la tenemos
  fetch(VOZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({texto:texto,idioma:(lang==='es-MX'?'es':'en'),
      paquete:PAQUETE_ACTIVO||'audio-us',sexo:sexoDeLaFrase(texto)})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(d&&d.ok&&d.audio)VOZ_CACHE[k]='data:audio/mpeg;base64,'+d.audio;
      listo&&listo();
    })
    .catch(function(){listo&&listo();});
}
// de una en una: si se piden 12 de golpe, Apps Script las encola y tarda más
function precargarLista(frases){
  if(!frases||!frases.length||PRECARGANDO)return;
  PRECARGANDO=true;
  var i=0;
  (function siguiente(){
    if(i>=frases.length){PRECARGANDO=false;return;}
    var f=frases[i++];
    var texto=(typeof f==='string')?f:(f&&(f.en||f.texto||f.q));
    var lang=(typeof f==='object'&&f&&f.lang)?f.lang:'en-US';
    if(!texto){siguiente();return;}
    precargarVoz(texto,lang,siguiente);
  })();
}

/* ═══════════ grabar audio (respaldo para Android) ═══════════ */
// El reconocimiento de voz falla en muchos Android. La grabación no:
// se graba el audio, se guarda, y Brian lo escucha después.
var HAY_GRAB=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var grabadora=null,trozos=[],streamActivo=null;

function grabarInicio(onListo,onError){
  if(!HAY_GRAB){onError&&onError('sin-soporte');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    streamActivo=st;trozos=[];
    var tipo='';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].forEach(function(t){
      if(!tipo&&window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))tipo=t;
    });
    grabadora=tipo?new MediaRecorder(st,{mimeType:tipo}):new MediaRecorder(st);
    grabadora.ondataavailable=function(e){if(e.data&&e.data.size)trozos.push(e.data);};
    grabadora.onstop=function(){
      var blob=new Blob(trozos,{type:grabadora.mimeType||'audio/webm'});
      if(streamActivo){streamActivo.getTracks().forEach(function(t){t.stop();});streamActivo=null;}
      onListo&&onListo(blob);
    };
    grabadora.start();
  }).catch(function(e){onError&&onError(e&&e.name||'error');});
}
function grabarFin(){
  try{if(grabadora&&grabadora.state!=='inactive')grabadora.stop();}catch(e){}
}
function blobABase64(blob,cb){
  var r=new FileReader();
  r.onloadend=function(){cb(String(r.result).split(',')[1]||'');};
  r.readAsDataURL(blob);
}

function norm(s){return String(s).toLowerCase().replace(/[.,!?¿¡;:"']/g,'').replace(/\s+/g,' ').trim();}
function peso(w){return Math.max(1,w.length);}
function comparar(meta,oido){
  var m=norm(meta).split(' ').filter(Boolean), o=norm(oido).split(' ').filter(Boolean);
  var pool=o.slice(), marcas=m.map(function(w){
    var i=pool.indexOf(w);
    if(i>=0){pool.splice(i,1);return true;}
    return false;
  });
  // se pondera por largo de palabra: fallar "dentist" pesa más que comerse "a"
  var total=0,logrado=0;
  m.forEach(function(w,i){total+=peso(w);if(marcas[i])logrado+=peso(w);});
  return {pct:total?Math.round(logrado/total*100):0, marcas:marcas, palabras:m};
}
function pintar(meta,cmp){
  return cmp.palabras.map(function(w,i){
    return '<span class="'+(cmp.marcas[i]?'w-ok':'w-no')+'">'+esc(w)+'</span>';
  }).join(' ');
}

function materialDe(p){
  var n=p.nivel_n||0;
  // --- pre-A1 usa el molde nuevo de 3 areas (listening, gramatica, produccion) ---
  if(n===0 && typeof moldePreA1==='function'){
    var mp=moldePreA1(p);
    try{ mp = frasesDeBrian().concat(mp); }catch(e){}
    return mp;
  }
  function frase(t,pre){
    t=(t||'').trim();
    if(!t)return null;
    return (pre?pre+' ':'')+t.replace(/\.$/,'')+'.';
  }
  var yo='My name is '+p.nombre+'.';
  var trab=frase(p.trabajo_en&&p.trabajo_en.replace(/^I am /,''),'I am')||'I have a job.';
  var lug=frase(p.lugar_en&&p.lugar_en.replace(/^I work /,''),'I work')||'I work every day.';
  var acc=frase(p.accion_en)||'I work every day.';
  var hor=frase(p.hora_en&&p.hora_en.replace(/^I start /,''),'I start')||'I start early.';
  var gus=frase(p.gusto_en&&p.gusto_en.replace(/^I like /,''),'I like')||'I like my family.';
  var met=frase(p.meta_en&&p.meta_en.replace(/^I study English /,''),'I study English')||'I study English for my job.';

  var base=[
    {t:'Tú, en tres frases', hoy:'aprendemos a presentarnos',
     obj:'Decir tu nombre, tu trabajo y dónde trabajas, sin leer.',
     tip:'Busca un lugar sin ruido. Si tienes audífonos con micrófono, mejor.',
     enc:'Hoy vas a decir quién eres, en qué trabajas y dónde. Son tus frases, hechas con lo que tú me contaste. Primero las oyes, luego las repites.',
     items:[
       {k:'model',en:yo,es:'Me llamo '+p.nombre+'.'},
       {k:'model',en:trab,es:'Soy '+limpiarOficio(p.trabajo_es)+'.'},
       {k:'model',en:lug,es:'Trabajo en '+p.lugar_es+'.'},
       {k:'ask',q:'What is your name?',es:'¿Cómo te llamas? Contesta con la primera frase.',pista:yo},
       {k:'ask',q:'What do you do?',es:'¿A qué te dedicas?',pista:trab},
       {k:'free',q:'Tell me about you.',es:'Dime quién eres. Todo lo que puedas.'}
     ]},
    {t:'Lo que haces todos los días', hoy:'aprendemos a contar tu rutina',
     obj:'Contar qué haces y a qué hora empiezas, contestando en voz alta.',
     tip:'Si algo no te sale a la primera, dilo otra vez. Nadie te está calificando el intento.',
     enc:'Ahora tu rutina. Vamos a usar lo de ayer y le sumamos lo que haces y a qué hora.',
     items:[
       {k:'model',en:acc,es:p.accion_es.charAt(0).toUpperCase()+p.accion_es.slice(1)+'.'},
       {k:'model',en:hor,es:'Empiezo a las '+p.hora_es+'.'},
       {k:'model',en:'I work every day.',es:'Trabajo todos los días.'},
       {k:'ask',q:'What do you do every day?',es:'¿Qué haces todos los días?',pista:acc},
       {k:'ask',q:'What time do you start?',es:'¿A qué hora empiezas?',pista:hor},
       {k:'free',q:'Tell me about your day.',es:'Cuéntame tu día.'}
     ]},
    {t:'Conversación: que te pregunten', hoy:'practicamos contestar preguntas',
     obj:'Contestar cinco preguntas sin ver el texto, y hacer una pregunta tú.',
     tip:'Esta es la más parecida a una conversación real. Va a costar más, y eso está bien.',
     enc:'Hoy es puro contestar. Yo pregunto, tú respondes en voz alta. Si no sale, pides la pista y ya.',
     items:[
       {k:'model',en:'Nice to meet you.',es:'Mucho gusto.'},
       {k:'model',en:'And you?',es:'¿Y tú?'},
       {k:'ask',q:'Hello! What is your name?',es:'Salúdame y di tu nombre.',pista:yo},
       {k:'ask',q:'Where do you work?',es:'¿Dónde trabajas?',pista:lug},
       {k:'ask',q:'What time do you start?',es:'¿A qué hora entras?',pista:hor},
       {k:'ask',q:'Do you work every day?',es:'Contesta: Yes, I do. / No, I do not.',pista:'Yes, I do.'},
       {k:'free',q:'Now ask me a question.',es:'Ahora pregúntame tú algo a mí. Lo que sea.'}
     ]},
    {t:'Lo que te gusta', hoy:'aprendemos a dar tu opinión',
     obj:'Decir qué te gusta y para qué quieres el inglés, con tus palabras.',
     tip:'Aquí no hay respuesta correcta. Lo que digas es tuyo.',
     enc:'Hoy opiniones. Es donde deja de sonar a repetir frases y empieza a sonar a tú.',
     items:[
       {k:'model',en:gus,es:'Me gusta '+p.gusto_es+'.'},
       {k:'model',en:met,es:'Estudio inglés '+p.meta_es+'.'},
       {k:'model',en:'It is difficult, but I like it.',es:'Es difícil, pero me gusta.'},
       {k:'ask',q:'What do you like?',es:'¿Qué te gusta?',pista:gus},
       {k:'ask',q:'Why do you study English?',es:'¿Para qué estudias inglés?',pista:met},
       {k:'free',q:'Tell me what you like and why.',es:'Dime qué te gusta y por qué.'}
     ]},
    {t:'Repaso · la misma pregunta del día uno', hoy:'repasamos todo lo que ya sabes',
     obj:'Contestar la misma pregunta de la sesión 1 — y notar la diferencia.',
     tip:'No repases antes. La gracia es ver qué te sale solo.',
     enc:'Hoy no hay nada nuevo. Te voy a hacer la misma pregunta de la primera sesión. Así los dos vemos cuánto cambió.',
     items:[
       {k:'model',en:yo+' '+trab,es:'Me llamo '+p.nombre+'. Soy '+limpiarOficio(p.trabajo_es)+'.'},
       {k:'model',en:lug+' '+acc,es:'Trabajo en '+p.lugar_es+'. '+p.accion_es+'.'},
       {k:'ask',q:'Who are you and what do you do?',es:'¿Quién eres y a qué te dedicas?',pista:yo+' '+trab},
       {k:'free',q:'Tell me about you.',es:'La misma de la sesión 1. Todo lo que puedas ahora.'}
     ]}
  ];

  // el nivel decide cuánto modelo se da y qué tanto se le exige
  return base.map(function(ses,idx){
    var mods=ses.items.filter(function(x){return x.k==='model';});
    var resto=ses.items.filter(function(x){return x.k!=='model';});
    var it;
    if(n===0){            // Pre-A1: máximo 3 frases modelo
      it=mods.slice(0,3).concat(resto);
    }else if(n===1){      // A1: como está
      it=mods.concat(resto);
    }else{                // A2 o más: menos repetir, más hablar
      it=mods.slice(0,2).concat(resto);
      it.push({k:'free',q:'Tell me more. Why?',es:'Explícame por qué. Alárgate más que en la respuesta anterior.'});
    }
    // antes de la producción libre: usar lo aprendido en una situación real
    // las situaciones sueltas se fueron: el cierre en conversación ya las cubre
    var sits=[];
    // una serie de cambios sobre la primera frase modelo de la sesión
    var mods=it.filter(function(x){return x.k==='model';});
    var serie=mods.length?serieDe(mods[0].en,p).slice(0,n>=2?5:3):[];
    var drills=serie.map(function(x){
      return {k:'drill',pide:x.pide,en:x.di,es:'Dilo en voz alta.'};
    });
    // el cierre: conversación de dos o tres turnos, escuchar y contestar
    var turnos=conversacionDe(p,idx);
    var cuantos = n<=0 ? 2 : 3;
    var libres=[];
    turnos.slice(0,cuantos).forEach(function(t){
      libres.push({k:'sit',ctx:t.ctx,q:t.dice,es:t.pide,pista:''});
      libres.push({k:'free',ctx:t.ctx,q:t.dice,es:t.pide,tras:true});
    });
    var resto2=it.filter(function(x){return x.k!=='free';}).concat(drills);
    // números y horas: donde más se falla en A1
    if(idx===1||idx===2)resto2=resto2.concat([ejercicioNumeros(),ejercicioNumeros()]);
    // primero lo que falló ayer, luego lo nuevo
    it=frasesDeBrian().concat(tocaHoy(3)).concat(resto2).concat(sits).concat(libres);
    return {t:ses.t,hoy:ses.hoy,obj:ses.obj,tip:ses.tip,enc:ses.enc,items:it};
  });
}

      '<button class="bj-b chico apaga" data-j="salir">Salir</button>'+
    '</div>';

  b.querySelectorAll('[data-j]').forEach(function(bt){
    bt.onclick=function(e){
      e.stopPropagation();
      var a=bt.dataset.j;
      if(a==='salir'){ JEFE_LIBRE=false; pintarBarraJefe(); return; }
      if(a==='panel'){ pantallaJefe(); return; }
      if(a==='mapa'){ mapa(); setTimeout(pintarBarraJefe,60); return; }
      if(a==='cierre'){ try{cierre();}catch(err){} setTimeout(pintarBarraJefe,60); return; }
      if(!MAT||!MAT.length){ avisito('Primero arma material desde el menú jefe.'); return; }

      if(a==='adelante'){ it++; if(it>=(MAT[sIdx].items||[]).length){it=0;} paso(); }
      if(a==='atras'){ it--; if(it<0){it=Math.max(0,(MAT[sIdx].items||[]).length-1);} paso(); }
      if(a==='lecmas'||a==='lecmenos'){
        sIdx=(sIdx+(a==='lecmas'?1:-1)+MAT.length)%MAT.length;
        it=0; attempts=[]; vistos={};
        try{ paso(); }
        catch(err){ avisito('Esa lección truena: '+String(err).slice(0,80)); }

        var cc=progreso();
        cc.parada=Math.max(1,Math.min(PARADAS,cc.parada+(a==='parmas'?1:-1)));
        if(cc.maxima<cc.parada)cc.maxima=cc.parada;
        guardarProgreso(cc); mapa();
      }
      setTimeout(pintarBarraJefe,60);
    };
  });
}

    var f=forzar;forzar=null;

    if(f==='voz'){vozPicker();return;}
  }
  // el saludo sale una vez por sesión, ya con el mapa detrás
  setTimeout(function(){

         sessionStorage.setItem('efa_saludo','1'); }catch(e){ return; }

      APP.innerHTML='<div class="card"><h2>Modo jefe</h2>'+
        '<p class="tiny">Algo falló al pintarlo: '+esc(String(e))+'</p>'+
        '<button class="btn" onclick="location.href=location.pathname">Volver a la app</button></div>';
    }
    return;
  }
  if(!vioMarca){marca();return;}
  if(!vioSaludo){portada();return;}

  // De aquí en adelante ya no se le pide nada para entrar: ve su tablero.
  // Las preguntas, la prueba de voz y el personaje viven en el cajón.
  if(PAQUETE_ACTIVO!==D.paquete){PAQUETE_ACTIVO=D.paquete;armarRutas();}
  if(D.velAudio)VEL_AUDIO=D.velAudio;
  aplicarVoz(D.voz);elegirVozES();if(D.rate)RATE=D.rate;

  if(PERSONALIZANDO){ seguirPersonalizacion(); return; }

  // Si el perfil guardado quedó a medias, no lo dejamos en pantalla muerta:
  // se le pide otra vez, en vez de reventar en silencio.
  MAT=null;
  if(P){
    try{ MAT=materialDe(P); }
    catch(e){ MAT=null; P=null; D.perfil=null; save(D); }
  }
  if(sIdx===null||!P||!MAT){mapa();return;}
  correr();
}

function momento(){
  var h=new Date().getHours();
  return h<12?1:(h<19?2:3);
}
function saludoDelDia(vuelve){
  var m=momento();
  var pool=SALUDOS.filter(function(s){
    if(s.mom!==0&&s.mom!==m)return false;
    if(s.quien===1&&vuelve)return false;
    if(s.quien===2&&!vuelve)return false;
    return true;
  });
  if(!pool.length)pool=[SALUDOS[0]];
  // que no repita el de la vez pasada
  var previo=D.ultimoSaludo;
  var libres=pool.filter(function(s){return s.en!==previo;});
  if(libres.length)pool=libres;
  var s=pool[Math.floor(Math.random()*pool.length)];
  D.ultimoSaludo=s.en;
  D.saludosVistos=(D.saludosVistos||[]);
  if(D.saludosVistos.indexOf(s.en)<0)D.saludosVistos.push(s.en);
  save(D);
  return s;
}

// Una idea se dice de varias formas. Aprender solo una deja a la persona
// atorada cuando le contestan distinto. Cada frase modelo lleva sus variantes.
function variantesDe(en,p){
  var n=p&&p.nombre?p.nombre:'';
  var t=String(en||'').trim();
  var v=[],m;

  // frases compuestas: se toman las variantes de la primera parte
  if(/\.\s+\S/.test(t)&&t.split(/\.\s+/).length>1){
    var partes=t.split(/\.\s+/);
    var prim=partes[0]+'.', resto=partes.slice(1).join('. ');
    var vp=variantesDe(prim,p);
    if(vp.length>1)return vp.map(function(x){return x.replace(/\.$/,'')+'. '+resto;});
  }

  // presentarse
  if((m=t.match(/^My name is\s+(.+?)\.?$/i)))      v=['My name is '+m[1]+'.','I am '+m[1]+'.',"I'm "+m[1]+'.'];
  else if((m=t.match(/^His name is\s+(.+?)\.?$/i)))v=['His name is '+m[1]+'.','He is '+m[1]+'.',"He's "+m[1]+'.'];
  else if((m=t.match(/^Her name is\s+(.+?)\.?$/i)))v=['Her name is '+m[1]+'.','She is '+m[1]+'.',"She's "+m[1]+'.'];
  // oficio con artículo
  else if((m=t.match(/^I am (a|an)\s+(.+?)\.?$/i)))  v=['I am '+m[1]+' '+m[2]+'.',"I'm "+m[1]+' '+m[2]+'.','I work as '+m[1]+' '+m[2]+'.'];
  else if((m=t.match(/^He is (a|an)\s+(.+?)\.?$/i))) v=['He is '+m[1]+' '+m[2]+'.',"He's "+m[1]+' '+m[2]+'.','He works as '+m[1]+' '+m[2]+'.'];
  else if((m=t.match(/^She is (a|an)\s+(.+?)\.?$/i)))v=['She is '+m[1]+' '+m[2]+'.',"She's "+m[1]+' '+m[2]+'.','She works as '+m[1]+' '+m[2]+'.'];
  // oficio sin artículo: in sales, in IT, retired
  else if((m=t.match(/^I am not (.+?)\.?$/i)))     v=['I am not '+m[1]+'.',"I'm not "+m[1]+'.'];
  else if((m=t.match(/^I am\s+(.+?)\.?$/i)))       v=['I am '+m[1]+'.',"I'm "+m[1]+'.','I work '+m[1]+'.'];
  else if((m=t.match(/^We are\s+(.+?)\.?$/i)))     v=['We are '+m[1]+'.',"We're "+m[1]+'.'];
  // lugar de trabajo, cualquier preposición
  else if((m=t.match(/^I work\s+((?:at|in|on|from|around|for)\s+.+?)\.?$/i)))
        v=['I work '+m[1]+'.','My job is '+m[1]+'.','I have a job '+m[1]+'.'];
  else if((m=t.match(/^He works\s+((?:at|in|on|from|around|for)\s+.+?)\.?$/i)))
        v=['He works '+m[1]+'.','His job is '+m[1]+'.'];
  else if(/^I work every day\.?$/i.test(t))       v=['I work every day.','I work from Monday to Friday.','I work all week.'];
  // horario
  else if((m=t.match(/^I start\s+(.+?)\.?$/i)))    v=['I start '+m[1]+'.','I begin '+m[1]+'.','My shift starts '+m[1]+'.'];
  else if((m=t.match(/^She starts\s+(.+?)\.?$/i))) v=['She starts '+m[1]+'.','She begins '+m[1]+'.'];
  else if((m=t.match(/^He starts\s+(.+?)\.?$/i)))  v=['He starts '+m[1]+'.','He begins '+m[1]+'.'];
  // gustos
  else if((m=t.match(/^I like\s+(.+?)\.?$/i)))     v=['I like '+m[1]+'.','I enjoy '+m[1]+'.','I really like '+m[1]+'.'];
  else if((m=t.match(/^He likes\s+(.+?)\.?$/i)))   v=['He likes '+m[1]+'.','He enjoys '+m[1]+'.'];
  // para qué el inglés
  else if((m=t.match(/^I study English\s+(.+?)\.?$/i)))
        v=['I study English '+m[1]+'.','I am learning English '+m[1]+'.','I need English '+m[1]+'.'];
  // negativos y preguntas de la serie
  else if((m=t.match(/^I do not\s+(.+?)\.?$/i)))   v=['I do not '+m[1]+'.',"I don't "+m[1]+'.'];
  else if((m=t.match(/^Do you\s+(.+?)\?$/i)))      v=['Do you '+m[1]+'?','Do you usually '+m[1]+'?'];
  else if((m=t.match(/^Are you\s+(.+?)\?$/i)))     v=['Are you '+m[1]+'?','So, are you '+m[1]+'?'];
  else if(/^What is your name\?$/i.test(t))       v=['What is your name?',"What's your name?",'Can I have your name?'];
  else if(/^What time do you start\?$/i.test(t))  v=['What time do you start?','When do you start?'];
  // sociales
  else if(/^Nice to meet you\.?$/i.test(t))       v=['Nice to meet you.','Good to meet you.','Pleased to meet you.'];
  else if(/^And you\?$/i.test(t))                 v=['And you?','What about you?','How about you?'];
  else if(/^Yes, I do\.?$/i.test(t))              v=['Yes, I do.','Yes, every day.'];
  else if(/^It is difficult, but I like it\.?$/i.test(t))
        v=['It is difficult, but I like it.',"It's difficult, but I like it.",'It is hard, but I like it.'];
  // acciones del día: I check things, He checks things
  else if((m=t.match(/^I\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r=m[2]?(' '+m[2]):'';
    v=['I '+m[1]+r+'.','I usually '+m[1]+r+'.','My job is to '+m[1]+r+'.'];
  }
  else if((m=t.match(/^He\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r2=m[2]?(' '+m[2]):'';
    v=['He '+m[1]+r2+'.','He usually '+m[1]+r2+'.'];
  }
  else if((m=t.match(/^She\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r3=m[2]?(' '+m[2]):'';
    v=['She '+m[1]+r3+'.','She usually '+m[1]+r3+'.'];
  }
  // si nada aplicó, al menos la contracción de is/am/are
  if(!v.length){
    var c=t.replace(/\bIt is\b/,"It's").replace(/\bThat is\b/,"That's").replace(/\bI am\b/,"I'm");
    v=(c!==t)?[t,c]:[t];
  }
  return v.filter(function(x,i,a){return x&&a.indexOf(x)===i;});
}

// Lo que salió mal la vez pasada se vuelve a practicar al día siguiente.
function repasoDeErrores(){
  var d=load();
  if(!d.sesiones||!d.sesiones.length)return [];
  var ult=d.sesiones[d.sesiones.length-1];
  var flojas=(ult.intentos||[]).filter(function(a){
    return a.tipo==='model'&&a.pct!==null&&a.pct!==undefined&&a.pct<80&&a.meta;
  });
  var vistos={},out=[];
  flojas.forEach(function(a){
    if(vistos[a.meta])return;
    vistos[a.meta]=1;
    out.push({k:'model',en:a.meta,es:'Esta te costó la vez pasada. Vamos otra vez.',repaso:true});
  });
  return out.slice(0,3);
}

// El error más común del shadowing es practicar sin oírse. Después de hablar,
// puede oír el modelo y su propia voz, una tras otra.
var MI_GRABACION=null,GRAB_ACTIVA=null,GRAB_TROZOS=[];
function grabandoDisponible(){
  return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
}
function empezarGrabacion(){
  if(!grabandoDisponible())return;
  // Si la app está sonando, el micrófono la graba a ella y no al alumno.
  // Se calla ANTES de abrir el micrófono, siempre.
  callarTodo();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    GRAB_TROZOS=[];
    var tipo='';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4'].forEach(function(t){
      if(!tipo&&window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))tipo=t;
    });
    GRAB_ACTIVA=tipo?new MediaRecorder(st,{mimeType:tipo}):new MediaRecorder(st);
    GRAB_ACTIVA.ondataavailable=function(e){if(e.data&&e.data.size)GRAB_TROZOS.push(e.data);};
    GRAB_ACTIVA.onstop=function(){
      try{st.getTracks().forEach(function(t){t.stop();});}catch(e){}
      if(!GRAB_TROZOS.length)return;
      MI_GRABACION=URL.createObjectURL(new Blob(GRAB_TROZOS,{type:GRAB_ACTIVA.mimeType||'audio/webm'}));
    };
    GRAB_ACTIVA.start();
  }).catch(function(){});
}
function pararGrabacion(){
  try{if(GRAB_ACTIVA&&GRAB_ACTIVA.state!=='inactive')GRAB_ACTIVA.stop();}catch(e){}
  GRAB_ACTIVA=null;
}
function bloqueComparar(meta){
  if(!MI_GRABACION)return '';
  return '<div class="compbox">'+
    '<div class="hl">Óyelo seguido: primero como se dice, luego como lo dijiste</div>'+
    '<div class="compfila">'+

}

  var y=document.getElementById('cmpmia');

// El botón de "qué significa" solo servía en la frase principal.
// Las variantes no traían traducción escrita, así que se le pide al cerebro
// (y si no hay cerebro, se dice al menos en inglés para no dejar al alumno colgado).
var TRAD_CACHE={};
function traducirVariante(en,caja,listo){
  if(!en)return;
  function pinta(es){
    if(es&&caja){
      var d=document.createElement('div');
      d.className='vartrad';
      d.textContent=es;
      caja.appendChild(d);
    }
    if(es)say(es,'es-MX');
    else say(en,'en-US');
    listo&&listo(es);
  }
  if(TRAD_CACHE[en]){ pinta(TRAD_CACHE[en]); return; }
  if(!hayIA()){ pinta(null); return; }
  if(caja){
    var esp=document.createElement('div');
    esp.className='vartrad pensando'; esp.textContent='traduciendo…';
    caja.appendChild(esp);
  }
  pedirIA('duda',{
      pregunta:'Traduce esta frase al español de México, natural y corta. '+
               'Responde SOLO con la traducción, sin comillas ni explicación: "'+en+'"',
      nivel:(P&&P.nivel)||'', trabajo:(P&&P.trabajo_es)||''},
    function(res){
      var esp2=caja&&caja.querySelector('.vartrad.pensando');
      if(esp2)esp2.remove();
      var es=(res&&res.respuesta)?String(res.respuesta).replace(/^["']|["']$/g,'').trim():null;
      if(es)TRAD_CACHE[en]=es;
      pinta(es);
    },
    function(){
      var esp3=caja&&caja.querySelector('.vartrad.pensando');
      if(esp3)esp3.remove();
      pinta(null);
    });
}

  function instruccion(q){
    var niv=(P&&P.nivel)||'A1';
    var base='Alumno mexicano de nivel '+niv+' aprendiendo inglés de trabajo. ';
    if(frase)base+='Está practicando la frase: "'+frase+'". ';
    if(MODO==='phrasal'){
      return base+'Dale DOS phrasal verbs útiles relacionados con esa frase o con su trabajo. '+
        'Formato exacto, sin nada más:\nphrasal — significado en español — ejemplo corto en inglés\n'+
        'Uno por línea. Nivel '+niv+', nada rebuscado.';
    }
    if(MODO==='idiom'){
      return base+'Dale UNA expresión idiomática en inglés que sirva en su trabajo y se '+
        'relacione con la frase. Formato exacto, sin nada más:\n'+
        'expresión — qué significa en español — cuándo se usa (una línea)';
    }
    if(MODO==='porque'){
      return base+'Explícale en español, en máximo tres líneas y sin tecnicismos, por qué esa '+
        'frase se dice así en inglés. Si hay una regla, dísela con palabras sencillas.';
    }
    if(MODO==='decir'){
      return base+'Quiere decir: "'+q+'". Dale la frase en inglés, corta y natural, en la PRIMERA '+
        'línea y sola. Luego, en UNA línea, explícale en español qué cambió respecto a la frase '+
        'que practica. Nada más.';
    }
    return base+'Su pregunta es: "'+q+'". Contéstale en español, claro y corto, máximo cuatro '+
      'líneas. Si la respuesta incluye una frase en inglés, ponla en la PRIMERA línea, sola.';
  }

  function mandar(){
    var q=(inp&&inp.value||'').trim();
    if(!q&&MODO!=='phrasal'&&MODO!=='idiom'&&MODO!=='porque'){
      avisito(PREG_IDIOMA==='es'?'Escribe o di tu pregunta.':'Type or say your question.');
      return;

    if(!hayIA()){
      if(r)r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta al revisar tu sesión.</span></div>';
      try{ DUDAS.push(q); }catch(e){}

    pedirIA('duda',{pregunta:instruccion(q),nivel:(P&&P.nivel)||'',trabajo:(P&&P.trabajo_es)||''},
      function(res){

          if(r)r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta.</span></div>';
          return;
        }
        var t=String(res.respuesta).trim();
        var prim=(t.split('\n')[0]||'').replace(/^["']|["']$/g,'').trim();
        // ¿la primera línea es una frase en inglés que se pueda practicar?
        var esIngles=/^[A-Za-z0-9 ,.'!?-]+$/.test(prim)&&prim.split(' ').length>1&&prim.length<90;
        if(r)r.innerHTML=
          '<div class="heard"><div class="hl">'+(MODO==='phrasal'?'phrasal verbs':
             MODO==='idiom'?'expresión':MODO==='porque'?'por qué':'respuesta')+'</div>'+
          '<div class="pgtxt">'+esc(t).replace(/\n/g,'<br>')+'</div>'+
          '<div class="oirfila" style="margin-top:8px">'+
            '<button class="oirb" id="dfoir">'+ico('bocina',16)+' Oírla</button>'+
            (esIngles?'<button class="oirb alt" id="dfusar">Practicar esta</button>':'')+
          '</div></div>';
        if(esIngles)say(prim,'en-US'); else say(t,'es-MX');
        attempts.push({tipo:'pregunta-'+MODO,meta:q||frase,oido:t,pct:null});
        try{ DUDAS.push((q||MODO)+'  →  '+t); }catch(e){}
        var o=document.getElementById('dfoir');
        if(o)o.onclick=function(ev){ev.stopPropagation();
          if(esIngles)say(prim,'en-US'); else say(t,'es-MX');};
        var u=document.getElementById('dfusar');
        if(u)u.onclick=function(ev){
          ev.stopPropagation();
          x.en=prim; x.es=q||'';
          paso();
          avisito('Ahora practicas la tuya.');
        };
      },
      function(){
        if(r)r.innerHTML='<div class="heard"><span class="ok2">No pude traerla. Brian te la contesta al revisar.</span></div>';
      });
  }

  var ok=document.getElementById('dfok');
  if(ok)ok.onclick=function(e){e.stopPropagation();mandar();};
  if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')mandar();});
}

      {pide:'Ahora dilo en negativo.',            di:'I am not '+art+' '+of+'.'},
      {pide:'Ahora pregúntale a alguien.',        di:'Are you '+art+' '+of+'?'}
    ];
  }else if((m=en.match(/^I work\s+(.+?)\.?$/i))){
    var d=m[1];

      {pide:'Ahora de ustedes. Nosotros.', di:'We work '+d+'.'},
      {pide:'Ahora en negativo.',          di:'I do not work '+d+'.'},
      {pide:'Ahora pregunta.',             di:'Do you work '+d+'?'}
    ];
  }else if((m=en.match(/^I start\s+(.+?)\.?$/i))){
    var h=m[1];
    out=[
      {pide:'Ahora de tu compañera. Ella.', di:'She starts '+h+'.'},
      {pide:'Ahora pregunta la hora.',      di:'What time do you start?'},
      {pide:'Ahora en negativo.',           di:'I do not start '+h+'.'}
    ];
  }else if((m=en.match(/^I like\s+(.+?)\.?$/i))){
    var g=m[1];
    out=[
      {pide:'Ahora de un compañero. A él le gusta.', di:'He likes '+g+'.'},
      {pide:'Ahora en negativo.',                    di:'I do not like '+g+'.'},
      {pide:'Ahora pregunta.',                       di:'Do you like '+g+'?'}
    ];
  }else if((m=en.match(/^My name is\s+(.+?)\.?$/i))){
    out=[
      {pide:'Ahora presenta a alguien más.', di:'His name is Pedro.'},
      {pide:'Ahora a una compañera.',        di:'Her name is Ana.'},
      {pide:'Ahora pregunta el nombre.',     di:'What is your name?'}
    ];
  }else if((m=en.match(/^I\s+([a-z]+)\s*(.*?)\.?$/i))){
    var v=m[1], resto=m[2]?(' '+m[2]):'';
    var v3=/[sxz]$|ch$|sh$/.test(v)?v+'es':(/[^aeiou]y$/.test(v)?v.slice(0,-1)+'ies':v+'s');

    ];
  }
  return out;
}

        }

}

var PARADAS=72;          // 60 de contenido + 12 de repaso
var CADA=6;              // cada sexta casilla es repaso: 5 normales y una de vuelta

// ¿esta casilla es de repaso?
function esRepaso(n){ return n%CADA===0; }
// a qué sesión de contenido corresponde una casilla que no es de repaso
function contenidoDe(n){ return n-Math.floor(n/CADA); }

  return AMBIENTES[0];

  return 0;
}

  var d=load();

    d.camino={parada:paradaInicial(P&&P.nivel_n),maxima:paradaInicial(P&&P.nivel_n),
              puntos:0,gastados:0,dias:[],avatar:{}};

  return d.camino;

// ── puntos ──
// Se ganan por producir y por volver. Volver pesa más: terminar una lección
// lo hace cualquiera con ganas un martes; volver el jueves es lo difícil.
function sumarPuntos(rec){
  var c=progreso();
  var att=rec.intentos||[];
  var producidas=att.filter(function(a){return a.oido&&a.tipo!=='pista'&&a.tipo!=='listening'&&a.tipo!=='numeros';}).length;
  var escuchas=att.filter(function(a){return a.tipo==='listening'&&a.pct===100;}).length;
  var sombra=att.filter(function(a){return a.tipo==='shadow';}).length;
  var ganados=producidas*3+escuchas*2+sombra*2+10;   // 10 por terminar

  // constancia: si volvió otro día, vale más
  var hoy=new Date().toISOString().slice(0,10);
  if(c.dias.indexOf(hoy)<0){
    c.dias.push(hoy);
    var seguidos=diasSeguidos(c.dias);
    ganados+=15+Math.min(seguidos,5)*5;
  }
  c.puntos+=ganados;
  SALTAR_DESDE=c.parada;             // de aquí brinca el muñeco al volver al mapa
  c.parada=Math.min(c.parada+1,PARADAS);
  c.maxima=Math.max(c.maxima,c.parada);
  guardarProgreso(c);
  return {ganados:ganados,producidas:producidas,escuchas:escuchas,sombra:sombra};
}
function diasSeguidos(dias){
  if(!dias.length)return 0;
  var o=dias.slice().sort().reverse(),n=1;
  for(var i=1;i<o.length;i++){
    var a=new Date(o[i-1]),b=new Date(o[i]);
    if(Math.round((a-b)/86400000)===1)n++; else break;
  }
  return n;
}
function puntosLibres(){var c=progreso();return c.puntos-(c.gastados||0);}

    '</div>'+
  '</div>';
  var fp=document.getElementById('fperfil'), inp=document.getElementById('subirfoto');
  if(fp&&inp){
    fp.onclick=function(){ inp.click(); };
    inp.onchange=function(){
      var file=inp.files&&inp.files[0]; if(!file)return;
      var r=new FileReader();
      r.onload=function(){
        // se guarda reducida, para no llenar el teléfono
        var im=new Image();
        im.onload=function(){
          var L=Math.min(im.width,im.height), cv=document.createElement('canvas');
          cv.width=cv.height=240;
          var x=cv.getContext('2d');
          x.drawImage(im,(im.width-L)/2,(im.height-L)/2,L,L,0,0,240,240);
          var d=cv.toDataURL('image/jpeg',0.82);
          try{ localStorage.setItem('efa_foto',d); }catch(e){ avisito('No cupo la foto.'); return; }
          pantallaPerfil(); pintarFotos();
        };
        im.src=r.result;
      };
      r.readAsDataURL(file);
    };
  }
  function liga(id,fn){var b=document.getElementById(id); if(b)b.onclick=fn;}
  liga('pf-datos',   function(){ try{pantallaDatos();}catch(e){} });
  liga('pf-voz',     function(){ try{pantallaVoz();}catch(e){} });
  liga('pf-aspecto', function(){ try{pantallaAspecto();}catch(e){} });
  liga('pf-metodo',  function(){ pantallaMetodo(); });
  liga('pf-tutorial',function(){ mapa(); setTimeout(arrancarTutor,300); });
}

// pisaba a la suya, dejando "undefined" en la portada.
function horaDelDia(){
  var h=new Date().getHours();
  if(h<12) return 'Buenos días';
  if(h<19) return 'Buenas tardes';
  return 'Buenas noches';
}

// la despedida sale cuando el alumno intenta irse
(function(){
  var yaSalio=false;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')yaSalio=true;
  });
  window.addEventListener('pagehide',function(){ yaSalio=true; });
  // en computadora: al llevar el cursor fuera por arriba
  document.addEventListener('mouseout',function(e){
    if(yaSalio||e.relatedTarget||e.clientY>12)return;
    try{ if(!P)return; }catch(err){ return; }
    yaSalio=true;
    hojaAdios();
  });
})();

/* ═══════════ el tablero: losetas con grosor, visto desde arriba ═══════════ */
// Nada de esto son imágenes: se dibuja por código, así que no pesa ni depende
// de ningún servidor. El volumen es falso pero convincente: cada loseta lleva
// su cara de arriba y sus dos caras laterales, más oscuras.
var TW=32, TH=16, TD=13;          // media anchura, media altura, grosor
var COLX=[60,124,188,252];        // las cuatro columnas del serpenteo

// Dónde cae cada parada. Sube en zigzag: cuatro a la derecha, cuatro a la
// izquierda. Así el pulgar siempre alcanza y no se sale de la pantalla.
function celda(n,base){
  var k=n-base;
  var fila=Math.floor(k/4), col=k%4;
  if(fila%2===1)col=3-col;
  return {x:COLX[col], y:0-fila*64-(col*0)};
}
function posicion(n,base,alto){
  // cada parada sube 32 px: da la escalera diagonal, no filas planas.
  // La x va y viene entre cuatro columnas, así el camino serpentea.
  var k=n-base, fila=Math.floor(k/4), col=k%4;
  if(fila%2===1)col=3-col;
  return {x:COLX[col], y:alto-84-k*32};
}

function losetaSVG(cx,cy,arriba,izq,der,dentro,alzada){
  var d=alzada?8:0; cy-=d;
  return '<polygon points="'+(cx-TW)+','+cy+' '+cx+','+(cy-TH)+' '+(cx+TW)+','+cy+' '+cx+','+(cy+TH)+'" fill="'+arriba+'"/>'+
    '<polygon points="'+(cx-TW)+','+cy+' '+(cx-TW)+','+(cy+TD)+' '+cx+','+(cy+TH+TD)+' '+cx+','+(cy+TH)+'" fill="'+izq+'"/>'+
    '<polygon points="'+(cx+TW)+','+cy+' '+(cx+TW)+','+(cy+TD)+' '+cx+','+(cy+TH+TD)+' '+cx+','+(cy+TH)+'" fill="'+der+'"/>'+
    (dentro||'');
}
function palomita(cx,cy,alzada){
  var d=alzada?8:0;
  return '<path d="M'+(cx-8)+' '+(cy-d)+'l6 6 12-12" stroke="#EAF7F1" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
}
// la flecha de "esto ya lo viste": marca las casillas de repaso
function flechaRepaso(cx,cy,color){
  return '<path d="M'+(cx-7)+' '+(cy+1)+'a7 5.5 0 1 1 3 4.4" stroke="'+color+
    '" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
    '<path d="M'+(cx-10)+' '+(cy-3)+'l3 4 4-2.5" stroke="'+color+
    '" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';

// El mismo muñeco, chiquito y en su propio marco: sirve de foto de perfil.
function munecoFoto(a,px){

    '<circle cx="40" cy="40" r="39" fill="var(--crema)" stroke="var(--linea)"/>'+
    munecoSVG(40,72,a,0.98)+'</svg>';

// Los objetos del lugar. Son lo que hace que un tramo se sienta distinto del
// otro: la misma loseta rodeada de máquinas o rodeada de maletas no es igual.
function propSVG(tipo,cx,cy,a){
  function caja(x,y,w,arr,iz,de){
    return '<polygon points="'+(x-w)+','+y+' '+x+','+(y-w/2)+' '+(x+w)+','+y+' '+x+','+(y+w/2)+'" fill="'+arr+'"/>'+
      '<polygon points="'+(x-w)+','+y+' '+(x-w)+','+(y+w*0.6)+' '+x+','+(y+w/2+w*0.6)+' '+x+','+(y+w/2)+'" fill="'+iz+'"/>'+
      '<polygon points="'+(x+w)+','+y+' '+(x+w)+','+(y+w*0.6)+' '+x+','+(y+w/2+w*0.6)+' '+x+','+(y+w/2)+'" fill="'+de+'"/>';
  }
  if(tipo==='maquina')return caja(cx,cy,32,'#C0BCA9','#A19D8B','#918D7C')+caja(cx,cy-24,24,'#8E9A94','#75817B','#66726C');
  if(tipo==='banco')return caja(cx,cy,28,'#B6C2BD','#98A49F','#89959 0'.replace(' ',''))+
    '<rect x="'+(cx-14)+'" y="'+(cy-30)+'" width="28" height="10" rx="3" fill="#7E8A85"/>';
  if(tipo==='escritorio')return caja(cx,cy,30,'#DFC79E','#C0A87F','#B09870')+
    '<rect x="'+(cx-12)+'" y="'+(cy-34)+'" width="24" height="18" rx="3" fill="#9C7C4E"/>';
  if(tipo==='telefono')return caja(cx,cy,26,'#E0CDC2','#C1AEA3','#B29F94')+
    '<rect x="'+(cx-9)+'" y="'+(cy-30)+'" width="18" height="12" rx="4" fill="#993C1D"/>';
  if(tipo==='maleta')return caja(cx,cy,22,'#B9C9C5','#9AAAA6','#8B9B97')+
    '<rect x="'+(cx-10)+'" y="'+(cy-30)+'" width="20" height="16" rx="4" fill="#0F5D45"/>'+
    '<rect x="'+(cx-4)+'" y="'+(cy-36)+'" width="8" height="7" rx="3" fill="#0A4636"/>';
  return '';
}

// El arco que separa un tramo del siguiente. Cruzarlo es el momento.
function arcoSVG(cx,cy,color){
  return '<polygon points="'+(cx-52)+','+cy+' '+cx+','+(cy-26)+' '+(cx+52)+','+cy+' '+cx+','+(cy+26)+'" fill="'+color+'" opacity=".28"/>'+
    '<rect x="'+(cx-30)+'" y="'+(cy-42)+'" width="9" height="34" rx="2" fill="'+color+'"/>'+
    '<rect x="'+(cx+21)+'" y="'+(cy-42)+'" width="9" height="34" rx="2" fill="'+color+'" opacity=".85"/>'+
    '<rect x="'+(cx-34)+'" y="'+(cy-50)+'" width="68" height="9" rx="3" fill="'+color+'"/>';
}

// Arma el tablero entero alrededor de donde va el alumno.
function tableroSVG(actual,total){
  var VENT=10;
  var base=Math.max(1,actual-3);
  var fin=Math.min(total,base+VENT-1);
  // el alto lo mandan las paradas que se ven: 32 px cada una, más aire
  // arriba para la loseta más lejana y abajo para la etiqueta del tramo
  var ALTO=(fin-base)*32+188;
  var h='<svg viewBox="0 0 340 '+ALTO+'" class="tab" role="img">'+
    '<title>Tu camino</title><desc>Casillas que suben en zigzag; tu muñeco está parado en la parada '+actual+'.</desc>';

  // el suelo de cada tramo, dibujado de lejos a cerca
  var vistos={};
  for(var n=fin;n>=base;n--){
    var t=idxTramo(n);
    if(vistos[t])continue;
    vistos[t]=1;
    var a=AMBIENTES[t];
    var p=posicion(n,base,ALTO);
    var cy=p.y;
    h+='<polygon points="170,'+(cy+150)+' 350,'+(cy+60)+' 350,'+(cy-60)+' 170,'+(cy-150)+' -10,'+(cy-60)+' -10,'+(cy+60)+'" fill="'+a.piso+'"/>'+
       '<polygon points="-10,'+(cy+60)+' 170,'+(cy+150)+' 170,'+(cy+166)+' -10,'+(cy+76)+'" fill="'+a.pisoIzq+'"/>'+
       '<polygon points="350,'+(cy+60)+' 170,'+(cy+150)+' 170,'+(cy+166)+' 350,'+(cy+76)+'" fill="'+a.pisoDer+'"/>';
  }

  // los objetos del lugar, a los lados del camino
  for(var n=fin;n>=base;n--){
    var a=ambienteDe(n), p=posicion(n,base,ALTO);
    if((n-base)%4===0 && p.x<180) h+=propSVG(a.props,308,p.y-30,a);
    if((n-base)%4===2 && p.x>170) h+=propSVG(a.props,26,p.y-10,a);
  }

  // los arcos entre tramos
  for(var n=base+1;n<=fin;n++){
    if(idxTramo(n)!==idxTramo(n-1)){
      var p=posicion(n,base,ALTO), a=ambienteDe(n);
      h+=arcoSVG(p.x,p.y+36,a.arco);
    }
  }

  // las losetas, de lejos a cerca para que se tapen bien
  for(var n=fin;n>=base;n--){
    var a=ambienteDe(n), p=posicion(n,base,ALTO);
    if(n<actual){
      var hecha=esRepaso(n)?['#C08A22','#9C7C4E','#8A6A3E']:['#1D9E75','#147A5A','#0F6E56'];
      h+='<g class="lo" data-n="'+n+'">'+losetaSVG(p.x,p.y,hecha[0],hecha[1],hecha[2],palomita(p.x,p.y))+'</g>';
    }else if(n===actual){
      h+='<ellipse cx="'+p.x+'" cy="'+(p.y+18)+'" rx="30" ry="15" fill="#000" opacity=".10"/>';
      h+='<g class="lo aqui" id="losetaAqui" data-n="'+n+'">'+
         losetaSVG(p.x,p.y,esRepaso(n)?'#E8B24C':'#35C08F',esRepaso(n)?'#C08A22':'#1D9E75',esRepaso(n)?'#9C7C4E':'#147A5A',
           '<polygon points="'+(p.x-TW)+','+(p.y-8)+' '+p.x+','+(p.y-TH-8)+' '+(p.x+TW)+','+(p.y-8)+' '+p.x+','+(p.y+TH-8)+'" fill="none" stroke="#0F6E56" stroke-width="2"/>',true)+
         '</g>';
    }else if(esRepaso(n)){
      h+='<g class="lo fut rep" data-n="'+n+'">'+
         losetaSVG(p.x,p.y,'#F0E2C4','#D6C6A4','#C6B694',flechaRepaso(p.x,p.y,'#9C7C4E'))+'</g>';
    }else{
      h+='<g class="lo fut" data-n="'+n+'">'+losetaSVG(p.x,p.y,a.loseta,a.lIzq,a.lDer,numeroEn(p.x,p.y,n,a.num))+'</g>';
    }
  }

  // el muñeco, encima de todo
  var pa=posicion(actual,base,ALTO);
  h+='<g id="muneco">'+munecoSVG(pa.x,pa.y-8,(progreso().avatar)||{})+'</g>';

  // el nombre del tramo, abajo
  var tr=tramoDe(actual), am=ambienteDe(actual);
  h+='<rect x="16" y="'+(ALTO-30)+'" width="'+(tr.nombre.length*7.4+26)+'" height="24" rx="12" fill="'+am.pill+'"/>'+
     '<text x="'+(tr.nombre.length*3.7+29)+'" y="'+(ALTO-14)+'" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="12" fill="'+am.pillTx+'">'+esc(tr.nombre)+'</text>';
  h+='</svg>';
  return {svg:h, base:base, alto:ALTO};
}

// El salto de una loseta a la siguiente. Es lo que hace que avanzar se sienta.
function saltarA(deN,aN,base,alto,cuando){
  var d=posicion(deN,base,alto), a=posicion(aN,base,alto);
  var m=document.getElementById('muneco');
  var lo=document.getElementById('losetaAqui');
  if(!m){ if(cuando)cuando(); return; }
  var t0=Date.now(), DUR=520;
  (function paso(){
    var k=Math.min(1,(Date.now()-t0)/DUR);
    var x=d.x+(a.x-d.x)*k, y=d.y+(a.y-d.y)*k;
    var alto_salto=Math.sin(k*Math.PI)*34;      // la parábola del brinco
    m.setAttribute('transform','translate('+(x-d.x)+','+(y-d.y-alto_salto)+')');
    if(k<1)requestAnimationFrame(paso);
    else{
      m.setAttribute('transform','translate('+(a.x-d.x)+','+(a.y-d.y)+')');
      if(lo){ lo.classList.add('aterriza'); setTimeout(function(){lo.classList.remove('aterriza');},260); }
      if(cuando)cuando();
    }
  })();
}


/* ═══════════ los repasos, armados con lo que a él se le atora ═══════════ */
// Un repaso no es "volver a la parada 3". Es volver a lo que ESTE alumno
// falló, que no es lo mismo que falló su compañero.

function misErrores(){
  var mem=memoria(), out=[];
  Object.keys(mem).forEach(function(k){
    var m=mem[k];
    if(m.dominada)return;
    if(!(m.fallos>0))return;
    out.push({frase:m.frase, fallos:m.fallos, paso:m.paso||0});
  });
  // primero lo que más se le ha caído
  out.sort(function(a,b){return b.fallos-a.fallos||a.paso-b.paso;});
  return out;
}

// Los tipos de error que la IA le ha ido marcando en las sesiones
function tiposDeError(){
  var ses=(load().sesiones||[]).slice(-12), cuenta={};
  ses.forEach(function(r){
    (r.errores_ia||[]).forEach(function(e){
      var t=(e.tipo||e.error||'').toString().trim();
      if(t)cuenta[t]=(cuenta[t]||0)+1;
    });
  });
  return Object.keys(cuenta).map(function(t){return {tipo:t,veces:cuenta[t]};})
    .sort(function(a,b){return b.veces-a.veces;});
}

// Lo que ya corrigió no desaparece de golpe: pasa a vigilancia y vuelve
// UNA vez más, dos repasos después. Si vuelve a salir bien, ahí sí se va.
function retirarError(frase){
  var c=progreso();
  c.vigilancia=c.vigilancia||{};
  if(c.vigilancia[frase]==null){
    c.vigilancia[frase]={vuelve:(c.repasosHechos||0)+2, revisado:false};
  }else{
    c.vigilancia[frase].revisado=true;   // segunda vez limpia: se va
  }
  guardarProgreso(c);
}
function enVigilancia(){
  var c=progreso(), v=c.vigilancia||{}, n=(c.repasosHechos||0), out=[];
  Object.keys(v).forEach(function(f){
    if(!v[f].revisado && v[f].vuelve<=n) out.push(f);
  });
  return out;
}

// El material de una parada de repaso
function materialRepaso(){
  var errs=misErrores().slice(0,4);
  var vigilados=enVigilancia().slice(0,2);
  var items=[], usadas={};

  vigilados.forEach(function(f){
    if(usadas[f])return; usadas[f]=1;
    items.push({k:'model',en:f,es:'Esta se te atoraba. A ver cómo va ahora.',repaso:true,vigilada:true});
  });
  errs.forEach(function(e){
    if(usadas[e.frase])return; usadas[e.frase]=1;
    items.push({k:'model',en:e.frase,es:'Esta se te ha caído '+e.fallos+(e.fallos===1?' vez':' veces')+'.',repaso:true});
  });

  // si todavía no falla nada, se repasa lo más viejo que tenga
  if(!items.length){
    items=tocaHoy(4);
  }
  if(!items.length)return null;

  var tipos=tiposDeError().slice(0,2);
  return {
    titulo:'Parada de repaso',
    esRepaso:true,
    tipos:tipos,
    items:items.slice(0,5)
  };
}


// Un aviso chiquito que se va solo. Para cosas que no merecen pantalla.
function avisito(txt){
  if(!document.body||!document.body.appendChild)return;
  var v=document.getElementById('avisito');
  if(v&&v.remove)v.remove();
  var d=document.createElement('div');
  d.id='avisito'; d.className='avisito'; d.setAttribute('role','status');
  d.textContent=txt;
  document.body.appendChild(d);
  setTimeout(function(){ d.classList.add('fuera'); },2600);
  setTimeout(function(){ if(d.parentNode)d.remove(); },3200);
}

// Arranca una parada de repaso: se arma en el momento con sus errores
function arrancarRepaso(){
  var R=materialRepaso();
  if(!R){
    avisito('Todavía no tengo errores tuyos que repasar. Sigue con la parada normal.');
    var c0=progreso(); c0.parada=Math.min(c0.parada+1,PARADAS); guardarProgreso(c0); mapa();
    return;
  }
  var S={
    t:'Repaso', hoy:'repasamos lo que se te ha atorado',
    enc:'Esto no es material nuevo: son tus propias frases.',
    items:R.items, esRepaso:true, tipos:R.tipos
  };
  MAT=MAT.concat([S]);
  sIdx=MAT.length-1; it=0; attempts=[]; t0=Date.now();
  var c=progreso(); c.repasosHechos=(c.repasosHechos||0)+1; guardarProgreso(c);
  say('Esta parada es de repaso. Son tus frases, las que se te han atorado.','es-MX');
  correr();
}

var TUTOR_PASO=0, TUTOR_VIVO=false;

function pasosTutor(){

function cerrarTutor(){

function pintarTutor(){
  var v=document.getElementById('tutor');
  if(!v)return;
  var pasos=pasosTutor();
  if(TUTOR_PASO>=pasos.length){ cerrarTutor(); return; }
  var p=pasos[TUTOR_PASO];

  // dónde está la cosa que hay que iluminar
  var r=null;
  if(p.donde){
    var o=document.querySelector(p.donde);
    if(o&&o.getBoundingClientRect){
      var b=o.getBoundingClientRect();

      '<defs><mask id="agujero">'+
        '<rect width="'+ancho+'" height="'+alto+'" fill="white"/>'+hoyo+
      '</mask></defs>'+
      '<rect width="'+ancho+'" height="'+alto+'" fill="rgba(16,14,12,.72)" mask="url(#agujero)"/>'+
      (r?'<ellipse cx="'+(r.x+r.w/2)+'" cy="'+(r.y+r.h/2)+'" '+
         'rx="'+(Math.max(r.w,44)/2+10)+'" ry="'+(Math.max(r.h,44)/2+10)+'" '+
         'fill="none" stroke="#35C08F" stroke-width="2.5" class="tutor-aro"/>':'')+
    '</svg>'+
    '<div class="tutor-globo" style="'+(abajo?'top:'+((r?r.y+r.h:alto*0.42)+26)+'px':'bottom:'+(alto-(r?r.y:alto*0.5)+26)+'px')+'">'+
      (r?'<span class="tutor-pico '+(abajo?'arriba':'abajo')+'" style="left:'+
         Math.max(22,Math.min(ancho-42,r.x+r.w/2-12))+'px"></span>':'')+
      '<div class="tutor-cuenta">'+(TUTOR_PASO+1)+' de '+pasos.length+'</div>'+
      '<div class="tutor-t">'+esc(p.titulo)+'</div>'+
      '<div class="tutor-x">'+esc(p.txt)+'</div>'+
      '<div class="tutor-bs">'+
        '<button class="tutor-b fant" id="tsalta">Saltar</button>'+
        '<button class="tutor-b" id="tsig">'+(TUTOR_PASO===pasos.length-1?'Listo':'Siguiente')+'</button>'+
      '</div>'+
    '</div>';

  var sg=document.getElementById('tsig');
  if(sg)sg.onclick=function(){ TUTOR_PASO++; pintarTutor(); };
  var sl=document.getElementById('tsalta');
  if(sl)sl.onclick=cerrarTutor;
  say(p.titulo+'. '+p.txt,'es-MX');
}

/* ═══════════ pantalla del mapa ═══════════ */
// El jefe entra directo a la lección de esa casilla.
function irALeccionDe(n){
  if(!MAT||!MAT.length){ avisito('No hay material cargado.'); return; }
  var idx=(contenidoDe(n)-1)%MAT.length;
  if(idx<0)idx=0;
  sIdx=idx; it=0; attempts=[]; vistos={}; t0=Date.now();
  try{ correr(); setTimeout(pintarBarraJefe,120); }
  catch(err){ avisito('Esa lección truena: '+String(err).slice(0,70)); }
}

// El alumno se ASOMA: ve el tema y una probadita de la gramática,
// pero el detalle completo solo aparece cuando de verdad llega ahí.
function asomarseALeccion(n,actual){
  if(!MAT||!MAT.length)return;
  var idx=(contenidoDe(n)-1)%MAT.length;
  var S=MAT[idx]; if(!S)return;
  var abierta=(n<=actual);

  var items=S.items||[];
  var regla=null, palabras=[];
  items.forEach(function(x){
    if(!regla&&x.k==='regla'&&x.titulo)regla=x.titulo;
    if(x.k==='phrasal'&&x.en)palabras.push(x.en);
    if(x.k==='idiom'&&x.en)palabras.push(x.en);
  });

  var h='<div class="asom-caja">'+
    '<div class="asom-tag">Parada '+n+(abierta?'':' · todavía cerrada')+'</div>'+
    '<div class="asom-t">'+esc(S.t||'')+'</div>'+
    (S.obj?'<div class="asom-o">'+esc(S.obj)+'</div>':'')+
    '<div class="asom-b"><div class="asom-h">De qué va</div>'+
      '<div class="asom-i">'+esc(S.hoy||'practicar')+'</div></div>'+
    (regla?'<div class="asom-b"><div class="asom-h">La gramática que toca</div>'+
      '<div class="asom-i">'+esc(regla)+'</div></div>':'')+
    (palabras.length?'<div class="asom-b"><div class="asom-h">Palabras nuevas</div>'+
      '<div class="asom-i">'+esc(palabras.slice(0,3).join(' · '))+'</div></div>':'')+
    '<div class="asom-vela">'+
      (abierta
        ? 'Lo demás lo vas viendo dentro, ejercicio por ejercicio.'
        : 'El resto se abre cuando llegues aquí. Primero lo de antes.')+
    '</div>'+
    '<button class="btn'+(abierta?'':' ghost')+'" id="asomir">'+
      (n===actual?'Empezar esta':(abierta?'Ya la pasaste':'Aún no llegas'))+'</button>'+
    '<button class="btn ghost" id="asomcerrar" style="margin-top:8px">Cerrar</button>'+
  '</div>';

  var v=document.createElement('div');
  v.className='asom-velo'; v.id='asomvelo'; v.innerHTML=h;
  document.body.appendChild(v);
  v.onclick=function(e){ if(e.target===v)v.remove(); };
  var cerrar=document.getElementById('asomcerrar');
  if(cerrar)cerrar.onclick=function(){v.remove();};
  var ir=document.getElementById('asomir');
  if(ir)ir.onclick=function(){
    v.remove();
    if(n===actual){ sIdx=idx; it=0; attempts=[]; t0=Date.now(); correr(); }
    else if(abierta)avisito('Ya la pasaste. Lo que se te atoró vuelve solo en una parada de repaso.');
    else avisito('Todavía no llegas aquí. Termina las de antes y se abre sola.');
  };
}

function mapa(){
  var c=progreso();
  var tr=tramoDe(c.parada);

      '<div class="mapdato"><b>'+diasSeguidos(c.dias)+'</b><span>días seguidos</span></div>'+
    '</div></div>';

     '<div class="aqui-pill">Aquí vas · '+c.parada+'</div></div>';

     '<button class="btn" id="seguir">'+
       (!yaPersonalizo()?'Empezar: arma tu personaje'
         :(esRepaso(c.parada)?'Repasar lo que se te atora':'Practicar la parada '+c.parada))+'</button>'+
     (yaPersonalizo()
       ?'<button class="btn ghost" id="miperfil" style="margin-top:8px">Mi avance y mi avatar</button>'
       :'<p class="tiny" style="margin-top:10px">Son unos minutos. Con tus respuestas armo tus frases: '+
        'no son de un libro, salen de tu trabajo.</p>')+
     '</div>';

  APP.innerHTML=h;

  document.getElementById('seguir').onclick=function(){
    // sin sus respuestas, el material sería genérico: mejor mandarlo a armarlo
    if(!yaPersonalizo()){ personalizar(); return; }
    if(esRepaso(c.parada)){ arrancarRepaso(); return; }
    sIdx=(contenidoDe(c.parada)-1)%MAT.length;it=0;attempts=[];t0=Date.now();correr();

  var mp=document.getElementById('miperfil');

  // No se regresa. Lo que se le atoró vuelve solo, en las casillas de repaso.
  APP.querySelectorAll('.lo').forEach(function(g){
    var n=+g.getAttribute('data-n');
    g.style.cursor='pointer';

      if(JEFE_LIBRE){ irALeccionDe(n); return; }   // el jefe entra a donde sea
      asomarseALeccion(n,c.parada);

  });

  // si acaba de avanzar, el muñeco brinca a su nueva loseta
  // la primera vez que ve el tablero, se le explica con el dedo encima
  if(!JEFE_LIBRE&&!D.tutorVisto&&!TUTOR_VIVO&&document.body&&document.body.appendChild){
    setTimeout(arrancarTutor,420);

// la firma se queda en la hoja y el alumno nunca la ve.
var DE_BRIAN=[];
function pedirCorrecciones(cb){
  // sin conexión o sin endpoint: se usa lo último que se guardó, no se vacía.
  // Así el alumno sigue viendo sus tareas aunque abra la app sin internet.
  if(!DATOS_ENDPOINT||!P||!P.nombre){
    try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
    cb&&cb(DE_BRIAN);return;
  }
  fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'correcciones',nombre:P.nombre})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var c=(d&&d.ok&&d.correcciones)||[];
      DE_BRIAN=c;
      try{var g=load();g.deBrian=c;save(g);D=g;}catch(e){}
      cb&&cb(c);
    })
    .catch(function(){
      try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
      cb&&cb(DE_BRIAN);
    });
}
