<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de inglés hablado · English For All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --crema:#F5F1E8;      /* fondo general */
    --crema-2:#EFEADD;    /* bloques secundarios */
    --papel:#FDFBF6;      /* tarjetas */
    --tinta:#2A2724;      /* texto principal */
    --tinta-2:#57534E;    /* texto secundario */
    --tenue:#8A837A;      /* texto terciario */
    --linea:#E2DACA;
    --verde:#1D9E75;      /* acento */
    
    --verde-hondo:#137A59;
    --verde-suave:#E6F3EC;
    --coral:#D85A30;
    --ambar:#C08A22;
    --display:'Fraunces',Georgia,serif;
    --body:'DM Sans',system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:var(--body);line-height:1.55;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .shell{max-width:1140px;margin:0 auto;padding:22px 16px 80px}
  .wrapc{max-width:540px;margin:0 auto}

  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
          border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:20px}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--tenue);margin-bottom:4px}
  .brand{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--tinta)}
  .brand em{font-style:normal;color:var(--verde)}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

  /* ── tarjeta principal ── */
  .qcard{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:26px 22px;
         box-shadow:0 1px 2px rgba(42,39,36,.04),0 8px 24px rgba(42,39,36,.05)}
  .qlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--tenue);margin-bottom:9px}
  .qtxt{font-family:var(--display);font-size:23px;line-height:1.3;font-weight:600;
        letter-spacing:-.015em;margin-bottom:8px;color:var(--tinta)}
  .qsub{font-size:13.5px;color:var(--tinta-2);margin-bottom:20px;line-height:1.55}

  /* ── botones ── */
  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--verde);
       color:#fff;border:0;border-radius:10px;padding:14px;font-size:14.5px;font-weight:700;
       cursor:pointer;font-family:var(--body);transition:background .15s}
  .btn:hover{background:var(--verde-hondo)}
  .btn.ghost{background:none;border:1px solid var(--linea);color:var(--tinta-2);font-weight:500;font-size:13.5px;padding:12px}
  .btn.ghost:hover{background:var(--crema-2);color:var(--tinta)}
  .btn.rec{background:var(--coral)}
  .btn+.btn{margin-top:8px}
  .btn[disabled]{opacity:.5;cursor:default}
  .pulse{width:9px;height:9px;border-radius:50%;background:currentColor}
  .btn.rec .pulse{animation:beat 1s infinite}
  @keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  .mic-big{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:var(--verde);
    color:#fff;border:0;border-radius:40px;padding:19px;font-size:16px;font-weight:700;cursor:pointer;font-family:var(--body)}
  .mic-big:hover{background:var(--verde-hondo)}
  .mic-big.rec{background:var(--coral)}
  .mic-big[disabled]{opacity:.5}
  .ring2{width:11px;height:11px;border-radius:50%;background:currentColor}
  .mic-big.rec .ring2{animation:beat 1s infinite}
  @media(prefers-reduced-motion:reduce){.btn .pulse,.mic-big .ring2{animation:none}}

  /* ── opciones ── */
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pick button{background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:22px;padding:10px 15px;font-family:var(--body);font-size:14px;cursor:pointer;text-align:left}
  .pick button:hover{border-color:var(--verde);background:var(--verde-suave)}
  .pick button.sel{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
  .pick button i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.65;display:block;margin-top:2px}
  .pick button.sel i{opacity:.9}

  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .opt{text-align:left;background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
       border-radius:10px;padding:13px 15px;font-family:var(--display);font-size:16px;cursor:pointer}
  .opt:hover{border-color:var(--verde);background:var(--verde-suave)}
  .opt.ok{background:var(--verde-suave);border-color:var(--verde)}
  .opt.no{background:#FBEDE7;border-color:var(--coral);opacity:.8}

  /* ── bloques de contenido ── */
  .heard{background:var(--crema);border:1px solid var(--linea);border-radius:10px;padding:13px 15px;margin-bottom:12px}
  .hl{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--tenue);margin-bottom:7px}
  .ht{font-family:var(--display);font-size:17px;line-height:1.4;color:var(--tinta)}
  .w-ok{color:var(--verde-hondo)}
  .w-no{color:var(--coral);text-decoration:underline;text-decoration-style:wavy;text-underline-offset:3px}
  .score{display:flex;align-items:center;gap:10px;margin-top:11px}
  .sbar{flex:1;height:6px;background:var(--crema-2);border-radius:3px;overflow:hidden}
  .sbar i{display:block;height:100%;background:var(--verde);border-radius:3px;transition:width .5s}
  .snum{font-family:var(--mono);font-size:11px;color:var(--tinta-2);flex:0 0 auto}

  .said{background:var(--crema);border:1px solid var(--linea);border-radius:10px;padding:11px 13px;
        margin-bottom:7px;font-family:var(--display);font-size:15px}
  .said small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tenue);
              margin-top:4px;text-transform:uppercase}
  .tally{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
         color:var(--verde-hondo);text-align:center;margin:10px 0 12px}
  .typebox{width:100%;background:var(--crema);border:1px solid var(--linea);border-radius:10px;
    color:var(--tinta);padding:12px 13px;font-family:var(--body);font-size:14.5px;resize:vertical;
    min-height:62px;margin-bottom:8px}
  .typebox::placeholder{color:var(--tenue)}
  .tiny{font-size:11.5px;color:var(--tenue);text-align:center;margin-top:11px;line-height:1.5}

  .model{background:var(--crema);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;
         margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
  .model.on{background:var(--verde-suave);border-color:var(--verde)}
  .model .en{font-family:var(--display);font-size:16px;line-height:1.35;color:var(--tinta)}
  .model .es{font-size:11.5px;color:var(--tenue);margin-top:3px}
  .spk{background:var(--papel);border:1px solid var(--linea);color:var(--verde-hondo);border-radius:50%;
       width:32px;height:32px;flex:0 0 32px;cursor:pointer;font-size:11px}
  .spk:hover{background:var(--verde-suave);border-color:var(--verde)}

  .prog{display:flex;gap:4px;margin-bottom:20px}
  .prog i{flex:1;height:3px;border-radius:2px;background:var(--linea)}
  .prog i.on{background:var(--verde)}

  /* ── portada ── */
  .splash{min-height:76vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
          text-align:center;padding:36px 18px;transition:opacity .3s ease}
  .splash.out{opacity:0}
  .sp-mark{width:86px;height:86px;margin-bottom:24px;animation:spin 1.1s cubic-bezier(.22,1,.36,1) both}
  .sp-mark svg{width:100%;height:100%}
  @keyframes spin{from{opacity:0;transform:rotate(-140deg) scale(.82)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sp-greet{font-family:var(--display);font-size:clamp(31px,8.2vw,45px);font-weight:600;letter-spacing:-.03em;
    line-height:1.08;color:var(--tinta);margin-bottom:12px;cursor:pointer;animation:rise .6s .12s ease both;max-width:14ch}
  .sp-nm{color:var(--verde);display:block}
  .sp-es{font-size:clamp(14px,3vw,16px);color:var(--tinta-2);line-height:1.5;max-width:26ch;
    margin-bottom:14px;animation:rise .6s .24s ease both}
  .sp-reg{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--tenue);border:1px solid var(--linea);border-radius:20px;padding:5px 12px;
    margin-bottom:22px;animation:rise .6s .34s ease both}
  .sp-otro{background:none;border:0;font-family:var(--body);font-size:13.5px;color:var(--verde-hondo);
    cursor:pointer;padding:8px 4px;margin-bottom:26px;animation:rise .6s .42s ease both}
  .sp-otro:hover{text-decoration:underline}
  .sp-name{font-family:var(--display);font-size:17px;font-weight:600;color:var(--tenue);animation:rise .6s .5s ease both}
  .sp-cta{margin-top:38px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--tenue);cursor:pointer;animation:pulse2 2.4s 1.1s ease-in-out infinite}
  @keyframes pulse2{0%,100%{opacity:.55}50%{opacity:1}}
  .sp-cuenta{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--linea);margin-top:16px;color:#B8AE9C}
  @media(prefers-reduced-motion:reduce){.sp-mark,.sp-greet,.sp-es,.sp-reg,.sp-otro,.sp-name{animation:none}.sp-cta{animation:none}}

  /* ── prueba de sonido ── */
  .tst{display:flex;gap:13px;align-items:flex-start;background:var(--crema);border:1px solid var(--linea);
       border-radius:12px;padding:15px;margin-bottom:10px}
  .tst-n{font-family:var(--display);font-size:19px;font-weight:600;color:var(--verde);flex:0 0 22px}
  .tst-b{flex:1;min-width:0}
  .tst-t{font-family:var(--display);font-size:17px;margin-bottom:11px}
  .tst-r{font-size:12.5px;line-height:1.5;margin-top:10px}
  .ok2{color:var(--verde-hondo)}
  .ok2 em{font-style:normal;font-family:var(--display);color:var(--tinta)}
  .no2{color:var(--coral)}
  .dgn{background:#FDF4E3;border-left:2px solid var(--ambar);border-radius:0 8px 8px 0;padding:11px 13px;
       font-size:12.5px;color:var(--tinta-2);line-height:1.5}
  .dgn b{display:block;color:#8A6210;font-size:13px;margin-bottom:4px}

  /* ── selector de voz ── */
  .vopt{width:100%;display:flex;align-items:center;gap:12px;background:var(--crema);border:1px solid var(--linea);
    border-radius:12px;padding:15px 16px;margin-bottom:8px;color:var(--tinta);cursor:pointer;
    font-family:var(--body);text-align:left}
  .vopt:hover{border-color:var(--verde);background:var(--verde-suave)}
  .vopt.sel{background:var(--verde-suave);border-color:var(--verde)}
  .vn{font-family:var(--display);font-size:17px;font-weight:600}
  .vp{font-size:12px;color:var(--tinta-2);flex:1}
  .vplay{font-family:var(--mono);font-size:13px;color:var(--verde-hondo);border:1px solid var(--verde);
    border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex:0 0 28px}

  /* ── portada de sesión ── */
  .objx{background:var(--verde-suave);border:1px solid var(--verde);border-radius:12px;padding:14px 16px;
    margin-bottom:14px;font-family:var(--display);font-size:17px;line-height:1.35;color:var(--tinta)}
  .objx span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--verde-hondo);margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:12px;background:var(--crema);border:1px solid var(--linea);border-radius:20px;
    padding:6px 12px;color:var(--tinta-2)}
  .chip b{font-family:var(--mono);color:var(--tinta)}
  .chip.alt{background:none;border-style:dashed;color:var(--tenue)}
  .prev{border-left:2px solid var(--ambar);background:#FDF4E3;border-radius:0 8px 8px 0;padding:12px 14px;
    margin-bottom:16px;font-size:13.5px;color:var(--tinta-2);line-height:1.5}
  .prev span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:#8A6210;margin-bottom:6px}
  .prev em{font-style:normal;font-family:var(--display);color:var(--tinta)}
  .prevlist{margin-bottom:14px}
  .plbl{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:9px}
  .pline{display:flex;gap:11px;align-items:flex-start;background:var(--crema);border:1px solid var(--linea);
    border-radius:10px;padding:11px 13px;margin-bottom:7px}
  .pen{font-family:var(--display);font-size:16px;line-height:1.3}
  .pes{font-size:11.5px;color:var(--tenue);margin-top:3px}
  .tipx{font-size:12.5px;color:var(--tinta-2);line-height:1.5;border-top:1px solid var(--linea);
    padding-top:12px;margin-top:4px}
  .tipx.warn2{color:#8A6210;border-top-color:#E8D9B4}

  /* ── cierre ── */
  .sumcard{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:22px;margin-top:18px}
  .sumcard h3{font-family:var(--display);font-size:19px;font-weight:600;margin-bottom:3px}
  .sumcard .sub{font-size:12.5px;color:var(--tinta-2);margin-bottom:14px}
  .att{border-top:1px solid var(--linea);padding:11px 0;font-size:13px}
  .att:first-of-type{border-top:0}
  .att .tg{font-family:var(--display);font-size:15px}
  .att .hd{font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:3px}
  .code{width:100%;min-height:78px;font-family:var(--mono);font-size:10.5px;border:1px solid var(--linea);
    border-radius:8px;padding:10px;background:var(--crema);resize:vertical;word-break:break-all;color:var(--tinta-2)}
  .actrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .actrow button{font-size:12.5px;font-weight:600;padding:10px 15px;border-radius:8px;border:1px solid var(--linea);
    background:var(--papel);color:var(--tinta);cursor:pointer;font-family:var(--body)}
  .actrow button.p{background:var(--verde);color:#fff;border-color:var(--verde)}
  .why{font-size:11.5px;color:var(--tenue);margin-top:9px;line-height:1.6}
</style>
<style>
  .volver{background:none;border:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--tenue);cursor:pointer;padding:8px 2px;margin-bottom:10px}
  .volver:hover{color:var(--verde-hondo)}
</style>

<script>
(function(){
"use strict";
var VERSION="v4 · 27 ago";

/* ═══════════ almacenamiento ═══════════ */
var KEY='efa_tutor_v2',mem={};
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return mem.d||{perfil:null,sesiones:[]};}
function save(d){mem.d=d;try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function pack(o){try{return btoa(unescape(encodeURIComponent(JSON.stringify(o))));}catch(e){return JSON.stringify(o);}}
var ONLINE=(typeof google!=='undefined'&&google.script&&google.script.run);

/* ═══════════ voz: hablar ═══════════ */
var VOCES=[],VOZ_EN=null,VOZ_ES=null;

function cargarVoces(cb){
  if(!('speechSynthesis' in window)){cb([]);return;}
  var t=0;
  (function intenta(){
    VOCES=speechSynthesis.getVoices()||[];
    if(VOCES.length||t>18){cb(VOCES);return;}
    t++;setTimeout(intenta,150);
  })();
}
function vocesIngles(){
  var en=VOCES.filter(function(v){return /^en(-|_)/i.test(v.lang);});
  // una por variante, para no abrumar con veinte opciones casi iguales
  var vistos={},out=[];
  en.forEach(function(v){
    var k=v.lang.toLowerCase();
    if(!vistos[k]){vistos[k]=1;out.push(v);}
    else if(vistos[k]<2){vistos[k]++;out.push(v);}
  });
  return out.slice(0,6);
}
function etiquetaVoz(v){
  var pais={'en-us':'Estados Unidos','en-gb':'Inglaterra','en-au':'Australia','en-ca':'Canadá',
            'en-in':'India','en-ie':'Irlanda','en-za':'Sudáfrica','en-nz':'Nueva Zelanda'}[v.lang.toLowerCase()]||v.lang;
  return {nombre:v.name.replace(/^(Microsoft|Google|Apple)\s+/,'').split(' ')[0],pais:pais};
}
function elegirVozES(){
  VOZ_ES=VOCES.filter(function(v){return /^es(-|_)/i.test(v.lang);})
              .sort(function(a,b){return (/mx|us/i.test(b.lang)?1:0)-(/mx|us/i.test(a.lang)?1:0);})[0]||null;
}
function aplicarVoz(uri){
  VOZ_EN=VOCES.filter(function(v){return v.voiceURI===uri;})[0]||null;
}

function say(t,lang,cb){
  if(!('speechSynthesis' in window)){cb&&cb();return;}
  try{
    speechSynthesis.cancel();
    hablar(t,lang,cb);
  }catch(e){cb&&cb();}
}
function hablar(t,lang,cb){
  var u=new SpeechSynthesisUtterance(t);
  var es=(lang==='es-MX');
  u.lang=es?'es-MX':'en-US';
  u.rate=es?.98:.78;
  var v=es?VOZ_ES:VOZ_EN;
  if(v)u.voice=v;
  if(cb)u.onend=cb;
  speechSynthesis.speak(u);
}
// varias frases seguidas, sin que se pisen
function decirSeguido(lista){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();}catch(e){}
  lista.forEach(function(p){hablar(p[0],p[1]);});
}

/* ═══════════ voz: escuchar ═══════════ */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var EN_MARCO=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
var SEGURO=(window.isSecureContext!==false)&&location.protocol!=='file:';
var HAY_MIC=!!SR;

// por qué no va a abrir el micrófono, en palabras que se entiendan
function diagnostico(){
  if(!SR)return {ok:false,corto:'Este navegador no reconoce voz',
    largo:'Safari y algunos navegadores de Android no traen reconocimiento de voz. Abre esto en Chrome.'};
  if(EN_MARCO)return {ok:false,corto:'Estás viéndolo dentro de una vista previa',
    largo:'El micrófono solo abre cuando la página está en su propia pestaña. Copia el enlace y ábrelo directo.'};
  if(!SEGURO)return {ok:false,corto:'La página no está en https',
    largo:'Abierta como archivo suelto, el navegador no da acceso al micrófono. Con el enlace del servidor sí funciona.'};
  return {ok:true};
}
function listen(lang,onDone,onErr){
  if(!SR){onErr&&onErr('sin-soporte');return null;}
  var r=new SR();
  r.lang=lang||'en-US';r.interimResults=false;r.maxAlternatives=1;
  r.onresult=function(e){onDone(e.results[0][0].transcript,e.results[0][0].confidence);};
  r.onerror=function(e){onErr&&onErr(e.error);};
  try{r.start();}catch(x){onErr&&onErr('no-inicio');}
  return r;
}


/* ═══════════ grabar audio (respaldo para Android) ═══════════ */
// El reconocimiento de voz falla en muchos Android. La grabación no:
// se graba el audio, se guarda, y Brian lo escucha después.
var HAY_GRAB=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var grabadora=null,trozos=[],streamActivo=null;

function grabarInicio(onListo,onError){
  if(!HAY_GRAB){onError&&onError('sin-soporte');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    streamActivo=st;trozos=[];
    var tipo='';

function norm(s){return String(s).toLowerCase().replace(/[.,!?¿¡;:"']/g,'').replace(/\s+/g,' ').trim();}
function peso(w){return Math.max(1,w.length);}
function comparar(meta,oido){
  var m=norm(meta).split(' ').filter(Boolean), o=norm(oido).split(' ').filter(Boolean);
  var pool=o.slice(), marcas=m.map(function(w){
    var i=pool.indexOf(w);
    if(i>=0){pool.splice(i,1);return true;}
    return false;
  });
  // se pondera por largo de palabra: fallar "dentist" pesa más que comerse "a"
  var total=0,logrado=0;
  m.forEach(function(w,i){total+=peso(w);if(marcas[i])logrado+=peso(w);});
  return {pct:total?Math.round(logrado/total*100):0, marcas:marcas, palabras:m};
}

      '<p class="tiny">No es examen. Es para saber por dónde empezamos contigo.</p></div>';
    document.getElementById('nq').textContent=x.q;
    document.getElementById('ne').textContent=x.es;
    setTimeout(function(){say(x.q,'en-US');},250);
    document.getElementById('oir').onclick=function(){say(x.q,'en-US');};
    var mic=document.getElementById('mic');
    if(mic)mic.onclick=function(){
      var b=this;b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Escuchando…';b.disabled=true;
      listen('en-US',function(t){b.classList.remove('rec');b.disabled=false;b.innerHTML='<span class="ring2"></span> Otra vez';califica(t);},
        function(){b.classList.remove('rec');b.disabled=false;b.innerHTML='<span class="ring2"></span> Otra vez';
          document.getElementById('res').innerHTML='<div class="heard"><span class="no2">No te oí. Escríbelo abajo.</span></div>';});
    };
    document.getElementById('env').onclick=function(){
      var v=document.getElementById('tb').value.trim();
      if(v)califica(v);
    };
    document.getElementById('nose').onclick=function(){resp.push({q:x.q,r:'',ok:false});i++;paso1();};
    ligarAtras(function(){
      if(i>0){var u=resp.pop();if(u&&u.ok)pts-=NIVEL_Q[i-1].vale;i--;paso1();}
      else{epaso=PASOS.length-1;entrevista();}
    });
  }
  function califica(t){
    var x=NIVEL_Q[i],bien=x.ok.test(t);
    if(bien)pts+=x.vale;
    resp.push({q:x.q,r:t,ok:bien});
    document.getElementById('res').innerHTML='<div class="heard"><div class="hl">te entendí</div>'+
      '<div class="ht">'+esc(t)+'</div><div class="tst-r">'+(bien
        ?'<span class="ok2">Eso funciona.</span>':'<span class="no2">Lo anoto. No pasa nada.</span>')+'</div></div>';
    say(bien?'Bien.':'Está bien, lo anoto.','es-MX');
    setTimeout(function(){i++;paso1();},1400);
  }
  function cerrar(){
    var nv=nivelDe(pts);
    edatos.nivel=nv.cod;edatos.nivel_n=nv.n;edatos.nivel_pts=pts;edatos.nivel_resp=resp;
    APP.innerHTML='<div class="qcard"><div class="qlbl">Listo</div>'+
      '<div class="qtxt">Ya sé por dónde empezar contigo.</div>'+
      '<div class="qsub">'+esc(nv.txt)+'</div>'+
      '<div class="objx"><span>Tu punto de partida</span>'+nv.cod+'</div>'+
      '<p class="tiny">Esto no es definitivo. Brian lo confirma cuando te escuche, y se ajusta si hace falta.</p>'+
      '<button class="btn" id="go" style="margin-top:12px">Continuar</button></div>';
    say(nv.txt,'es-MX');
    document.getElementById('go').onclick=cerrarPerfil;
  }
  paso1();
}

function portada(){
  var vuelve=!!P;
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='none';
  var g=saludoDelDia(vuelve);

  function pinta(s){
    var vistos=(D.saludosVistos||[]).length;
    APP.innerHTML='<div class="splash" id="sp">'+
      '<div class="sp-mark">'+
        '<svg viewBox="0 0 96 96" aria-hidden="true">'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="rgba(4,52,44,.13)" stroke-width="5"/>'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="#1D9E75" stroke-width="5" '+
            'stroke-linecap="round" stroke-dasharray="66 185" transform="rotate(-90 48 48)"/>'+
          '<circle cx="48" cy="48" r="9" fill="#1D9E75"/>'+
        '</svg>'+
      '</div>'+
      '<div class="sp-greet" id="gr">'+esc(s.en)+(vuelve?'<span class="sp-nm">'+esc(P.nombre)+'.</span>':'')+'</div>'+
      '<div class="sp-es">'+esc(s.es)+'</div>'+
      '<div class="sp-reg">'+REGISTRO[s.reg]+'</div>'+
      '<button class="sp-otro" id="otro">Otra forma de saludar ↻</button>'+
      '<div class="sp-name">English For All</div>'+
      '<div class="sp-cta" id="cta">Toca para empezar</div>'+
      '<div class="sp-cuenta">'+vistos+' de '+SALUDOS.length+' saludos vistos</div>'+
      '</div>';
    ligar(s);
  }

  var hablado=false,avanzado=false;
  function saludar(s){
    hablado=true;
    var frase=s.en+(vuelve?' '+P.nombre+'.':'');
    decirSeguido([[frase,'en-US'],[s.es.split('—')[0].trim(),'es-MX']]);
  }
  function avanzar(){
    if(avanzado)return;
    avanzado=true;
    if(!hablado)saludar(g);
    D.vista=1;save(D);
    var sp=document.getElementById('sp');
    if(sp)sp.classList.add('out');
    setTimeout(router,340);
  }
  function ligar(s){
    var gr=document.getElementById('gr');
    if(gr)gr.onclick=function(e){e.stopPropagation();saludar(s);};
    var ot=document.getElementById('otro');
    if(ot)ot.onclick=function(e){
      e.stopPropagation();
      g=saludoDelDia(vuelve);
      pinta(g);
      saludar(g);
    };
    var cta=document.getElementById('cta');
    if(cta)cta.onclick=avanzar;
  }

  pinta(g);

  cargarVoces(function(){
    elegirVozES();
    var en=vocesIngles();
    if(en.length&&!VOZ_EN){
      VOZ_EN=(D.voz?en.filter(function(v){return v.voiceURI===D.voz;})[0]:null)||en[0];
    }
    // se intenta de entrada; casi todos los navegadores lo bloquean hasta
    // que hay un toque, y para eso está el listener de abajo
    saludar(g);
  });

  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev,avanzar,{once:true});
  });
}

var PASOS=[
  {id:'nombre',lbl:'Empecemos',q:'¿Cómo te llamas?',sub:'Dímelo en voz alta o escríbelo. Así te llamo de aquí en adelante.',tipo:'texto',ph:'Tu nombre'},
  {id:'trabajo',lbl:'Tu trabajo',q:'¿A qué te dedicas?',sub:'Escríbelo con tus palabras. Si eres dentista, mecánico, ama de casa, estudiante, lo que sea — como tú lo dirías.',tipo:'libre',ph:'Ej: soy dentista / trabajo en una fábrica de plásticos'},

  {id:'meta',lbl:'Tú',q:'¿Para qué quieres el inglés?',sub:'No hay respuesta correcta.',tipo:'pick',ops:METAS}

var epaso=0,edatos={};

function entrevista(){
  var s=PASOS[epaso];
  var h=atras()+'<div class="prog">'+PASOS.map(function(x,i){return '<i class="'+(i<=epaso?'on':'')+'"></i>';}).join('')+'</div>'+
    '<div class="qcard"><div class="qlbl">Paso 2 de 5 · pregunta '+(epaso+1)+' de '+PASOS.length+'</div>'+
    '<div class="qtxt">'+s.q+'</div>'+(s.sub?'<div class="qsub">'+s.sub+'</div>':'<div style="height:8px"></div>');

  if(s.tipo==='libre'){
    h+='<textarea class="typebox" id="tx" placeholder="'+s.ph+'" style="min-height:80px"></textarea>'+
       (HAY_MIC?'<button class="btn ghost" id="dic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
       '<button class="btn" id="ok" style="margin-top:8px">Continuar</button>';
  }else if(s.tipo==='texto'){
    h+='<textarea class="typebox" id="tx" placeholder="'+s.ph+'"></textarea>'+
       (HAY_MIC?'<button class="btn ghost" id="dic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
       '<button class="btn" id="ok" style="margin-top:8px">Continuar</button>';
  }else{
    h+='<div class="pick" id="pk">'+s.ops.map(function(o,i){
      return '<button data-i="'+i+'">'+esc(o[0])+'<i>'+esc(o[1])+'</i></button>';}).join('')+'</div>'+
      '<button class="btn" id="ok" disabled>Continuar</button>';
  }
  h+='<p class="tiny">Esto solo se pregunta una vez. Con tus respuestas armo tu material.</p></div>';
  APP.innerHTML=h;
  ligarAtras(function(){
    if(epaso>0){epaso--;entrevista();}
    else{D.voz=undefined;save(D);router();}
  });

  if(epaso===0){
    decirSeguido([['Muy bien. Ahora quiero saber quién eres.','es-MX'],[s.q,'es-MX']]);
  }else{
    say(s.q,'es-MX');
  }

  if(s.tipo==='texto'||s.tipo==='libre'){
    var d=document.getElementById('dic');
    if(d)d.onclick=function(){
      var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
      listen('es-MX',function(t){
          document.getElementById('tx').value=t;
          b.classList.remove('rec');b.innerHTML='<span class="pulse"></span> Decirlo otra vez';
        },
        function(err){
          b.classList.remove('rec');
          if(err==='no-speech'){b.innerHTML='<span class="pulse"></span> No te oí · intenta otra vez';return;}
          b.disabled=true;
          b.textContent=err==='not-allowed'?'Falta permiso del micrófono · escríbelo'
                       :'Tu navegador no reconoce voz · escríbelo';
        });
    };
    document.getElementById('ok').onclick=function(){
      var v=document.getElementById('tx').value.trim();
      if(!v){
        var av=document.getElementById('avisovacio');
        if(!av){
          av=document.createElement('div');
          av.id='avisovacio';av.className='tst-r';
          av.innerHTML='<span class="no2">Escribe o dicta tu respuesta antes de continuar.</span>';
          document.getElementById('tx').parentNode.insertBefore(av,document.getElementById('tx').nextSibling);
        }
        say('Escribe o dicta tu respuesta antes de continuar.','es-MX');
        return;
      }
      if(s.id==='nombre'){
        edatos.nombre=v.split(/\s+/)[0].replace(/[^\wÁÉÍÓÚÑáéíóúñ]/g,'');
      }else{
        edatos[s.id+'_es']=v;
        edatos[s.id+'_en']=null;   // lo traduce el analizador
      }
      avanzar();
    };
  }else{
    var sel=null;
    APP.querySelectorAll('#pk button').forEach(function(b){
      b.onclick=function(){
        APP.querySelectorAll('#pk button').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');sel=+b.dataset.i;
        document.getElementById('ok').disabled=false;
        say(s.ops[sel][1],'en-US');
      };
    });
    document.getElementById('ok').onclick=function(){
      if(sel===null)return;
      edatos[s.id+'_es']=s.ops[sel][0];
      edatos[s.id+'_en']=s.ops[sel][1];
      avanzar();
    };
  }
}

/* ═══════════ la sesión ═══════════ */
function ultimoDato(){
  // qué rescatar de la vez pasada, para que la sesión no arranque en frío
  if(!D.sesiones.length)return null;
  var r=D.sesiones[D.sesiones.length-1];
  var reps=(r.intentos||[]).filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  if(reps.length){
    var peor=reps.reduce(function(a,b){return b.pct<a.pct?b:a;});
    if(peor.pct<80)return {tipo:'repetir',meta:peor.meta,pct:peor.pct,ses:r.s};
  }
  var libre=(r.intentos||[]).filter(function(a){return a.tipo==='free'&&a.oido;});
  if(libre.length)return {tipo:'dijo',texto:libre[libre.length-1].oido,ses:r.s};
  if((r.intentos||[]).some(function(a){return a.tipo==='pista';}))return {tipo:'pista',ses:r.s};
  return {tipo:'ok',ses:r.s};
}

  var preg=S.items.filter(function(x){return x.k==='ask';}).length;
  var libres=S.items.filter(function(x){return x.k==='free';}).length;
  var u=ultimoDato();

  var h='<div class="qcard">'+
    '<div class="qlbl">Sesión '+(sIdx+1)+' de '+MAT.length+'</div>'+
    '<div class="qtxt" style="font-size:27px">'+esc(S.t)+'</div>'+
    '<div class="qsub">Hola '+esc(P.nombre)+'. '+esc(S.enc)+'</div>'+

    '<div class="objx"><span>Al terminar vas a poder</span>'+esc(S.obj)+'</div>'+

    '<div class="chips">'+
      '<span class="chip"><b>'+modelos.length+'</b> frases para repetir</span>'+
      (preg?'<span class="chip"><b>'+preg+'</b> preguntas que te hago</span>':'')+
      (libres?'<span class="chip"><b>'+libres+'</b> de hablar libre</span>':'')+
      '<span class="chip alt">unos 20 min</span>'+
    '</div>';

  if(u){
    var t={
      repetir:'La vez pasada <em>'+esc(u.meta||'')+'</em> te salió al '+u.pct+'%. Hoy la volvemos a tocar.',
      dijo:'La vez pasada cerraste diciendo: <em>'+esc(u.texto||'')+'</em>',
      pista:'La vez pasada pediste pista. Hoy intenta aguantarte tantito antes de pedirla.',
      ok:'La vez pasada terminaste completa la sesión '+(u.ses+1)+'. Vamos con esta.'
    }[u.tipo];
    h+='<div class="prev"><span>De la vez pasada</span>'+t+'</div>';
  }else{
    h+='<div class="prev"><span>Antes de empezar</span>Es tu primera sesión. No tienes que saber nada: todo lo que te voy a pedir, primero te lo doy yo.</div>';
  }

  h+='<div class="prevlist"><span class="plbl">Lo que vas a oír hoy</span>'+
    modelos.map(function(m,i){
      return '<div class="pline"><button class="spk" data-i="'+i+'" aria-label="Escuchar">▶</button>'+
        '<div><div class="pen">'+esc(m.en)+'</div><div class="pes">'+esc(m.es)+'</div></div></div>';
    }).join('')+'</div>'+
    (S.tip?'<div class="tipx">'+esc(S.tip)+'</div>':'')+
    (HAY_MIC?'':'<div class="tipx warn2">Este navegador no me deja oírte. Vas a practicar en voz alta igual, pero escribiendo lo que dijiste. Se recomienda Chrome.</div>')+
    '<button class="btn" id="go" style="margin-top:14px">Empezar</button>'+
    '<button class="btn ghost" id="atras" style="margin-top:8px">Ver las otras sesiones</button>'+
    '</div>';

  APP.innerHTML=h;
  say('Hola '+P.nombre+'. '+S.enc,'es-MX');
  APP.querySelectorAll('.spk').forEach(function(b){
    b.onclick=function(){say(modelos[+b.dataset.i].en,'en-US');};
  });
  document.getElementById('go').onclick=function(){t0=Date.now();vistos={};paso();};
  document.getElementById('atras').onclick=function(){speechSynthesis&&speechSynthesis.cancel();sIdx=null;router();};
}

function correr(){
  if(it===0&&!attempts.length){portadaSesion();return;}
  paso();
}

var vistos={};
function paso(){
  var S=MAT[sIdx];
  if(it>=S.items.length){cierre();return;}
  var x=S.items[it];
  var h=atras()+'<div class="prog">'+S.items.map(function(_,i){return '<i class="'+(i<=it?'on':'')+'"></i>';}).join('')+'</div><div class="qcard">';

  if(x.k==='model'){
    h+='<div class="qlbl">Escucha y repite en voz alta</div>'+
       '<div class="qtxt">'+esc(x.en)+'</div><div class="qsub">'+esc(x.es)+'</div>'+
       '<button class="btn ghost" id="oir" style="margin-bottom:10px">▶ Oírla otra vez</button>'+
       '<div id="res"></div>'+
       '<button class="mic-big" id="mic"><span class="ring2"></span> Tocar y repetir</button>'+
       '<p class="tiny">Habla claro y sin prisa. Si el micrófono falla, hay un botón para seguir.</p>'+
       '<button class="btn ghost" id="skip" style="margin-top:10px">Ya la dije · siguiente</button>';
  }else if(x.k==='ask'){
    h+='<div class="qlbl">Te pregunto · contesta hablando</div>'+
       '<div class="qtxt">'+esc(x.q)+'</div><div class="qsub">'+esc(x.es)+'</div>'+
       '<button class="btn ghost" id="oir" style="margin-bottom:10px">▶ Oír la pregunta</button>'+
       '<div id="res"></div>'+
       '<button class="mic-big" id="mic"><span class="ring2"></span> Tocar y contestar</button>'+
       '<button class="btn ghost" id="pista" style="margin-top:10px">No sé · dame la pista</button>'+
       '<button class="btn ghost" id="skip" style="margin-top:8px">Saltar esta</button>';
  }else{
    h+='<div class="qlbl">Tu turno · lo que puedas</div>'+
       '<div class="qtxt">'+esc(x.q)+'</div><div class="qsub">'+esc(x.es)+'</div>'+
       '<div id="res"></div>'+
       '<button class="mic-big" id="mic"><span class="ring2"></span> Tocar y hablar</button>'+
       '<p class="tiny">Puedes hablar varias veces. No hay mínimo: una frase también cuenta.</p>'+
       '<button class="btn ghost" id="skip" style="margin-top:10px">Ya dije todo lo que puedo</button>';
  }
  APP.innerHTML=h+'</div>';

  var oir=document.getElementById('oir');
  if(oir)oir.onclick=function(){say(x.k==='model'?x.en:x.q,'en-US');};

  // el tutor explica en español la primera vez que aparece cada tipo de ejercicio
  var guias={
    model:'Yo digo la frase, tú la repites en voz alta. Toca el botón verde cuando estés lista para hablar.',
    ask:'Ahora te voy a hacer preguntas. Contéstame hablando, con lo que ya practicamos.',
    free:'Este es tu momento libre. Dime lo que puedas, aunque sea una frase. Cuando ya no tengas más, me avisas.'
  };
  if(!vistos[x.k]){
    vistos[x.k]=1;
    if(x.k==='free'){say(guias.free,'es-MX');}
    else{decirSeguido([[guias[x.k],'es-MX'],[x.k==='model'?x.en:x.q,'en-US']]);}
  }else if(x.k!=='free'){
    setTimeout(function(){say(x.k==='model'?x.en:x.q,'en-US');},300);
  }

  var pb=document.getElementById('pista');
  if(pb)pb.onclick=function(){
    document.getElementById('res').innerHTML='<div class="heard"><div class="hl">di esto</div><div class="ht">'+esc(x.pista)+'</div></div>';
    say(x.pista,'en-US');
    attempts.push({tipo:'pista',meta:x.pista,oido:'',pct:null});
    pb.remove();
  };

  document.getElementById('mic').onclick=function(){
    var b=this;
    if(!HAY_MIC){grabarPaso(x,b);return;}
    b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Escuchando…';b.disabled=true;
    listen('en-US',function(t){
      b.classList.remove('rec');b.disabled=false;b.innerHTML='<span class="ring2"></span> Otra vez';
      registrar(x,t);
    },function(err){
      b.classList.remove('rec');b.disabled=false;
      if(err==='no-speech'){b.innerHTML='<span class="ring2"></span> No te oí · intenta otra vez';return;}
      HAY_MIC=false;grabarPaso(x,b);
    });
  };
  document.getElementById('skip').onclick=function(){it++;paso();};
  ligarAtras(function(){
    if(it>0){it--;paso();}
    else{it=0;attempts=[];portadaSesion();}
  });
}


function grabarPaso(x,b){
  if(!HAY_GRAB){escribir(x);return;}
  var r=document.getElementById('res');
  if(b.dataset.grabando==='1'){
    b.dataset.grabando='';
    b.classList.remove('rec');b.innerHTML='<span class="ring2"></span> Grabar otra vez';
    grabarFin();
    return;
  }
  r.innerHTML='<div class="heard"><div class="hl">modo grabación</div>'+
    '<div style="font-size:13px;color:var(--tinta-2);line-height:1.5">Tu teléfono no reconoce voz, '+
    'pero sí puede grabarte. Di la frase en voz alta y toca otra vez para parar. Brian la escucha después.</div></div>';
  grabarInicio(function(blob){
    var url=URL.createObjectURL(blob);
    blobABase64(blob,function(b64){
      attempts.push({tipo:x.k+'-audio',meta:x.k==='model'?x.en:x.q,oido:'[audio grabado]',pct:null,
                     audio:b64,audiotipo:blob.type,seg:Math.round(blob.size/2000)});
      r.innerHTML='<div class="heard"><div class="hl">tu grabación</div>'+
        '<audio controls src="'+url+'" style="width:100%;margin-top:4px"></audio>'+
        '<div class="tst-r"><span class="ok2">Guardada. Se le manda a Brian con la sesión.</span></div></div>'+
        '<button class="btn" id="sig">Siguiente</button>';
      document.getElementById('sig').onclick=function(){it++;paso();};
    });
  },function(err){
    var m=err==='NotAllowedError'?'No diste permiso al micrófono. Revisa el candado de la barra de direcciones.'
         :'Tu navegador no deja grabar. Puedes escribir lo que dijiste.';
    r.innerHTML='<div class="heard"><span class="no2">'+m+'</span></div>';
    HAY_GRAB=false;escribir(x);
  });
  b.dataset.grabando='1';
  b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Grabando… toca para parar';
}

function escribir(x){
  var r=document.getElementById('res');
  if(document.getElementById('esc'))return;
  r.innerHTML='<div class="heard"><div class="hl">el micrófono no está disponible</div>'+
    '<div style="font-size:13px;color:rgba(245,242,236,.75);margin-bottom:9px">Dilo en voz alta de todos modos, y luego escríbelo aquí.</div>'+
    '<textarea class="typebox" id="esc" placeholder="Lo que dijiste…"></textarea>'+
    '<button class="btn" id="okesc">Registrar</button></div>';
  document.getElementById('okesc').onclick=function(){
    var v=document.getElementById('esc').value.trim();
    if(!v)return;registrar(x,v);
  };
}

function registrar(x,t){
  var meta=x.k==='model'?x.en:'';
  var cmp=meta?comparar(meta,t):null;
  attempts.push({tipo:x.k,meta:meta||x.q,oido:t,pct:cmp?cmp.pct:null});
  var r=document.getElementById('res');
  var h='<div class="heard"><div class="hl">te entendí</div><div class="ht">'+esc(t)+'</div>';
  if(cmp){
    h+='<div class="hl" style="margin-top:11px">contra la frase meta</div><div class="ht">'+pintar(meta,cmp)+'</div>'+
       '<div class="score"><div class="sbar"><i style="width:'+cmp.pct+'%"></i></div><span class="snum">'+cmp.pct+'%</span></div>';
  }
  h+='</div>';
  if(cmp&&cmp.pct>=80){
    h+='<button class="btn" id="sig">Bien · siguiente</button>';
    say(['Muy bien.','Eso es.','Así se dice.'][Math.floor(Math.random()*3)],'es-MX');
  }
  else if(cmp){
    h+='<button class="btn ghost" id="otra" style="margin-bottom:8px">Intentar otra vez</button><button class="btn" id="sig">Seguir de todos modos</button>';
    say('Casi. Escúchala otra vez y repítela sin prisa.','es-MX');
  }
  else h+='<button class="btn" id="sig">Siguiente</button>';
  r.innerHTML=h;
  var o=document.getElementById('otra');
  if(o)o.onclick=function(){say(meta,'en-US');r.innerHTML='';};
  document.getElementById('sig').onclick=function(){it++;paso();};
}

/* ═══════════ cierre y envío ═══════════ */
function cierre(){
  var S=MAT[sIdx];
  var dichas=attempts.filter(function(a){return a.oido&&a.tipo!=='pista';});
  var libres=attempts.filter(function(a){return a.tipo==='free'&&a.oido;});
  var conPct=attempts.filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  var prom=conPct.length?Math.round(conPct.reduce(function(s,a){return s+a.pct;},0)/conPct.length):null;
  var pistas=attempts.filter(function(a){return a.tipo==='pista';}).length;
  var pal=dichas.map(function(a){return a.oido;}).join(' ').trim().split(/\s+/).filter(Boolean).length;

  var rec={
    alumna:(P.nombre||'alumno').toLowerCase().replace(/[^a-z0-9]/g,'')||'alumno',
    nombre:P.nombre,nivel:'speaking',s:sIdx,titulo:S.t,
    fecha:new Date().toISOString().slice(0,10),hora:new Date().toTimeString().slice(0,5),
    frases:dichas.map(function(a){return a.oido;}),
    palabras:pal,pista:pistas>0,cierre:'participante',
    dur:Math.round((Date.now()-t0)/1000),
    perfil:P,intentos:attempts.slice(),promedio_repeticion:prom
  };
  D.sesiones.push(rec);save(D);

  var msg=libres.length?'Hablaste '+dichas.length+' veces y produjiste '+pal+' palabras.'
        :'Practicaste '+dichas.length+' frases. La próxima intentamos una tuya.';

  var h='<div class="qcard"><div class="qlbl">Cierre</div><div class="qtxt">Buen trabajo, '+esc(P.nombre)+'.</div>'+
    '<div class="qsub">'+msg+(prom!==null?' Tus repeticiones salieron al '+prom+'% de parecido con el modelo.':'')+'</div>'+
    '<button class="btn" id="menu">Volver a las sesiones</button></div>'+
    '<div class="sumcard"><h3>Lo que se le manda a tu maestro</h3><p class="sub">Cada intento, tal como salió. Brian lo revisa y te devuelve máximo tres correcciones.</p>'+
    attempts.map(function(a){
      if(a.tipo==='pista')return '<div class="att"><span class="hd">pidió pista · '+esc(a.meta)+'</span></div>';
      return '<div class="att"><div class="tg">'+esc(a.oido||'—')+'</div>'+
        '<div class="hd">'+(a.tipo==='model'?'repetición · meta: '+esc(a.meta):(a.tipo==='ask'?'respuesta a: '+esc(a.meta):'producción libre'))+
        (a.pct!==null&&a.pct!==undefined?' · '+a.pct+'%':'')+'</div></div>';
    }).join('')+
    '<p class="why" id="stat"></p><div class="actrow" id="manual"'+(ONLINE?' hidden':'')+'>'+
    '<button class="p" id="mail">Enviar por correo</button><button id="cop">Copiar código</button></div>'+
    '<textarea class="code" id="cd" readonly'+(ONLINE?' hidden':'')+'></textarea></div>';
  APP.innerHTML=h;
  say('Buen trabajo, '+P.nombre+'. '+msg+' Nos vemos en la siguiente.','es-MX');

  var codigo=pack(rec);
  document.getElementById('cd').value=codigo;
  document.getElementById('menu').onclick=function(){sIdx=null;router();};

  if(ONLINE){
    document.getElementById('stat').textContent='Enviando…';
    google.script.run
      .withSuccessHandler(function(r){document.getElementById('stat').textContent=(r&&r.ok)?'✓ Enviada. Brian ya la tiene.':'No la aceptó el servidor.';})
      .withFailureHandler(function(){
        document.getElementById('stat').textContent='No se pudo conectar. Mándala por correo.';
        document.getElementById('manual').hidden=false;document.getElementById('cd').hidden=false;
      })
      .guardarSesion(rec);
  }
  var m=document.getElementById('mail');
  if(m)m.onclick=function(){
    var cuerpo='Sesión '+(sIdx+1)+' — '+S.t+'\n'+P.nombre+' · '+rec.fecha+'\n\n'+
      'Perfil: '+P.trabajo_es+', '+P.lugar_es+', '+P.accion_es+'\n'+
      'Intentos:\n'+attempts.map(function(a){
        return '· '+(a.tipo==='pista'?'[pista] '+a.meta:(a.oido+(a.pct!=null?' ('+a.pct+'%)':'')+' ← '+a.meta));
      }).join('\n')+'\n\n--- código para el panel ---\n'+codigo;
    window.location.href='mailto:'+DESTINO+'?subject='+encodeURIComponent('Speaking '+(sIdx+1)+' · '+P.nombre)+'&body='+encodeURIComponent(cuerpo);
  };
  var c=document.getElementById('cop');
  if(c)c.onclick=function(){
    var t=document.getElementById('cd');t.select();
    try{document.execCommand('copy');document.getElementById('stat').textContent='Código copiado.';}catch(x){}
  };
}

/* arranque */
if(P){sIdx=null;}
router();
})();
</script>
